<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Platform</title>
  <link rel="stylesheet" href="themes/standard.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e94560">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a2744;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    h1 { font-size: 1.5rem; margin-bottom: .4rem; color: #1a2744; }
    .sub { color: #888; font-size: .9rem; margin-bottom: 2rem; }

    input[type=email] {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: .75rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type=email]:focus { border-color: #e8445a; }

    .btn {
      width: 100%;
      padding: .8rem;
      background: #e8445a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #c73349; }
    .btn:disabled { background: #ccc; cursor: default; }

    .msg {
      margin-top: 1rem;
      font-size: .88rem;
      min-height: 1.2em;
    }
    .msg.ok  { color: #1a6b1e; }
    .msg.err { color: #c73349; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗺️ Quiz Platform</h1>
    <p class="sub">GPS-quiz og opgaverum til events og arrangementer</p>

    <form id="login-form" onsubmit="sendLink(event)">
      <input type="email" id="email" placeholder="Din e-mailadresse" required autocomplete="email">
      <button class="btn" type="submit" id="send-btn">Send login-link</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    async function sendLink(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('send-btn');
      const msg   = document.getElementById('msg');

      btn.disabled = true;
      btn.textContent = 'Sender…';
      msg.className = 'msg';
      msg.textContent = '';

      const error = await signInWithMagicLink(email);

      if (error) {
        msg.className = 'msg err';
        msg.textContent = 'Fejl: ' + error.message;
        btn.disabled = false;
        btn.textContent = 'Send login-link';
      } else {
        msg.className = 'msg ok';
        msg.textContent = '✅ Tjek din indbakke – klik linket i mailen.';
        btn.textContent = 'Sendt!';
      }
    }

    // Hvis brugeren allerede er logget ind → gå til dashboard
    (async () => {
      const session = await getSession();
      if (session) location.href = 'app/dashboard.html';
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
