<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunder – Quiz Platform</title>
<script src="../vendor/supabase.js"></script>
<script src="../vendor/qrcode.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #eef1f6;
    --ink:       #16213e;
    --ink-2:     #0f3460;
    --accent:    #e94560;
    --text-ink:  #eaeaea;
    --text-dim:  #8892a4;
    --radius-lg: 18px;
    --radius-sm: 8px;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex;
  }

  #sidebar {
    width: 230px; flex-shrink: 0;
    background: var(--ink); color: var(--text-ink);
    display: flex; flex-direction: column;
    padding: 1.5rem 0;
    position: sticky; top: 0; height: 100vh;
  }
  #sidebar .logo { font-size: 1.05rem; font-weight: 700; padding: 0 1.5rem 1.75rem; }
  nav.route { padding: 0 0 0 1.5rem; flex: 1; position: relative; }
  nav.route::before {
    content: ''; position: absolute; left: 1.95rem; top: .6rem; bottom: .6rem;
    width: 2px; background: rgba(255,255,255,.12);
  }
  .route-item {
    display: flex; align-items: center; gap: .75rem;
    padding: .65rem .75rem .65rem 0;
    color: var(--text-dim); text-decoration: none;
    font-size: .92rem; font-weight: 600;
  }
  .route-item .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0;
    border: 3px solid var(--ink);
  }
  .route-item.active { color: #fff; }
  .route-item.active .dot { background: var(--accent); }
  .route-item:hover:not(.active) { color: #cfd6e4; }
  #sidebar .signout { padding: 0 1.5rem; margin-top: auto; }
  #sidebar .signout button {
    width: 100%; padding: .6rem; border-radius: var(--radius-sm);
    background: rgba(255,255,255,.08); color: var(--text-ink);
    border: none; font-size: .85rem; cursor: pointer;
  }
  #sidebar .signout button:hover { background: rgba(255,255,255,.15); }

  #mobile-topbar { display: none; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #sidebar { display: none; }
    #mobile-topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--ink); color: #fff; padding: .85rem 1rem;
    }
    #mobile-topbar .logo { font-weight: 700; font-size: 1rem; }
    #mobile-topbar nav { display: flex; gap: 1rem; font-size: .85rem; }
    #mobile-topbar nav a { color: var(--text-dim); text-decoration: none; }
    #mobile-topbar nav a.active { color: #fff; }
  }

  main { flex: 1; padding: 2.25rem 2.5rem; max-width: 1100px; display: flex; flex-direction: column; }
  @media (max-width: 760px) { main { padding: 1.25rem; } }

  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .25rem; }
  .lead { color: #5b6476; font-size: .9rem; margin-bottom: 1.5rem; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: #fff; border-radius: var(--radius-lg); padding: 1.4rem; }

  .btn {
    padding: .6rem 1rem; border-radius: var(--radius-sm); border: none;
    font-size: .84rem; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #d13950; }
  .btn-outline { background: #fff; color: var(--ink); border: 1.5px solid #dadfe8; }
  .btn-sm { padding: .4rem .7rem; font-size: .76rem; border-radius: 6px; }
  .btn-danger-ghost { background: #f8dde1; color: #9a2f3d; }
  .btn-danger-ghost:hover { background: #f3c6cc; }
  .btn-ghost-light { background: #eef1f6; color: var(--ink); }
  .btn-green { background: #dcf5e3; color: #1a7a3a; }

  input, textarea { width: 100%; padding: .6rem; border: 1px solid #dadfe8; border-radius: 8px; font-size: .88rem; font-family: inherit; }
  label { font-size: .78rem; color: #5b6476; display: block; margin: .6rem 0 .25rem; }

  #search { margin-bottom: .9rem; }

  .customer-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: .65rem .5rem; border-radius: 10px; cursor: pointer;
  }
  .customer-row:hover { background: #f3f5f9; }
  .customer-row.active { background: #fdeef0; }
  .customer-row h3 { font-size: .9rem; font-weight: 700; }
  .customer-row p { font-size: .76rem; color: #9aa2b1; }

  .empty { text-align: center; color: #9aa2b1; padding: 2rem 1rem; }

  .quiz-mini {
    display: flex; justify-content: space-between; align-items: center;
    padding: .7rem 0; border-bottom: 1px solid #f0f1f5; font-size: .88rem; gap: .5rem;
  }
  .quiz-mini:last-child { border-bottom: none; }

  .badge {
    display: inline-block; padding: .15rem .55rem; border-radius: 20px;
    font-size: .7rem; font-weight: 700; white-space: nowrap;
  }
  .badge-kladde    { background: #e9ebf0; color: #5b6476; }
  .badge-testing   { background: #fdf0d5; color: #9a6b0a; }
  .badge-aktiv     { background: #dcf5e3; color: #1a7a3a; }
  .badge-arkiveret { background: #f3dde0; color: #9a2f3d; }

  .pin-status {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .78rem; padding: .25rem .6rem; border-radius: 20px;
  }
  .pin-set   { background: #dcf5e3; color: #1a7a3a; }
  .pin-unset { background: #f3dde0; color: #9a2f3d; }

  .action-bar {
    display: flex; gap: .4rem; flex-wrap: wrap;
    padding: .75rem 0; border-bottom: 1px solid #f0f1f5;
    margin-bottom: .75rem;
  }

  /* QR modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.5); align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 1.5rem;
    width: 90%; display: flex; flex-direction: column; gap: .5rem;
  }

  #detail-empty { color: #9aa2b1; text-align: center; padding: 3rem 1rem; }

  @media print {
    body > *:not(#qr-modal) { display: none !important; }
    #qr-modal { display: flex !important; position: static; background: none; }
    .modal-box { box-shadow: none; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">🗺️ Quiz Platform</div>
  <nav class="route">
    <a href="overview.html" class="route-item"><span class="dot"></span> Oversigt</a>
    <a href="customers.html" class="route-item active"><span class="dot"></span> Kunder</a>
    <a href="dashboard.html" class="route-item"><span class="dot"></span> Alle løb</a>
  </nav>
  <div class="signout"><button onclick="signOut()">Log ud</button></div>
</div>

<div id="mobile-topbar">
  <span class="logo">🗺️ Quiz Platform</span>
  <nav>
    <a href="overview.html">Oversigt</a>
    <a href="customers.html" class="active">Kunder</a>
    <a href="dashboard.html">Alle løb</a>
  </nav>
</div>

<main>
  <h1>Kunder</h1>
  <p class="lead">Administrér kunder, PIN-koder og løb.</p>

  <div class="layout">
    <!-- Venstre: kundeliste -->
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;">
        <strong style="font-size:.9rem;">Kunder</strong>
        <button class="btn btn-primary btn-sm" onclick="openNewCustomer()">+ Ny kunde</button>
      </div>
      <input id="search" placeholder="Søg på navn, email eller firma…" oninput="renderList()">
      <div id="loading">Indlæser…</div>
      <div id="customer-list" style="display:none;"></div>
    </div>

    <!-- Højre: detaljer -->
    <div class="panel">
      <div id="detail-empty" class="empty">Vælg en kunde for at se detaljer.</div>
      <div id="detail-content" style="display:none;">

        <!-- Navn + redigér -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem;">
          <h2 id="detail-name" style="font-size:1.15rem;"></h2>
          <button class="btn btn-sm btn-outline" onclick="editCustomer()">✏️ Redigér</button>
        </div>
        <p id="detail-email" style="font-size:.85rem;color:#5b6476;margin-bottom:.15rem;"></p>
        <p id="detail-phone" style="font-size:.85rem;color:#5b6476;margin-bottom:.15rem;"></p>
        <p id="detail-company" style="font-size:.85rem;color:#5b6476;margin-bottom:.75rem;"></p>

        <!-- PIN-status + handlinger -->
        <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem;">
          <span id="pin-status-badge" class="pin-status pin-unset">🔴 Ingen PIN</span>
          <button class="btn btn-sm btn-outline" onclick="openPin()">🔑 Sæt PIN</button>
        </div>

        <!-- Del-knapper til kunden -->
        <div class="action-bar">
          <button class="btn btn-sm btn-ghost-light" onclick="copyLoginLink()">📋 Kopiér login-link</button>
          <button class="btn btn-sm btn-ghost-light" onclick="showLoginQR()">📱 QR til login</button>
          <button class="btn btn-sm btn-ghost-light" onclick="mailLoginLink()">📧 Send login-link</button>
        </div>

        <!-- Noter -->
        <label>Noter (kun synligt for dig)</label>
        <textarea id="detail-notes" rows="3" onchange="saveNotes()"></textarea>

        <!-- Løb -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;margin-bottom:.5rem;">
          <strong style="font-size:.88rem;">Løb</strong>
          <button class="btn btn-sm btn-ghost-light" onclick="newQuizForCustomer()">+ Nyt løb</button>
        </div>
        <div id="detail-quizzes"></div>
      </div>
    </div>
  </div>
</main>

<!-- Opret/redigér kunde -->
<div id="cust-modal" class="modal-overlay" onclick="if(event.target===this)closeCustomerModal()">
  <div class="modal-box" style="max-width:400px;">
    <h3 id="cust-modal-title">Ny kunde</h3>
    <label>Navn *</label>
    <input id="cf-name" placeholder="Fx: Lions Club Auning">
    <label>Email</label>
    <input id="cf-email" type="email" placeholder="navn@eksempel.dk">
    <label>Telefon</label>
    <input id="cf-phone" placeholder="12345678">
    <label>Firma / forening</label>
    <input id="cf-company" placeholder="Valgfrit">
    <div style="display:flex;gap:.5rem;margin-top:1rem;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveCustomer()">Gem</button>
      <button class="btn" style="background:#eee;color:#333;" onclick="closeCustomerModal()">Annuller</button>
    </div>
    <p id="cust-msg" style="font-size:.82rem;color:#c0392b;margin:0;min-height:1rem;"></p>
  </div>
</div>

<!-- PIN modal -->
<div id="pin-modal" class="modal-overlay" onclick="if(event.target===this)closePin()">
  <div class="modal-box" style="max-width:380px;">
    <h3>🔑 Kunde-PIN – <span id="pin-modal-title"></span></h3>
    <label>Ny PIN (6–8 cifre)</label>
    <input id="pin-new" type="text" inputmode="numeric" maxlength="8" placeholder="••••••"
      style="font-size:1.1rem;letter-spacing:.3rem;font-weight:700;">
    <label>Udløber (valgfrit)</label>
    <input id="pin-expires" type="datetime-local">
    <div style="display:flex;gap:.5rem;margin-top:.5rem;">
      <button class="btn btn-primary" style="flex:1;" onclick="savePin()">Gem PIN</button>
      <button class="btn" style="background:#eee;color:#333;" onclick="closePin()">Luk</button>
    </div>
    <p id="pin-msg" style="font-size:.82rem;color:#555;margin:0;min-height:1rem;"></p>
  </div>
</div>

<!-- QR modal -->
<div id="qr-modal" class="modal-overlay" onclick="if(event.target===this)closeQR()">
  <div class="modal-box" style="max-width:320px;text-align:center;">
    <h3 id="qr-title"></h3>
    <div id="qr-canvas" style="margin:.75rem auto;"></div>
    <div id="qr-url" style="font-size:.7rem;color:#5b6476;word-break:break-all;margin-bottom:.75rem;"></div>
    <div style="display:flex;gap:.5rem;justify-content:center;">
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-sm btn-outline" onclick="closeQR()">Luk</button>
    </div>
  </div>
</div>

<script>
let customers = []
let activeId  = null
let editingId = null

// ── Init ──────────────────────────────────────────────────────
;(async () => {
  const session = await getSession()
  if (!session) { location.href = 'login.html'; return; }
  if (session.type === 'pin') {
    if (!session.is_admin) { location.href = 'customer-overview.html'; return; }
    activatePinClient()
  }
  await loadCustomers()
})()

async function loadCustomers() {
  const { data, error } = await sb.schema('quiz').from('customers')
    .select('*').order('created_at', { ascending: false })
  document.getElementById('loading').style.display = 'none'
  document.getElementById('customer-list').style.display = 'block'
  if (error) {
    document.getElementById('customer-list').innerHTML =
      `<p style="color:red;font-size:.85rem;">Fejl: ${error.message}</p>`
    return
  }
  customers = data ?? []
  renderList()
}

function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase()
  const filtered = !q ? customers : customers.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q) ||
    (c.company||'').toLowerCase().includes(q))

  const el = document.getElementById('customer-list')
  if (!filtered.length) {
    el.innerHTML = `<div class="empty">${customers.length ? 'Ingen match.' : 'Ingen kunder endnu.'}</div>`
    return
  }
  el.innerHTML = filtered.map(c => `
    <div class="customer-row ${c.id===activeId?'active':''}" onclick="selectCustomer('${c.id}')">
      <div>
        <h3>${escHtml(c.name)}</h3>
        <p>${escHtml(c.company || c.email || '')}</p>
      </div>
      <span class="pin-status ${c.pin_hash ? 'pin-set' : 'pin-unset'}" style="font-size:.7rem;">
        ${c.pin_hash ? '🟢' : '🔴'}
      </span>
    </div>`).join('')
}

async function selectCustomer(id) {
  activeId = id
  renderList()
  const c = customers.find(x => x.id === id)
  if (!c) return

  document.getElementById('detail-empty').style.display = 'none'
  document.getElementById('detail-content').style.display = 'block'
  document.getElementById('detail-name').textContent = c.name
  document.getElementById('detail-email').textContent = c.email ? '✉️ ' + c.email : ''
  document.getElementById('detail-phone').textContent = c.phone ? '📞 ' + c.phone : ''
  document.getElementById('detail-company').textContent = c.company ? '🏢 ' + c.company : ''
  document.getElementById('detail-notes').value = c.notes || ''

  const badge = document.getElementById('pin-status-badge')
  if (c.pin_hash) {
    badge.textContent = c.pin_expires_at
      ? '🟢 PIN sat (udløber ' + new Date(c.pin_expires_at).toLocaleDateString('da-DK') + ')'
      : '🟢 PIN sat'
    badge.className = 'pin-status pin-set'
  } else {
    badge.textContent = '🔴 Ingen PIN'
    badge.className = 'pin-status pin-unset'
  }

  await loadCustomerQuizzes(id)
}

let quizCache = {}
const quizTitle = id => quizCache[id]?.title || '(uden titel)'

async function loadCustomerQuizzes(id) {
  const el = document.getElementById('detail-quizzes')
  el.innerHTML = '<p style="color:#9aa2b1;font-size:.85rem;">Indlæser…</p>'
  const { data: quizzes, error } = await sb.schema('quiz').from('quizzes')
    .select('id, title, status, created_at').eq('customer_id', id)
    .order('created_at', { ascending: false })

  if (error) { el.innerHTML = `<p style="color:red;font-size:.85rem;">Fejl: ${error.message}</p>`; return; }
  if (!quizzes?.length) { el.innerHTML = '<p style="color:#9aa2b1;font-size:.85rem;">Ingen løb endnu.</p>'; return; }

  quizzes.forEach(q => { quizCache[q.id] = q })
  el.innerHTML = quizzes.map(q => `
    <div class="quiz-mini">
      <div>
        <a href="editor.html?q=${q.id}" style="color:#16213e;text-decoration:none;font-weight:700;">${escHtml(q.title || '(uden titel)')}</a>
        <span class="badge badge-${q.status}" style="margin-left:.4rem;">${labelStatus(q.status)}</span>
      </div>
      <div style="display:flex;gap:.3rem;flex-wrap:wrap;">
        <a href="editor.html?q=${q.id}" class="btn btn-sm btn-outline">✏️</a>
        <button class="btn btn-sm btn-ghost-light" onclick="copyScoreboard('${q.id}')" title="Kopiér scoreboard-link">📋</button>
        <button class="btn btn-sm btn-ghost-light" onclick="showScoreboardQR('${q.id}')">📱</button>
        <button class="btn btn-sm btn-ghost-light" onclick="mailQuizLinks('${q.id}')">📧</button>
        <button class="btn btn-sm btn-danger-ghost" onclick="deleteQuiz('${q.id}')">🗑</button>
      </div>
    </div>`).join('')
}

// ── Del-knapper ───────────────────────────────────────────────
function getLoginUrl(customerId) {
  return location.origin + location.pathname.replace('customers.html','login.html') + '?c=' + customerId
}
function getScoreboardUrl(quizId) {
  return location.origin + location.pathname.replace('app/customers.html','board/scoreboard.html') + '?q=' + quizId
}

function copyLoginLink() {
  if (!activeId) return
  navigator.clipboard.writeText(getLoginUrl(activeId))
    .then(() => alert('✅ Login-link kopieret'))
}

function showLoginQR() {
  if (!activeId) return
  const c = customers.find(x => x.id === activeId)
  const url = getLoginUrl(activeId)
  showQR(url, 'Login – ' + (c?.name || ''))
}

function mailLoginLink() {
  if (!activeId) return
  const c = customers.find(x => x.id === activeId)
  const url = getLoginUrl(activeId)
  const subject = encodeURIComponent('Adgang til Quiz Platform')
  const body = encodeURIComponent(
    'Hej ' + (c?.name || '') + ',\n\n' +
    'Her er dit login-link til Quiz Platform:\n' + url +
    '\n\nBrug din PIN-kode for at logge ind.\n\nMvh. Quiz Platform'
  )
  window.open('mailto:' + (c?.email || '') + '?subject=' + subject + '&body=' + body)
}

function copyScoreboard(quizId) {
  navigator.clipboard.writeText(getScoreboardUrl(quizId))
    .then(() => alert('✅ Scoreboard-link kopieret'))
}

function showScoreboardQR(quizId) {
  showQR(getScoreboardUrl(quizId), 'Scoreboard – ' + quizTitle(quizId))
}

function mailQuizLinks(quizId) {
  if (!activeId) return
  const title = quizTitle(quizId)
  const c = customers.find(x => x.id === activeId)
  const scoreUrl = getScoreboardUrl(quizId)
  const editorUrl = location.origin + location.pathname.replace('customers.html','editor.html') + '?q=' + quizId
  const subject = encodeURIComponent('Links til: ' + title)
  const body = encodeURIComponent(
    'Hej ' + (c?.name || '') + ',\n\n' +
    'Her er links til dit løb "' + title + '":\n\n' +
    '✏️ Editor (redigér løbet):\n' + editorUrl + '\n\n' +
    '📊 Scoreboard (vis til deltagere):\n' + scoreUrl + '\n\nMvh. Quiz Platform'
  )
  window.open('mailto:' + (c?.email || '') + '?subject=' + subject + '&body=' + body)
}

// ── QR ────────────────────────────────────────────────────────
function showQR(url, title) {
  document.getElementById('qr-title').textContent = title
  document.getElementById('qr-url').textContent = url
  const canvas = document.getElementById('qr-canvas')
  canvas.innerHTML = ''
  new QRCode(canvas, { text: url, width: 220, height: 220,
    colorDark:'#000000', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M })
  document.getElementById('qr-modal').classList.add('open')
}
function closeQR() { document.getElementById('qr-modal').classList.remove('open') }

// ── Nyt løb / slet ────────────────────────────────────────────
async function newQuizForCustomer() {
  if (!activeId) return
  const { data, error } = await sb.schema('quiz').from('quizzes')
    .insert({ title: 'Ny quiz', status: 'kladde', customer_id: activeId })
    .select('id').single()
  if (error) { alert('Kunne ikke oprette quiz: ' + error.message); return; }
  location.href = `editor.html?q=${data.id}`
}

async function deleteQuiz(quizId) {
  const title = quizTitle(quizId)
  if (!confirm(`Slet "${title}" permanent? Kan ikke fortrydes.`)) return
  // Først fotos og deltagerdata i Storage (databasen kan ikke slette filer) – ellers bliver billederne liggende
  try { await purgeQuizData(quizId, true) } catch (e) {
    if (!confirm('Billeder og deltagerdata kunne ikke slettes først: ' + e.message + '\n\nSlet løbet alligevel? Billederne kan så blive liggende i lageret.')) return
  }
  const { error } = await sb.schema('quiz').rpc('delete_quiz_cascade', { p_quiz_id: quizId })
  if (error) { alert('Kunne ikke slette: ' + error.message); return; }
  if (activeId) loadCustomerQuizzes(activeId)
}

// ── Noter ─────────────────────────────────────────────────────
async function saveNotes() {
  if (!activeId) return
  const notes = document.getElementById('detail-notes').value
  await sb.schema('quiz').from('customers').update({ notes }).eq('id', activeId)
  const c = customers.find(x => x.id === activeId)
  if (c) c.notes = notes
}

// ── Opret / redigér kunde ─────────────────────────────────────
function openNewCustomer() {
  editingId = null
  document.getElementById('cust-modal-title').textContent = 'Ny kunde'
  ;['cf-name','cf-email','cf-phone','cf-company'].forEach(id => document.getElementById(id).value = '')
  document.getElementById('cust-msg').textContent = ''
  document.getElementById('cust-modal').classList.add('open')
}

function editCustomer() {
  if (!activeId) return
  const c = customers.find(x => x.id === activeId)
  if (!c) return
  editingId = c.id
  document.getElementById('cust-modal-title').textContent = 'Redigér kunde'
  document.getElementById('cf-name').value    = c.name || ''
  document.getElementById('cf-email').value   = c.email || ''
  document.getElementById('cf-phone').value   = c.phone || ''
  document.getElementById('cf-company').value = c.company || ''
  document.getElementById('cust-msg').textContent = ''
  document.getElementById('cust-modal').classList.add('open')
}

function closeCustomerModal() { document.getElementById('cust-modal').classList.remove('open') }

async function saveCustomer() {
  const name    = document.getElementById('cf-name').value.trim()
  const email   = document.getElementById('cf-email').value.trim()
  const phone   = document.getElementById('cf-phone').value.trim()
  const company = document.getElementById('cf-company').value.trim()
  const msgEl   = document.getElementById('cust-msg')
  if (!name) { msgEl.textContent = '⚠️ Navn er påkrævet'; return; }

  const payload = { name, email: email||null, phone: phone||null, company: company||null }
  if (editingId) {
    const { error } = await sb.schema('quiz').from('customers').update(payload).eq('id', editingId)
    if (error) { msgEl.textContent = '❌ ' + error.message; return; }
  } else {
    const { error } = await sb.schema('quiz').from('customers').insert(payload)
    if (error) { msgEl.textContent = '❌ ' + error.message; return; }
  }
  closeCustomerModal()
  const keepId = editingId
  await loadCustomers()
  if (keepId) selectCustomer(keepId)
}

// ── PIN ───────────────────────────────────────────────────────
function openPin() {
  if (!activeId) return
  const c = customers.find(x => x.id === activeId)
  document.getElementById('pin-modal-title').textContent = c?.name || ''
  document.getElementById('pin-new').value = ''
  document.getElementById('pin-expires').value = ''
  document.getElementById('pin-msg').textContent = ''
  document.getElementById('pin-modal').classList.add('open')
}
function closePin() { document.getElementById('pin-modal').classList.remove('open') }

async function savePin() {
  if (!activeId) return
  const pin     = document.getElementById('pin-new').value.trim()
  const expires = document.getElementById('pin-expires').value
  const msgEl   = document.getElementById('pin-msg')

  if (!pin || pin.length < 6) { msgEl.textContent = '⚠️ PIN skal være mindst 6 cifre'; return; }
  if (!/^\d+$/.test(pin))     { msgEl.textContent = '⚠️ PIN må kun indeholde tal'; return; }

  const expIso = expires ? new Date(expires).toISOString() : null
  const { error } = await sb.schema('quiz').rpc('set_customer_pin', {
    p_customer_id: activeId, p_pin: pin, p_expires: expIso
  })
  if (error) {
    msgEl.textContent = '❌ ' + error.message
    return
  }

  // Opdatér lokal cache (selve hashen ligger kun på serveren)
  const c = customers.find(x => x.id === activeId)
  if (c) { c.pin_hash = 'sat'; c.pin_expires_at = expIso }

  const loginUrl = getLoginUrl(activeId)
  msgEl.innerHTML = `✅ PIN gemt!<br><b>Kode: ${pin}</b><br>
    <small style="word-break:break-all">${loginUrl}</small><br>
    <button onclick="navigator.clipboard.writeText('Link: ${loginUrl}\\nPIN: ${pin}')"
      style="margin-top:.4rem;font-size:.8rem;cursor:pointer;background:#eee;border:none;padding:.3rem .6rem;border-radius:6px;">
      📋 Kopiér link + PIN
    </button>`

  selectCustomer(activeId)
}

// ── Helpers ───────────────────────────────────────────────────
function labelStatus(s) {
  return { kladde:'Kladde', testing:'Test', aktiv:'Aktiv', arkiveret:'Arkiveret' }[s] ?? s
}
function escHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
function escAttr(s) {
  return String(s??'').replace(/'/g,"\\'")
}
</script>
