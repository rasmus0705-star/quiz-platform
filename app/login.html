<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log ind – Quiz Platform</title>
  <link rel="stylesheet" href="../themes/standard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem;
    }
    .login-box { width: 100%; max-width: 320px; }
    .logo { text-align: center; font-size: 2.5rem; margin-bottom: .5rem; }
    .app-name {
      text-align: center; font-size: 1.1rem; font-weight: 700;
      margin-bottom: 1.75rem; color: var(--text);
    }
    #pin-input {
      font-size: 1.8rem; text-align: center;
      letter-spacing: .6rem; font-weight: 700;
      padding: .75rem; width: 100%;
    }
    #error-msg {
      text-align: center; color: var(--accent);
      font-size: .85rem; min-height: 1.2rem;
      margin-top: .5rem;
    }
    #quiz-label {
      text-align: center; font-size: .8rem;
      color: var(--text-muted); margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">🗺️</div>
    <div class="app-name">Quiz Platform</div>

    <div class="card">
      <div id="quiz-label"></div>
      <label style="display:block;margin-bottom:.4rem;font-size:.82rem;color:var(--text-muted);">
        PIN-kode
      </label>
      <input id="pin-input" type="password" inputmode="numeric"
        maxlength="8" placeholder="••••" autocomplete="off" autofocus>
      <p id="error-msg"></p>
      <button id="login-btn" class="btn" style="width:100%;margin-top:.75rem;"
        onclick="login()">Log ind</button>
    </div>
  </div>

<script>
  const params  = new URLSearchParams(location.search)
  const quizId  = params.get('q')   // null = forsøg admin-login

  if (quizId) {
    document.getElementById('quiz-label').textContent = 'Quiz-adgang'
  }

  // Allerede logget ind? Redirect
  const stored = (() => {
    try {
      const raw = localStorage.getItem('pin_session')
      if (!raw) return null
      const s = JSON.parse(raw)
      if (!s.expires_at || new Date(s.expires_at) < new Date()) {
        localStorage.removeItem('pin_session'); return null
      }
      return s
    } catch { return null }
  })()

  // Kun auto-redirect hvis der IKKE er et quiz-id i URL'en (dvs. admin-login)
  if (stored && !quizId) {
    if (stored.is_admin) location.replace('overview.html')
    else                 location.replace('editor.html?q=' + stored.quiz_id)
  }

  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login()
  })

  async function login() {
    const pin = document.getElementById('pin-input').value.trim()
    if (!pin) return

    const btn = document.getElementById('login-btn')
    btn.disabled = true; btn.textContent = '…'
    document.getElementById('error-msg').textContent = ''

    try {
      const { createClient } = supabase
      const client = createClient(SUPABASE_URL, SUPABASE_ANON)

      const { data, error } = await client.functions.invoke('quiz-pin-auth', {
        body: { quiz_id: quizId ?? null, pin }
      })

      if (error || data?.error) {
        showError(data?.error ?? 'Fejl ved login')
        btn.disabled = false; btn.textContent = 'Log ind'
        return
      }

      localStorage.setItem('pin_session', JSON.stringify({
        session_id : data.session_id,
        is_admin   : data.is_admin,
        quiz_id    : data.quiz_id,
        expires_at : data.expires_at
      }))

      if (data.is_admin) location.href = 'overview.html'
      else               location.href = 'editor.html?q=' + data.quiz_id

    } catch (e) {
      showError('Netværksfejl – prøv igen')
      btn.disabled = false; btn.textContent = 'Log ind'
    }
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    document.getElementById('pin-input').value = ''
    document.getElementById('pin-input').focus()
  }
</script>
</body>
</html>
