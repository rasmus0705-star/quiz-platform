<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard-lab v2 – visninger og selvtilpassende grafik</title>
<style>
:root{--bg:#0d0f15;--panel:#151821;--line:#262b38;--txt:#f2f3f7;--mut:#8b91a3;--y:#f2c94c;--acc:#7c5cff;
--a0:#e5484d;--a1:#3e8ee8;--a2:#f2b632;--a3:#2fb67c}
*{box-sizing:border-box;margin:0}
body{background:#05060a;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px}
h1{font-size:16px;font-weight:800;margin-right:6px}
h1 span{color:var(--mut);font-weight:400}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp em{font-style:normal;color:var(--mut);font-size:12px;margin-right:2px}
.b,select{background:var(--panel);border:1px solid var(--line);color:#c9cdd8;padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.b.on{background:var(--acc);border-color:var(--acc);color:#fff}
.b.mode.on{background:var(--y);border-color:var(--y);color:#1a1400;font-weight:700}
.b.primary{background:var(--y);border-color:var(--y);color:#1a1400;font-weight:800}
.b.tg.on{background:transparent;border-color:#3ddc97;color:#3ddc97}
#stage{display:flex;justify-content:center;padding:4px 16px}
#desc{padding:10px 16px 18px;color:var(--mut);font-size:13px;line-height:1.5;max-width:1100px;margin:0 auto}
#desc b{color:var(--txt)}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px;color:#c9cdd8}

/* TV */
.tv{position:relative;display:grid;container-type:size;border-radius:14px;overflow:hidden;border:1px solid var(--line);
background:radial-gradient(120% 90% at 50% 30%,#171a26 0%,var(--bg) 70%);transition:grid-template-rows .45s ease}
.tv.m-question{grid-template-rows:1fr 0px}
.tv.m-split{grid-template-rows:40% 1fr}
.tv.m-graphic{grid-template-rows:12% 1fr}
#gwrap{position:relative;min-height:0;overflow:hidden}
#gwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#qbox{display:grid;min-height:0;overflow:hidden;padding:2.6cqh 2.9cqw 2cqh;gap:2cqh 2.2cqw}
.head{grid-area:head;min-width:0;align-self:center}
.qnum{display:flex;gap:1.2cqw;align-items:center;color:var(--mut);font-weight:800;letter-spacing:.15em;text-transform:uppercase;font-size:2.3cqh}
.chip{letter-spacing:0;text-transform:none;background:#1c2130;border:1px solid var(--line);color:var(--txt);padding:.4cqh 1cqw;border-radius:999px;font-size:2cqh}
#cntS{letter-spacing:0;text-transform:none;color:var(--y);font-size:2.2cqh}
.qtext{font-weight:900;letter-spacing:-.01em;line-height:1.1;margin-top:1cqh;font-size:7cqh}
.timer{grid-area:timer;position:relative;width:20cqh;height:20cqh;align-self:center}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9cqh;font-weight:900;color:var(--y)}
.tiles{grid-area:tiles;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2cqh 1.3cqw;min-height:0}
.tile{position:relative;display:flex;align-items:center;gap:1.8cqw;padding:0 2cqw;border-radius:2.2cqh;font-weight:900;color:#fff;font-size:5.4cqh;min-width:0;transition:opacity .35s,box-shadow .35s}
.tile .sh{display:flex}.tile .sh svg{width:6cqh;height:6cqh}.tile svg *{fill:currentColor}
.tile .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ct{margin-left:auto;font-size:.7em}
.t0{background:var(--a0)}.t1{background:var(--a1)}.t2{background:var(--a2);color:#2a1d00}.t3{background:var(--a3)}
.tile.idle{opacity:.25}
.tile.wrong{opacity:.22}
.tile.right{box-shadow:0 0 0 .5cqh #fff,0 0 4cqh 1cqh rgba(47,182,124,.65)}
.ans{grid-area:ans;display:flex;align-items:center;gap:2cqw}
#cntQ{font-size:2.8cqh;color:var(--mut);font-weight:800;white-space:nowrap}
#cntQ b{color:var(--txt);font-size:4.2cqh;margin-right:.4cqw}
.avs{display:flex;gap:1cqw}
.av{position:relative;width:6.4cqh;height:6.4cqh;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:2.2cqh;color:#0d0f15;transition:all .25s}
.av.wait{background:transparent;border:.3cqh dashed #3a4153;color:#3a4153}
.av.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.av.ok::after,.av.no::after{position:absolute;right:-.6cqh;bottom:-.6cqh;width:2.8cqh;height:2.8cqh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6cqh;color:#fff;border:.3cqh solid var(--bg)}
.av.ok::after{content:"✓";background:var(--a3)}.av.no::after{content:"✕";background:var(--a0)}

/* layout pr. visning */
.m-question #qbox{grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;grid-template-areas:"head timer" "tiles tiles" "ans ans"}
.m-question #cntS{display:none}
.m-split #qbox{grid-template-columns:1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"head timer" "tiles tiles";padding-bottom:2.4cqh}
.m-split .qtext{font-size:4.6cqh}
.m-split .timer{width:13cqh;height:13cqh}.m-split .timer b{font-size:6cqh}
.m-split .tiles{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
.m-split .tile{font-size:3.6cqh;border-radius:1.6cqh;padding:0 1.4cqw;gap:1cqw}.m-split .tile .sh svg{width:3.8cqh;height:3.8cqh}
.m-split .ans,.m-graphic .ans{display:none}
.m-graphic #qbox{grid-template-columns:auto 1fr auto;grid-template-rows:1fr;grid-template-areas:"timer head tiles";padding:1.4cqh 2.9cqw;align-items:center}
.m-graphic .timer{width:8cqh;height:8cqh}.m-graphic .timer b{font-size:3.6cqh}
.m-graphic .qnum{font-size:1.7cqh}.m-graphic .chip{font-size:1.6cqh}.m-graphic #cntS{font-size:1.8cqh}
.m-graphic .qtext{font-size:3.3cqh;margin-top:.3cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-graphic .tiles{grid-template-columns:repeat(4,auto);grid-template-rows:1fr;gap:.8cqw;height:6.4cqh}
.m-graphic .tile{font-size:2.4cqh;border-radius:1.2cqh;padding:0 1.1cqw;gap:.6cqw}.m-graphic .tile .sh svg{width:2.2cqh;height:2.2cqh}
.m-graphic .tile .ct{margin-left:.6cqw}
</style>
</head>
<body>
<header>
  <h1>Scoreboard-lab v2 <span>· visninger + selvtilpassende grafik</span></h1>
  <div class="grp"><em>Visning</em><span id="modes"></span></div>
  <div class="grp"><em>Grafik</em><span id="tabs"></span></div>
  <div class="grp">
    <button class="b primary" id="next">Næste ▸</button>
    <button class="b tg" id="auto">Auto: fra</button>
    <select id="nTeams" aria-label="Antal hold"></select>
    <button class="b tg on" id="snd">Lyd: til</button>
    <button class="b" id="reset">Nulstil</button>
  </div>
</header>
<div id="stage">
  <div class="tv m-split" id="tv">
    <div id="qbox">
      <div class="head"><div class="qnum"><span id="qn">Klar</span><span class="chip" id="qc">Quizjagten</span><span id="cntS"></span></div><div class="qtext" id="qt">Tryk mellemrum for første spørgsmål</div></div>
      <div class="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#232838" stroke-width="10"/><circle id="ring" cx="50" cy="50" r="42" fill="none" stroke="#f2c94c" stroke-width="10" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><b id="tn">–</b></div>
      <div class="tiles" id="tiles"></div>
      <div class="ans"><span id="cntQ"></span><div class="avs" id="avs"></div></div>
    </div>
    <div id="gwrap"><canvas id="cv"></canvas></div>
  </div>
</div>
<div id="desc"></div>

<script>
/* ---------- grundlag ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),gwrap=document.getElementById('gwrap'),tvEl=document.getElementById('tv');
let W=0,H=0,DPR=1,hidden=false;
const PALETTE=[['#ff4d6d','Ræven'],['#4dabff','Uglen'],['#ffd23f','Bjørnen'],['#3ddc97','Haren'],['#b388ff','Ulven'],['#ff8c42','Lossen'],['#00e5ff','Ørnen'],['#ff6ec7','Grævlingen']];
const QS=[
 {c:'Videnskab',q:'Hvad er det kemiske symbol for ilt (oxygen)?',a:['Ox','I','C','O'],r:3},
 {c:'Geografi',q:'Hvilken by ligger ved Limfjorden?',a:['Odense','Aalborg','Vejle','Næstved'],r:1},
 {c:'Historie',q:'Hvilket år blev Danmark medlem af EF?',a:['1965','1972','1973','1986'],r:2},
 {c:'Sport',q:'Hvor mange spillere har et fodboldhold på banen?',a:['9','10','11','12'],r:2},
 {c:'Natur',q:'Hvad er Danmarks nationalfugl?',a:['Storken','Knopsvanen','Viben','Lærken'],r:1},
 {c:'Musik',q:'Hvor mange tangenter har et almindeligt klaver?',a:['76','82','88','96'],r:2}
];
const GOAL=10000,QDUR=10000,SUSP=1600,REV=1300,NQ=15;
let teams=[],phase='idle',phaseT=0,round=0,leaderIdx=-1,winner=-1,concept='bubbles',viewMode='split',muted=false,auto=false,autoTimer=null,Q=null,qIdx=-1,allAt=0,lastTick=99;
let particles=[],floaters=[],banner=null,flash=0,shake=0;

const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const fmt=n=>Math.round(n).toLocaleString('da-DK');
function rr(x,y,w,h,r){ctx.beginPath();r=Math.max(0,Math.min(r,w/2,h/2));ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function font(size,weight){ctx.font=`${weight||700} ${Math.round(size)}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;}
const thinking=t=>phase==='question'&&!t.answered;
const answeredNow=t=>phase==='question'&&t.answered;

/* lærredet aflæser selv sin størrelse */
function resize(){
  const r=gwrap.getBoundingClientRect(),w=r.width,h=r.height;
  if(w<80||h<80){hidden=true;return;}
  const wasHidden=hidden;hidden=false;
  const sx=W>0?w/W:1,sy=H>0?h/H:1,changed=Math.abs(w-W)>.5||Math.abs(h-H)>.5;
  DPR=Math.min(2,window.devicePixelRatio||1);W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  if(changed&&teams.length){teams.forEach(t=>{t.x*=sx;t.y*=sy;});particles=particles.filter(p=>p.type==='conf');C[concept].onResize&&C[concept].onResize(sx,sy);}
  if(wasHidden&&teams.length&&!C[concept].ready)C[concept].init();
}
new ResizeObserver(resize).observe(gwrap);

/* ---------- lyd ---------- */
let AC=null,master=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.22;master.connect(AC.destination);}catch(e){AC=null}}
function tone(f,dur,type,vol,when,slide){if(!AC||muted)return;const t0=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.2,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,f0,f1){if(!AC||muted)return;const len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=buf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;const t0=AC.currentTime;bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(bp);bp.connect(g);g.connect(master);s.start();}
const sfx={
  start(){tone(392,.12,'triangle',.15);tone(523,.18,'triangle',.15,.1);},
  answer(i){tone(660+i*45,.08,'sine',.12);},
  count(){tone(880,.07,'square',.04);},
  suspense(){tone(160,1.6,'sawtooth',.05,0,640);tone(80,1.6,'sine',.18,0,320);},
  whoosh(){noise(.55,.55,300,3200);tone(220,.4,'triangle',.12,0,880);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.09));},
  tick(i){tone(500+Math.min(i,30)*35,.06,'square',.035);},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.12));}
};

/* ---------- state ---------- */
function makeTeams(n){
  teams=PALETTE.slice(0,n).map(([c,name],i)=>({i,name,color:c,score:0,from:0,disp:0,vis:0,gain:0,streak:0,pulse:0,charge:0,boost:0,hit:0,x:0,y:0,vx:0,vy:0,r:30,rv:0,rot:Math.random()*6,waves:[],waveT:0,answered:false,answerAt:0,correct:false,choice:-1}));
  round=0;leaderIdx=-1;winner=-1;particles=[];floaters=[];banner=null;phase='idle';phaseT=0;Q=null;qIdx=-1;
  initConcept();renderQuestion();
}
function initConcept(){if(!hidden&&W>0){C[concept].init();C[concept].ready=true;}else C[concept].ready=false;}
function leader(){let best=-1,bs=-1,tie=false;teams.forEach(t=>{if(t.score>bs){bs=t.score;best=t.i;tie=false}else if(t.score===bs)tie=true});return bs>0&&!tie?best:-1}

function nextRound(){
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(phase==='question'){endQuestion();return;}
  if(phase!=='idle')return;
  round++;qIdx=(qIdx+1)%QS.length;Q=QS[qIdx];allAt=0;lastTick=99;
  teams.forEach(t=>{t.answered=false;t.answerAt=Math.random()<.92?rnd(1200,QDUR-1200):Infinity;t.correct=Math.random()<.6;t.choice=t.correct?Q.r:[0,1,2,3].filter(k=>k!==Q.r)[Math.floor(Math.random()*3)];t.from=t.score;t.gain=0;t.charge=0;});
  phase='question';phaseT=0;sfx.start();renderQuestion();
}
function onAnswer(t){t.pulse=1;sfx.answer(t.i);C[concept].onAnswer&&C[concept].onAnswer(t);updateQUI(t.i);}
function endQuestion(){
  teams.forEach(t=>{if(!t.answered){t.correct=false;t.choice=-1;}t.gain=t.correct?Math.round(1000*(1-t.answerAt/(2*QDUR))/10)*10:0;if(t.correct&&t.streak>=2)t.gain+=100*Math.min(t.streak,5);});
  phase='suspense';phaseT=0;sfx.suspense();updateQUI();
}
function anchor(t){return C[concept].anchor(t)}
function addFloater(t){const a=anchor(t);floaters.push({x:a.x,y:a.y,text:'+'+fmt(t.gain),color:t.color,life:1,streak:t.streak})}
function confetti(x,y,color,n){const cols=[color,'#ffffff','#ffd23f',color,PALETTE[Math.floor(Math.random()*8)][0]];for(let i=0;i<n;i++)particles.push({type:'conf',x,y,vx:rnd(-420,420),vy:rnd(-700,-180),rot:rnd(0,6),vr:rnd(-12,12),color:cols[i%cols.length],life:1,size:rnd(5,10)})}
function sparks(x,y,color,n,dir,spd){for(let i=0;i<n;i++){const a=dir==null?rnd(0,Math.PI*2):dir+rnd(-.7,.7);const s=rnd(.3,1)*(spd||300);particles.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1})}}
function checkLeader(){
  const l=leader();
  if(l>=0&&l!==leaderIdx){const first=leaderIdx<0;leaderIdx=l;const t=teams[l];banner={text:(first?'Første fører: ':'Ny fører: ')+t.name,color:t.color,t:0};flash=1;if(!hidden){const a=anchor(t);confetti(a.x,a.y,t.color,first?50:110);}sfx.fanfare();if(C[concept].onLeader)C[concept].onLeader();}
  if(winner<0&&leaderIdx>=0&&teams[leaderIdx].score>=GOAL){winner=leaderIdx;const t=teams[winner];banner={text:t.name+' vinder!',color:t.color,t:-.6,big:true};setTimeout(()=>{for(let k=0;k<5;k++)confetti(W*(k+.5)/5,H*.3,t.color,70);sfx.win();flash=1;},500);setAuto(false);}
}

/* ---------- spørgsmålspanelet (DOM) ---------- */
const $=id=>document.getElementById(id);
const SH=['<svg viewBox="0 0 70 70"><path d="M35 6L66 62H4z"/></svg>','<svg viewBox="0 0 70 70"><path d="M35 4L66 35L35 66L4 35z"/></svg>','<svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>','<svg viewBox="0 0 70 70"><rect x="7" y="7" width="56" height="56" rx="6"/></svg>'];
$('tiles').innerHTML=[0,1,2,3].map(i=>`<div class="tile t${i}"><span class="sh">${SH[i]}</span><span class="tx"></span><span class="ct"></span></div>`).join('');
function renderQuestion(){
  const q=Q||{c:'Quizjagten',q:'Tryk mellemrum for første spørgsmål',a:['—','—','—','—']};
  $('qt').textContent=q.q;$('qc').textContent=q.c;
  [...$('tiles').children].forEach((el,i)=>{el.className='tile t'+i+(Q?'':' idle');el.querySelector('.tx').textContent=q.a[i];el.querySelector('.ct').textContent='';});
  $('avs').innerHTML=teams.map(t=>`<div class="av" style="--c:${t.color}" data-i="${t.i}">${t.name.slice(0,2)}</div>`).join('');
  updateQUI();
}
function updateQUI(popIdx){
  const n=teams.filter(t=>t.answered).length;
  $('qn').textContent=!Q?'Klar':phase==='suspense'?'Svarene tælles op …':`Spørgsmål ${round} af ${NQ}`;
  $('cntS').textContent=phase==='question'?`${n} af ${teams.length} har svaret`:'';
  $('cntQ').innerHTML=Q?`<b>${n}</b>af ${teams.length} har svaret`:'';
  [...$('avs').children].forEach(el=>{const t=teams[+el.dataset.i];el.classList.toggle('wait',phase==='question'&&!t.answered);if(popIdx===t.i){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}});
}
function revealTiles(){
  const cnt=[0,0,0,0];teams.forEach(t=>{if(t.choice>=0)cnt[t.choice]++;});
  [...$('tiles').children].forEach((el,i)=>{el.classList.add(i===Q.r?'right':'wrong');el.querySelector('.ct').textContent=cnt[i];});
  [...$('avs').children].forEach(el=>{const t=teams[+el.dataset.i];el.classList.remove('wait');el.classList.add(t.correct?'ok':'no');});
}
function updateTimer(){
  const C0=263.9;let rem=QDUR;
  if(phase==='question')rem=Math.max(0,QDUR-phaseT);else if(Q)rem=0;
  $('ring').setAttribute('stroke-dashoffset',(C0*(1-rem/QDUR)).toFixed(1));
  const s=Q?Math.ceil(rem/1000):'–';
  if($('tn').textContent!==String(s))$('tn').textContent=s;
  if(phase==='question'&&rem<=3000&&s<lastTick&&s>0){lastTick=s;sfx.count();}
}

/* ---------- koncepter ---------- */
const C={};

/* 1. Bobler */
C.bubbles={
  label:'Bobler',
  desc:'<b>Bobler:</b> arealet er holdets andel af alle point, men der er nu et loft, så én spiller aldrig fylder hele lærredet. Tyngdekraften tilpasser sig formatet: på et bredt, lavt lærred trækkes boblerne mere sammen lodret og spredes vandret.',
  init(){const n=teams.length;teams.forEach((t,i)=>{const a=i/n*Math.PI*2;t.x=W/2+Math.cos(a)*W*.22;t.y=H/2+Math.sin(a)*H*.22;t.vx=t.vy=0;t.r=10;t.rv=0;});this.crown={x:W/2,y:-60,sx:W/2,sy:-60,h:1,a:0};},
  targetR(t){const n=teams.length,base=400;let sum=0;teams.forEach(o=>sum+=Math.max(0,o.vis)+base);const share=(Math.max(0,t.vis)+base)/sum;const frac=Math.min(.40,.13*n)*clamp(1.9/(W/H),.5,1);return clamp(Math.sqrt(share*W*H*frac/Math.PI),18,Math.min(W,H)*.42)},
  update(dt){
    const cx=W/2,cy=H/2,asp=clamp(W/H,1,4)*.85;let avg=0;teams.forEach(t=>avg+=t.r);avg/=teams.length;

      const g=1.8*(t.r/avg);t.vx+=((cx-t.x)*g+rnd(-30,30))*dt;t.vy+=((cy-t.y)*g*asp+rnd(-30,30))*dt;const d=Math.pow(.1,dt);t.vx*=d;t.vy*=d;t.x+=t.vx*dt;t.y+=t.vy*dt;});
    for(let k=0;k<3;k++)for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){const a=teams[i],b=teams[j];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.01;const min=a.r+b.r+8;if(d<min){const ov=min-d;dx/=d;dy/=d;const ma=a.r*a.r,mb=b.r*b.r,s=ma+mb;a.x-=dx*ov*mb/s;a.y-=dy*ov*mb/s;b.x+=dx*ov*ma/s;b.y+=dy*ov*ma/s;a.vx-=dx*ov*2*mb/s;a.vy-=dy*ov*2*mb/s;b.vx+=dx*ov*2*ma/s;b.vy+=dy*ov*2*ma/s;}}
    teams.forEach(t=>{if(t.x<t.r){t.x=t.r;t.vx=Math.abs(t.vx)*.5}if(t.x>W-t.r){t.x=W-t.r;t.vx=-Math.abs(t.vx)*.5}if(t.y<t.r){t.y=t.r;t.vy=Math.abs(t.vy)*.5}if(t.y>H-t.r){t.y=H-t.r;t.vy=-Math.abs(t.vy)*.5}});
    const c=this.crown;
    if(leaderIdx>=0){const L=teams[leaderIdx],s=clamp(L.r*.3,12,30),tx=L.x,ty=L.y-L.r-s*.2;c.a=Math.min(1,c.a+dt*3);
      if(c.h<1){c.h=Math.min(1,c.h+dt/.7);const p=easeInOut(c.h);c.x=lerp(c.sx,tx,p);c.y=lerp(c.sy,ty,p)-Math.sin(Math.PI*p)*Math.min(120,H*.2);}else{c.x=tx;c.y=ty;}}

C.rockets={
  label:'Raketter',V:5000,
  desc:'<b>Raketter:</b> aflæser selv lærredet. Er det mere end dobbelt så bredt som højt (delt visning), flyver raketterne vandret mod målet i højre side. Ellers flyver de lodret op. Holdene tænder en lille pilotflamme, når de har svaret.',
  init(){this.cam=0;this.stars=[...Array(170)].map(()=>({x:Math.random(),y:Math.random(),z:rnd(.15,1),s:rnd(.4,2)}));},

/* 3. Tovtræk */
C.tug={
  label:'Tovtræk',
  desc:'<b>Tovtræk:</b> bredt i forvejen, så det passer perfekt til delt visning. Hold, der stadig tænker, står dæmpet. Når et hold svarer, springer der gnister fra deres del af bjælken.',
  init(){},
  geo(){const bh=clamp(H*.15,34,96);return{x0:60,x1:W-60,bh,yc:H*.6}},
  segs(){const{x0,x1}=this.geo(),w=x1-x0;let tot=0;teams.forEach(t=>tot+=Math.max(0,t.vis));const base=Math.max(1,tot*.03);let sum=0;teams.forEach(t=>sum+=Math.max(0,t.vis)+base);let a=x0;return teams.map(t=>{const b=a+(Math.max(0,t.vis)+base)/sum*w;const s={t,a,b};a=b;return s;})},
  segsFor(key){const{x0,x1}=this.geo(),w=x1-x0;let tot=0;teams.forEach(t=>tot+=t[key]);const base=Math.max(1,tot*.03);let sum=0;teams.forEach(t=>sum+=t[key]+base);let a=x0;return teams.map(t=>{const b=a+(t[key]+base)/sum*w;a=b;return b;})},
  onAnswer(t){const s=this.segs()[t.i],{yc,bh}=this.geo();sparks((s.a+s.b)/2,yc-bh/2,t.color,14,-Math.PI/2,260);},
  onReveal(){const old=this.segsFor('from'),nw=this.segsFor('score'),{yc}=this.geo();let big=0;for(let k=0;k<teams.length-1;k++){const d=nw[k]-old[k];big=Math.max(big,Math.abs(d));if(Math.abs(d)>2){const loser=d>0?teams[k+1]:teams[k];sparks(old[k],yc,'#fff6c8',40,d>0?0:Math.PI,520);sparks(old[k],yc,loser.color,20,d>0?0:Math.PI,380);}}if(big>(W-120)*.05)shake=Math.max(shake,12);},
  update(){const segs=this.segs(),{yc,bh}=this.geo();for(let k=0;k<segs.length-1;k++)if(Math.random()<.35)sparks(segs[k].b,yc+rnd(-bh/2,bh/2),'#fff6c8',1,null,120);},
  draw(time){
    const segs=this.segs(),{x0,x1,bh,yc}=this.geo(),n=teams.length;
    ctx.fillStyle='#0a0c1c';ctx.fillRect(0,0,W,H);
    if(n===2){const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,hexA(teams[0].color,.22));g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,hexA(teams[1].color,.22));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    rr(x0-8,yc-bh/2-8,x1-x0+16,bh+16,bh/2+8);ctx.fillStyle='#14183a';ctx.fill();ctx.strokeStyle='#2a3060';ctx.lineWidth=2;ctx.stroke();
    ctx.save();rr(x0,yc-bh/2,x1-x0,bh,bh/2);ctx.clip();
    segs.forEach(s=>{ctx.fillStyle=s.t.color;ctx.fillRect(s.a,yc-bh/2,s.b-s.a+1,bh);if(thinking(s.t)){ctx.fillStyle='rgba(10,12,28,.6)';ctx.fillRect(s.a,yc-bh/2,s.b-s.a+1,bh);}});
    ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=bh*.12;const off=(time*30)%(bh*.5);for(let x=x0-bh-off;x<x1+bh;x+=bh*.5){ctx.beginPath();ctx.moveTo(x,yc+bh/2);ctx.lineTo(x+bh*.6,yc-bh/2);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x0,yc-bh/2,x1-x0,bh*.32);ctx.restore();
    if(n===2){ctx.fillStyle='rgba(255,255,255,.5)';const mx=(x0+x1)/2;ctx.fillRect(mx-1.5,yc-bh/2-22,3,14);ctx.fillRect(mx-1.5,yc+bh/2+8,3,14);}
    const charge=Math.max(...teams.map(t=>t.charge));
    for(let k=0;k<segs.length-1;k++){const x=segs[k].b+rnd(-1,1)*charge*8;
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.5;ctx.beginPath();let yy=yc-bh/2-14;ctx.moveTo(x,yy);while(yy<yc+bh/2+14){yy+=rnd(6,12);ctx.lineTo(x+rnd(-7,7),yy);}ctx.stroke();

const ORDER=['bubbles','rockets','tug','cores','mountain'];

/* ---------- loop ---------- */
function update(dt){
  phaseT+=dt*1000;
  if(phase==='question'){
    teams.forEach(t=>{if(!t.answered&&phaseT>=t.answerAt){t.answered=true;onAnswer(t);}});
    if(!allAt&&teams.every(t=>t.answered))allAt=phaseT;
    if(phaseT>=QDUR||(allAt&&phaseT-allAt>700))endQuestion();
  }else if(phase==='suspense'){teams.forEach(t=>t.charge=t.gain>0?Math.min(1,phaseT/SUSP):0);
    if(phaseT>=SUSP){phase='reveal';phaseT=0;teams.forEach(t=>{t.score=t.from+t.gain;t.charge=0;if(t.gain>0){t.streak++;t.pulse=1;t.boost=1;if(!hidden)addFloater(t);}else t.streak=0;});sfx.whoosh();revealTiles();updateQUI();if(Math.max(...teams.map(t=>t.gain))>=1000)shake=Math.max(shake,7);if(!hidden&&C[concept].onReveal)C[concept].onReveal();}}
  else if(phase==='reveal'){const p=Math.min(1,phaseT/REV);teams.forEach(t=>{t.disp=t.from+(t.score-t.from)*easeOutCubic(p);t.vis=t.from+(t.score-t.from)*easeOutBack(p);});
    if(p>=1){teams.forEach(t=>{t.disp=t.vis=t.score;});phase='idle';checkLeader();updateQUI();if(auto){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(auto)nextRound()},banner?(banner.big?4200:2900):1800);}}}
  teams.forEach(t=>{t.pulse=Math.max(0,t.pulse-dt*1.3);t.boost=Math.max(0,t.boost-dt*.6);});
  updateTimer();
  if(hidden)return;
  if(!C[concept].ready){C[concept].init();C[concept].ready=true;}
  C[concept].update&&C[concept].update(dt);
  particles.forEach(p=>{
    if(p.type==='conf'){p.vy+=480*dt;p.vx*=Math.pow(.5,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt*.4;}
    else if(p.type==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.04,dt);p.vy=p.vy*Math.pow(.04,dt)+160*dt;p.life-=dt*1.8;}
    else if(p.type==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.size+=dt*16;p.life-=dt*.9;}
    else if(p.type==='orb'){if(p.delay>0){p.delay-=dt;return;}p.prog+=dt*1.5;const q=Math.min(1,p.prog*p.prog),a=1-q;p.px=p.x;p.py=p.y;p.x=a*a*p.sx+2*a*q*p.cx+q*q*p.tx;p.y=a*a*p.sy+2*a*q*p.cy+q*q*p.ty;if(p.prog>=1){p.life=0;p.team.hit=1;sfx.tick(p.n);sparks(p.tx,p.ty,p.color,4,null,160);}}
  });
  particles=particles.filter(p=>p.life>0);if(particles.length>1800)particles.splice(0,particles.length-1800);
  floaters.forEach(f=>{f.y-=38*dt;f.life-=dt*.6;});floaters=floaters.filter(f=>f.life>0);
  flash=Math.max(0,flash-dt*2.2);shake=Math.max(0,shake-dt*30);
  if(banner){banner.t+=dt;if(banner.t>(banner.big?4:2.6))banner=null;}
}
function render(time){
  if(hidden)return;
  ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  C[concept].draw(time);
  particles.forEach(p=>{
    if(p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();}
    else if(p.type==='spark'){ctx.strokeStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();ctx.globalAlpha=1;}
    else if(p.type==='smoke'){ctx.fillStyle=`rgba(210,200,255,${.18*p.life})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    else if(p.type==='orb'&&p.delay<=0){ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,Math.PI*2);ctx.fill();ctx.restore();if(p.px!=null){ctx.strokeStyle=hexA(p.color,.7);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.px-(p.x-p.px)*2,p.py-(p.y-p.py)*2);ctx.stroke();}}
  });
  floaters.forEach(f=>{const pop=easeOutBack(Math.min(1,(1-f.life)*5));ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);ctx.translate(f.x,f.y);ctx.scale(pop,pop);font(22,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.text,0,0);ctx.fillStyle=f.color;ctx.fillText(f.text,0,0);if(f.streak>=3){font(12,900);ctx.fillStyle='#ff8c42';ctx.fillText('STIME ×'+f.streak,0,18);}ctx.restore();});
  ctx.restore();
  if(banner&&banner.t>0){const T=banner.t,end=banner.big?4:2.6,inP=clamp(T/.35,0,1),out=T>end-.4?clamp((T-(end-.4))/.4,0,1):0,sc=easeOutBack(inP)*(1-out*.2),fs=clamp(H*(banner.big?.12:.08),16,banner.big?64:40);
    ctx.save();ctx.globalAlpha=1-out;ctx.translate(W/2,banner.big?H*.45:Math.max(fs,H*.17));ctx.scale(sc,sc);font(fs,900);ctx.textBaseline='middle';const tw=ctx.measureText(banner.text).width;ctx.shadowColor=banner.color;ctx.shadowBlur=40;rr(-tw/2-28,-fs*.8,tw+56,fs*1.6,fs*.5);ctx.fillStyle=banner.color;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#0b0d1a';ctx.textAlign='center';ctx.fillText(banner.text,0,fs*.05);ctx.restore();}
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.28})`;ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(now/1000);requestAnimationFrame(frame);}

function setConcept(k){concept=k;document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===k));$('desc').innerHTML=C[k].desc+' &nbsp;·&nbsp; <kbd>Mellemrum</kbd> næste / vis svar · <kbd>G</kbd> skift visning · <kbd>V</kbd> skift grafik · <kbd>M</kbd> lyd';particles=[];floaters=[];initConcept();}
function setAuto(v){auto=v;$('auto').textContent='Auto: '+(v?'til':'fra');$('auto').classList.toggle('on',v);if(v&&phase==='idle')nextRound();}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>setConcept(b.dataset.c));
$('next').onclick=nextRound;$('auto').onclick=()=>setAuto(!auto);
$('reset').onclick=()=>{setAuto(false);makeTeams(+$('nTeams').value);};
$('nTeams').onchange=()=>{setAuto(false);makeTeams(+$('nTeams').value);};
function toggleSound(){muted=!muted;$('snd').textContent='Lyd: '+(muted?'fra':'til');$('snd').classList.toggle('on',!muted);}
$('snd').onclick=toggleSound;
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();nextRound();}
  else if(k==='g'){const i=MODES.findIndex(m=>m[0]===viewMode);setMode(MODES[(i+1)%3][0]);}
  else if(k==='v'){setConcept(ORDER[(ORDER.indexOf(concept)+1)%ORDER.length]);}
  else if(k==='m'){toggleSound();}
  else if(+e.key>=1&&+e.key<=5){setConcept(ORDER[+e.key-1]);}});
function fitTV(){const top=$('stage').getBoundingClientRect().top,aw=$('stage').clientWidth-32,ah=window.innerHeight-top-60;const w=Math.max(320,Math.min(aw,ah*16/9));tvEl.style.width=w+'px';tvEl.style.height=(w*9/16)+'px';}
window.addEventListener('resize',fitTV);
fitTV();setMode('split');resize();makeTeams(5);setConcept('bubbles');requestAnimationFrame(frame);
</script>
</body>
