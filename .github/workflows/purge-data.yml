# Dagligt job der sletter udløbne deltagerdata (GDPR). Kalder Edge Function 'purge-data'.
#
# Opsætning (én gang):
#   1. Supabase → Edge Functions → Secrets: tilføj  PURGE_SECRET = en lang tilfældig tekst
#   2. GitHub → repo → Settings → Secrets and variables → Actions → New repository secret:
#        PURGE_SECRET   (samme tekst som ovenfor)
#        SUPABASE_URL   (fx https://qmdqzdatlanyhewjwpzc.supabase.co)
#        SUPABASE_ANON  (anon-nøglen fra js/config.js)
#   3. Actions-fanen → "Slet udløbne deltagerdata" → Run workflow (test) – svaret skal være {"mode":"cron",…}
#
# OBS: GitHub slår planlagte jobs fra i offentlige repos efter 60 dages uden aktivitet.
# Ved lange pauser: kør jobbet manuelt ("Run workflow") eller brug pg_cron (se CLAUDE.md).
name: Slet udløbne deltagerdata
on:
  schedule:
    - cron: '23 3 * * *'      # hver nat kl. ca. 03:23 UTC
  workflow_dispatch: {}
jobs:
  purge:
    runs-on: ubuntu-24.04          # fast version, så GitHubs skift af 'latest' ikke ændrer noget uventet
    steps:
      - name: Kald purge-data
        env:
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$PURGE_SECRET" ] || missing="$missing PURGE_SECRET"
          [ -n "$SUPABASE_URL" ]  || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON" ] || missing="$missing SUPABASE_ANON"
          if [ -n "$missing" ]; then echo "::error::Mangler GitHub-secrets:$missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          code=$(curl -sS -o /tmp/svar.txt -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/purge-data" \
            -H "Authorization: Bearer $SUPABASE_ANON" -H "apikey: $SUPABASE_ANON" \
            -H "x-purge-secret: $PURGE_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat /tmp/svar.txt; echo
          case "$code" in
            200) ;;
            207) echo "::warning::Nogle løb kunne ikke slettes – se svaret ovenfor"; ;;
            401|403) echo "::error::Afvist ($code): tjek at PURGE_SECRET er ens i Supabase og GitHub, og at SUPABASE_ANON er anon-nøglen"; exit 1 ;;
            404) echo "::error::Funktionen 'purge-data' findes ikke i Supabase (tjek navnet og SUPABASE_URL)"; exit 1 ;;
            *) echo "::error::Uventet svar ($code)"; exit 1 ;;
          esac
