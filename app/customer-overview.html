<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine løb – Quiz Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f7fa;
      --white:    #ffffff;
      --ink:      #1a1f36;
      --ink-2:    #4a5568;
      --muted:    #8a94a6;
      --accent:   #6c63ff;
      --accent-2: #f7497a;
      --green:    #22c55e;
      --amber:    #f59e0b;
      --radius:   14px;
      --shadow:   0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    header {
      background: var(--white);
      border-bottom: 1px solid #eaecf0;
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1.05rem; color: var(--ink); }
    .logo span { color: var(--accent); }
    #customer-badge {
      font-size: .82rem; color: var(--ink-2);
      background: #f0f0ff; padding: .3rem .75rem;
      border-radius: 99px;
    }
    .btn-logout {
      background: none; border: 1.5px solid #eaecf0;
      color: var(--ink-2); font-size: .82rem;
      padding: .4rem .9rem; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .btn-logout:hover { background: #f5f7fa; }

    /* ── Main ── */
    main { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    .page-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .page-header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
    .page-header p { color: var(--ink-2); font-size: .9rem; margin-top: .2rem; }

    .btn-new {
      background: var(--accent); color: #fff;
      border: none; padding: .7rem 1.4rem;
      border-radius: var(--radius); font-size: .9rem;
      font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: .4rem;
      white-space: nowrap;
    }
    .btn-new:hover { background: #5a52e0; }

    /* ── Grid ── */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .quiz-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      border: 2px solid transparent;
    }
    .quiz-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .quiz-card.aktiv { border-color: var(--green); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .card-date { font-size: .75rem; color: var(--muted); margin-top: .2rem; }

    .status-badge {
      display: inline-block; padding: .2rem .6rem;
      border-radius: 99px; font-size: .72rem; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .s-kladde    { background: #f0f0f0; color: #666; }
    .s-testing   { background: #fef3c7; color: #92400e; }
    .s-aktiv     { background: #dcfce7; color: #166534; }
    .s-arkiveret { background: #fee2e2; color: #991b1b; }

    .card-stats {
      display: flex; gap: 1rem;
      font-size: .8rem; color: var(--ink-2);
    }
    .card-stat { display: flex; align-items: center; gap: .3rem; }

    .card-stat { font-size:.75rem; color:var(--ink-2); display:inline-flex; align-items:center; gap:3px; }
    .card-divider { border:none; border-top:1px solid #f0f1f5; margin:.6rem 0; }
    .card-section-label { font-size:.68rem; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-bottom:.35rem; }
    .team-row-mini { display:flex; justify-content:space-between; align-items:center; padding:.3rem 0; border-bottom:1px solid #f5f5f5; font-size:.82rem; }
    .team-row-mini:last-child { border-bottom:none; }
    .tname { font-weight:600; color:var(--ink); }
    .team-btns { display:flex; gap:.25rem; }
    .mini-pill { display:inline-flex; align-items:center; gap:3px; font-size:.7rem; font-weight:600; padding:.18rem .45rem; border-radius:99px; border:1px solid #e2e8f0; background:#f8f9fc; color:var(--ink-2); cursor:pointer; }
    .mini-pill:hover { background:#eef1f6; }
    .card-actions { display:flex; gap:.4rem; margin-top:.75rem; flex-wrap:wrap; }
    .btn-edit { display:inline-flex; align-items:center; gap:.3rem; background:var(--accent); color:#fff; border:none; padding:.38rem .85rem; border-radius:99px; font-size:.78rem; font-weight:700; cursor:pointer; }
    .btn-edit:hover { background:#5a52e0; }
    .btn-pill { display:inline-flex; align-items:center; gap:.3rem; background:#f0f0ff; color:var(--accent); border:none; padding:.38rem .85rem; border-radius:99px; font-size:.78rem; font-weight:700; cursor:pointer; }
    .btn-pill:hover { background:#e0e0ff; }
    .btn-pill-gray { display:inline-flex; align-items:center; gap:.3rem; background:#f5f7fa; color:var(--ink-2); border:none; padding:.38rem .85rem; border-radius:99px; font-size:.78rem; font-weight:700; cursor:pointer; }
    .btn-pill-gray:hover { background:#eef1f6; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h2 { font-size: 1.2rem; margin-bottom: .5rem; }
    .empty-state p { color: var(--ink-2); font-size: .9rem; margin-bottom: 1.5rem; }

    /* ── Share modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,.4); align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--white); border-radius: var(--radius);
      padding: 1.75rem; width: 100%; max-width: 380px;
    }
    .modal-box h3 { font-size: 1.1rem; margin-bottom: 1.25rem; }
    .share-btn {
      display: flex; align-items: center; gap: .75rem;
      width: 100%; padding: .85rem 1rem; border-radius: 10px;
      border: 1.5px solid #eaecf0; background: var(--white);
      cursor: pointer; font-size: .9rem; font-weight: 600;
      margin-bottom: .6rem; color: var(--ink);
      transition: background .1s;
    }
    .share-btn:hover { background: #f5f7fa; }
    .share-btn .icon { font-size: 1.3rem; width: 2rem; text-align: center; }
    .btn-close-modal {
      width: 100%; margin-top: .5rem; padding: .65rem;
      border: none; border-radius: 8px; background: #f5f7fa;
      color: var(--ink-2); font-size: .88rem; font-weight: 600;
      cursor: pointer;
    }

    /* ── QR modal ── */
    #qr-modal .modal-box { text-align: center; }
    #qr-canvas { margin: 1rem auto; }
    #qr-url { font-size: .7rem; color: var(--muted); word-break: break-all; margin-bottom: 1rem; }

    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem; }
      header { padding: 0 1rem; }
      .page-header h1 { font-size: 1.3rem; }
    }

    @media print {
      body > *:not(#qr-modal) { display: none !important; }
      #qr-modal { display: flex !important; position: static; background: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🗺️ <span>Quiz</span>Platform</div>
  <div style="display:flex;align-items:center;gap:.75rem;">
    <span id="customer-badge">Indlæser…</span>
    <button class="btn-logout" onclick="signOut()">Log ud</button>
  </div>
</header>

<main>
  <div class="page-header">
    <div>
      <h1>Mine løb</h1>
      <p>Byg, tilpas og del dine GPS-quizforløb</p>
    </div>
    <button class="btn-new" onclick="newQuiz()">+ Nyt løb</button>
  </div>

  <div id="loading" style="text-align:center;padding:3rem;color:var(--muted);">Indlæser dine løb…</div>
  <div id="quiz-grid" class="quiz-grid" style="display:none;"></div>
</main>

<!-- Del-modal -->
<div id="share-modal" class="modal-overlay" onclick="if(event.target===this)closeShare()">
  <div class="modal-box">
    <h3 id="share-title">Del løb</h3>
    <button class="share-btn" onclick="doShareAction('copy-login')">
      <span class="icon">📋</span>
      <div style="text-align:left;">
        <div>Kopiér login-link</div>
        <div style="font-size:.75rem;color:var(--muted);font-weight:400;">Link til scoreboard</div>
      </div>
    </button>
    <button class="share-btn" onclick="doShareAction('qr')">
      <span class="icon">📱</span>
      <div style="text-align:left;">
        <div>Vis QR-kode</div>
        <div style="font-size:.75rem;color:var(--muted);font-weight:400;">Til storskærm eller print</div>
      </div>
    </button>
    <button class="share-btn" onclick="doShareAction('mail')">
      <span class="icon">📧</span>
      <div style="text-align:left;">
        <div>Send via mail</div>
        <div style="font-size:.75rem;color:var(--muted);font-weight:400;">Åbner din mail-klient</div>
      </div>
    </button>
    <button class="btn-close-modal" onclick="closeShare()">Luk</button>
  </div>
</div>

<!-- QR modal -->
<div id="qr-modal" class="modal-overlay" onclick="if(event.target===this)closeQR()">
  <div class="modal-box">
    <h3 id="qr-title"></h3>
    <div id="qr-canvas"></div>
    <div id="qr-url"></div>
    <div style="display:flex;gap:.5rem;justify-content:center;">
      <button class="btn-new" style="flex:1;" onclick="window.print()">🖨️ Print</button>
      <button class="btn-close-modal" style="flex:1;margin:0;" onclick="closeQR()">Luk</button>
    </div>
  </div>
</div>

<script>
let customerId = null
let quizzes    = []
let shareQuiz  = null

async function init() {
  const session = await getSession()
  if (!session) { location.href = 'login.html'; return; }
  if (session.type === 'pin') {
    if (session.is_admin) { location.href = 'overview.html'; return; }
    activatePinClient()
    customerId = session.customer_id
  }

  // Kundenavn (kunder må ikke læse customers direkte – via RPC)
  const { data: me } = await sb.schema('quiz').rpc('get_my_customer')
  document.getElementById('customer-badge').textContent = me?.[0]?.customer_name ?? 'Kunde'

  await loadQuizzes()
}

async function loadQuizzes() {
  const { data, error } = await sb.schema('quiz').from('quizzes')
    .select('id, title, status, round_no, created_at, stops(id, activities(id)), teams(id, name, token)')
    .eq('customer_id', customerId)
    .order('created_at', { ascending: false })

  document.getElementById('loading').style.display = 'none'
  document.getElementById('quiz-grid').style.display = 'grid'

  if (error) { alert('Kunne ikke hente dine løb: ' + error.message) }
  if (error || !data?.length) {
    document.getElementById('quiz-grid').style.display = 'none'
    document.getElementById('loading').style.display = 'block'
    document.getElementById('loading').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🗺️</div>
        <h2>Du har ingen løb endnu</h2>
        <p>Kom i gang ved at oprette dit første GPS-quizforløb</p>
        <button class="btn-new" style="margin:0 auto;" onclick="newQuiz()">+ Opret dit første løb</button>
      </div>`
    return
  }

  quizzes = data
  renderGrid()
}

function renderGrid() {
  const el = document.getElementById('quiz-grid')
  el.innerHTML = quizzes.map(q => {
    const stops = q.stops ?? []
    const actCount = stops.reduce((sum, s) => sum + (s.activities?.length ?? 0), 0)
    const teams = (q.teams ?? []).filter(t => t.name !== '🧪 Testhold')
    const baseUrl = new URL('../play/quiz.html', location.href).href
    const scoreUrl = new URL('../board/scoreboard.html?q=' + q.id, location.href).href

    const teamRows = teams.length
      ? teams.map(t => {
          const url = baseUrl + '?t=' + t.token
          return `<div class="team-row-mini">
            <span class="tname">${escHtml(t.name)}</span>
            <div class="team-btns">
              <span class="mini-pill" onclick="copyText('${url}')" title="Kopiér link">📋 Link</span>
              <span class="mini-pill" onclick="showTeamQRCard('${q.id}','${t.id}')">📱 QR</span>
              <span class="mini-pill" onclick="mailTeam('${q.id}','${t.id}')">📧</span>
            </div>
          </div>`
        }).join('')
      : `<p style="font-size:.78rem;color:var(--muted);padding:.25rem 0;">Ingen hold endnu — opret hold i editoren</p>`

    return `
    <div class="quiz-card ${q.status === 'aktiv' ? 'aktiv' : ''}">
      <div class="card-top">
        <div>
          <div class="card-title">${escHtml(q.title || 'Uden titel')}</div>
          <div class="card-date">${new Date(q.created_at).toLocaleDateString('da-DK', {day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <span class="status-badge s-${q.status}">${statusLabel(q.status)}${(q.round_no ?? 1) > 1 ? ' · runde ' + q.round_no : ''}</span>
      </div>

      <div style="display:flex;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap;">
        <span class="card-stat">📍 ${stops.length} stop</span>
        <span class="card-stat">❓ ${actCount} opgaver</span>
        <span class="card-stat">👥 ${teams.length} hold</span>
      </div>

      <hr class="card-divider">
      <div class="card-section-label">Hold</div>
      <div onclick="event.stopPropagation()">${teamRows}</div>

      <hr class="card-divider">

      ${quizStatusButtons(q)}

      <hr class="card-divider">

      ${(q.status === 'aktiv' || q.status === 'arkiveret') ? `
      <div onclick="event.stopPropagation()" style="margin:.25rem 0 .6rem;">
        <a href="${scoreUrl}" target="_blank" style="
          display:flex;align-items:center;justify-content:center;gap:.5rem;
          background:linear-gradient(135deg,#166534,#22c55e);
          color:#fff;font-weight:700;font-size:.9rem;
          padding:.75rem;border-radius:10px;text-decoration:none;
          box-shadow:0 2px 8px rgba(34,197,94,.3);">
          📊 ${q.status === 'aktiv' ? 'Gå til scoreboard' : 'Se resultater'}
        </a>
      </div>` : ''}

      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-edit" onclick="openQuiz('${q.id}')">✏️ Byg løbet</button>
        <button class="btn-pill" onclick="copyText('${scoreUrl}')">📋 Scoreboard</button>
        <button class="btn-pill-gray" onclick="showScoreQR('${q.id}')">📱 QR</button>
        <button class="btn-pill-gray" onclick="printTeams('${q.id}')">🖨️ Print QR</button>
      </div>
    </div>`
  }).join('')
}

function newQuiz() {
  // Løbet oprettes først, når kunden gemmer – så der ikke opstår tomme "Nyt løb"
  try { localStorage.removeItem('ced_step') } catch (_) {}
  location.href = 'customer-editor.html'
}

function openQuiz(quizId) {
  location.href = `customer-editor.html?q=${quizId}`
}

// ── Del ───────────────────────────────────────────────────────
function getScoreboardUrl(quizId) {
  return location.origin + location.pathname.replace('app/customer-overview.html','board/scoreboard.html') + '?q=' + quizId
}

function openShare(quizId) {
  shareQuiz = quizzes.find(q => q.id === quizId)
  document.getElementById('share-title').textContent = '📤 Del: ' + (shareQuiz?.title || 'Løb')
  document.getElementById('share-modal').classList.add('open')
}
function closeShare() {
  document.getElementById('share-modal').classList.remove('open')
  shareQuiz = null
}

function doShareAction(type) {
  if (!shareQuiz) return
  const url = getScoreboardUrl(shareQuiz.id)
  if (type === 'copy-login') {
    navigator.clipboard.writeText(url).then(() => {
      closeShare()
      alert('✅ Scoreboard-link kopieret!')
    })
  } else if (type === 'qr') {
    closeShare()
    showQR(url, shareQuiz.title || 'Løb')
  } else if (type === 'mail') {
    const subject = encodeURIComponent('Se live scoreboard: ' + (shareQuiz.title || 'Quiz'))
    const body = encodeURIComponent('Følg med på live scoreboard her:\n' + url)
    window.open('mailto:?subject=' + subject + '&body=' + body)
    closeShare()
  }
}

function showQR(url, title) {
  document.getElementById('qr-title').textContent = title
  document.getElementById('qr-url').textContent = url
  const canvas = document.getElementById('qr-canvas')
  canvas.innerHTML = ''
  new QRCode(canvas, { text: url, width: 220, height: 220,
    colorDark:'#000000', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M })
  document.getElementById('qr-modal').classList.add('open')
}
function closeQR() { document.getElementById('qr-modal').classList.remove('open') }

function realTeams(q) { return (q.teams ?? []).filter(t => t.name !== '🧪 Testhold') }

function quizStatusButtons(q) {
  const stops = q.stops ?? []
  const teams = realTeams(q)
  const hasAct = stops.some(s => (s.activities?.length ?? 0) > 0)
  const ready = hasAct && teams.length > 0
  const missing = [!hasAct ? 'mindst ét stop med en opgave' : '', !teams.length ? 'mindst ét hold' : ''].filter(Boolean).join(' og ')

  const box = (inner, cols) => `<div onclick="event.stopPropagation()" style="display:grid;grid-template-columns:${cols};gap:.5rem;margin:.25rem 0;">${inner}</div>`
  const btn = (onclick, border, bg, emoji, title, color, sub, extra = '') => `
    <button onclick="${onclick}" style="padding:.75rem;border-radius:10px;border:1.5px solid ${border};background:${bg};cursor:pointer;text-align:center;${extra}">
      <div style="font-size:1.1rem;">${emoji}</div>
      <div style="font-size:.83rem;font-weight:700;color:${color};">${title}</div>
      <div style="font-size:.7rem;color:#9aa2b1;margin-top:.1rem;">${sub}</div>
    </button>`

  const test = btn(`startTestRun('${q.id}')`, '#e2e8f0', '#fff', '🧪', 'Test løbet', '#1a1f36', 'Spil det som et testhold – tæller ikke med')

  if (q.status === 'aktiv') {
    return box(test + btn(`setQuizStatus('${q.id}','arkiveret')`, '#fca5a5', '#fff1f2', '📦', 'Afslut løbet', '#991b1b', 'Holdene kan ikke spille mere'), '1fr 1fr')
  }
  if (q.status === 'arkiveret') {
    return box(btn(`setQuizStatus('${q.id}','aktiv')`, '#86efac', '#f0fdf4', '▶️', 'Start ny runde', '#166534', 'Alle starter forfra – gamle resultater gemmes'), '1fr')
  }
  const act = ready
    ? btn(`setQuizStatus('${q.id}','aktiv')`, '#6c63ff', '#f0f0ff', '▶️', 'Aktivér løbet', '#6c63ff', 'Gå live for deltagerne')
    : btn(`alert('Mangler: ${missing}')`, '#e2e8f0', '#f8f9fc', '▶️', 'Aktivér løbet', '#9aa2b1', 'Kræver stop + hold', 'opacity:.6;cursor:not-allowed;')
  return box(test + act, '1fr 1fr')
}

async function setQuizStatus(quizId, status) {
  const q = quizzes.find(x => x.id === quizId)
  if (status === 'arkiveret' && !confirm('Afslut løbet?\n\nHoldene kan ikke spille videre. Resultaterne gemmes.')) return
  if (status === 'aktiv' && q?.status === 'arkiveret' &&
      !confirm('Start en ny runde?\n\nHoldene starter forfra med nul point. Resultaterne fra forrige runde gemmes.')) return

  const { error } = await sb.schema('quiz').rpc('set_quiz_status', { p_quiz_id: quizId, p_status: status })
  if (error) { alert(error.message); return }
  await loadQuizzes()
}

// Test = eget skjult testhold. Berører hverken rigtige hold, point eller status.
async function startTestRun(quizId) {
  const q = quizzes.find(x => x.id === quizId)
  if (!(q?.stops ?? []).some(s => (s.activities?.length ?? 0) > 0)) {
    alert('Tilføj mindst ét stop med en opgave, før du kan teste.'); return
  }
  const { data: token, error } = await sb.schema('quiz').rpc('create_test_team', { p_quiz_id: quizId })
  if (error) { alert('Kunne ikke starte test: ' + error.message); return }
  window.open(new URL('../play/quiz.html?t=' + token, location.href).href, '_blank')
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert('✅ Link kopieret!'))
}

function findTeam(quizId, teamId) {
  const q = quizzes.find(x => x.id === quizId)
  return { q, t: realTeams(q ?? {}).find(x => x.id === teamId) }
}
const teamUrl = t => new URL('../play/quiz.html?t=' + t.token, location.href).href

function showTeamQRCard(quizId, teamId) {
  const { t } = findTeam(quizId, teamId); if (!t) return
  showQR(teamUrl(t), t.name)
}

function showScoreQR(quizId) {
  const q = quizzes.find(x => x.id === quizId); if (!q) return
  showQR(new URL('../board/scoreboard.html?q=' + q.id, location.href).href, (q.title || 'Løb') + ' – Scoreboard')
}

function mailTeam(quizId, teamId) {
  const { t } = findTeam(quizId, teamId); if (!t) return
  const subject = encodeURIComponent('Din holdlink: ' + t.name)
  const body = encodeURIComponent('Hej ' + t.name + ',\n\nÅbn dette link på din mobil for at deltage:\n' + teamUrl(t) + '\n\nGod fornøjelse!')
  window.open('mailto:?subject=' + subject + '&body=' + body)
}

function printTeams(quizId) {
  const q = quizzes.find(x => x.id === quizId)
  if (!q) return
  const quizTitle = q.title || 'Løb'
  const teams = (q.teams ?? []).filter(t => t.name !== '🧪 Testhold')
  if (!teams.length) { alert('Ingen hold at printe'); return; }
  const baseUrl = new URL('../play/quiz.html', location.href).href
  const win = window.open('', '_blank')
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8"><title>Hold – ${escHtml(quizTitle)}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
      h1 { font-size: 1.1rem; margin-bottom: 1.25rem; text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .hold { border: 2px solid #333; border-radius: 8px; padding: 1rem; text-align: center; page-break-inside: avoid; }
      .hold h2 { font-size: .95rem; margin-bottom: .5rem; }
      .hold p { font-size: .65rem; color: #666; word-break: break-all; margin-top: .5rem; }
      @media print { body { padding: 0; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  </head><body>
    <h1>🗺️ ${escHtml(quizTitle)}</h1>
    <div class="grid">
      ${teams.map(t => {
        const url = baseUrl + '?t=' + t.token
        return `<div class="hold"><h2>${escHtml(t.name)}</h2><div id="q${t.id}"></div><p>${url}</p></div>`
      }).join('')}
    </div>
    <script>
      ${teams.map(t => {
        const url = baseUrl + '?t=' + t.token
        return `new QRCode(document.getElementById('q${t.id}'),{text:'${url}',width:180,height:180,colorDark:'#000',colorLight:'#fff'});`
      }).join('\n')}
      setTimeout(()=>window.print(),800)
    <\/script>
  </body></html>`)
  win.document.close()
}

function statusLabel(s) {
  return { kladde:'Kladde', testing:'Test', aktiv:'Aktiv', arkiveret:'Arkiveret' }[s] ?? s
}
function escHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

init()
</script>
</body>
</html>
