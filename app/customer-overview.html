<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine løb – Jagten</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <script src="../vendor/supabase.js"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/themes.js"></script>
  <script src="../js/api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f4f6fa; --white:#fff; --ink:#0f1530; --ink-2:#4b5468; --muted:#8792a6; --line:#e4e8f0; --line-2:#eef1f6;
      --accent:#5b52f5; --accent-soft:#eeedff; --green:#16a34a; --green-soft:#e8f7ee; --amber:#d97706; --amber-soft:#fff4de;
      --red:#dc2626; --red-soft:#fdecec; --slate:#64748b; --slate-soft:#eef1f6;
      --radius:16px; --shadow:0 1px 2px rgba(15,21,48,.04), 0 6px 20px rgba(15,21,48,.06);
    }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    h1, h2, h3, .display { font-family:'Syne','Inter',system-ui,sans-serif; letter-spacing:-.01em; }
    button { font-family:inherit; cursor:pointer; }
    .ic { width:18px; height:18px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .ic.sm { width:15px; height:15px; } .ic.lg { width:22px; height:22px; }

    /* ── Topbar ── */
    header { background:var(--white); border-bottom:1px solid var(--line); height:60px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .logo { display:flex; align-items:center; gap:10px; font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; }
    .logo-mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#5b52f5,#8b5cf6); display:grid; place-items:center; color:#fff; }
    .top-right { display:flex; align-items:center; gap:8px; }
    #customer-badge { font-size:.82rem; font-weight:600; color:var(--ink-2); max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .icon-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--white); color:var(--ink-2); display:grid; place-items:center; }
    .icon-btn:hover { background:var(--bg); color:var(--ink); }
    .btn-logout { border:1px solid var(--line); background:var(--white); color:var(--ink-2); border-radius:10px; padding:0 12px; height:36px; font-size:.82rem; font-weight:600; }
    .btn-logout:hover { background:var(--bg); }

    main { max-width:1100px; margin:0 auto; padding:28px 20px 56px; }
    .page-header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
    .page-header h1 { font-size:1.8rem; font-weight:800; line-height:1.15; }
    .page-header p { color:var(--ink-2); font-size:.92rem; margin-top:2px; }
    .btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; background:var(--accent); color:#fff; border-radius:12px; padding:0 18px; height:44px; font-weight:700; font-size:.92rem; box-shadow:0 4px 14px rgba(91,82,245,.28); transition:transform .1s, box-shadow .15s; }
    .btn-primary:hover { box-shadow:0 6px 18px rgba(91,82,245,.36); } .btn-primary:active { transform:scale(.98); }

    /* ── Velkomstguide ── */
    #guide { background:linear-gradient(135deg,#25215c,#4338ca 60%,#6d5df6); color:#fff; border-radius:20px; padding:24px; margin-bottom:24px; position:relative; overflow:hidden; box-shadow:0 10px 30px rgba(67,56,202,.25); }
    #guide::after { content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.07); }
    #guide h2 { font-size:1.35rem; font-weight:800; margin-bottom:4px; position:relative; }
    #guide .sub { color:rgba(255,255,255,.8); font-size:.92rem; margin-bottom:18px; position:relative; }
    .g-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; position:relative; }
    .g-step { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:14px; }
    .g-num { width:26px; height:26px; border-radius:50%; background:#fff; color:#4338ca; font-weight:800; font-size:.82rem; display:grid; place-items:center; margin-bottom:8px; }
    .g-step b { display:block; font-size:.95rem; margin-bottom:2px; } .g-step span { font-size:.82rem; color:rgba(255,255,255,.78); }
    .g-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:relative; }
    .g-btn { background:#fff; color:#3730a3; border:none; border-radius:12px; height:42px; padding:0 18px; font-weight:800; font-size:.9rem; }
    .g-link { background:none; border:none; color:rgba(255,255,255,.85); font-size:.85rem; text-decoration:underline; padding:6px; }
    .g-help { color:rgba(255,255,255,.7); font-size:.78rem; margin-left:auto; } .g-help a { color:inherit; }

    /* ── Filtre ── */
    .tabs { display:inline-flex; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:4px; gap:2px; margin-bottom:18px; max-width:100%; overflow-x:auto; }
    .tabs button { border:none; background:none; color:var(--ink-2); font-weight:600; font-size:.85rem; padding:7px 14px; border-radius:9px; white-space:nowrap; }
    .tabs button .n { margin-left:6px; font-size:.75rem; color:var(--muted); font-weight:700; }
    .tabs button.on { background:var(--ink); color:#fff; } .tabs button.on .n { color:rgba(255,255,255,.65); }

    /* ── Løbskort ── */
    .quiz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; align-items:start; }
    .quiz-card { background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; position:relative; overflow:hidden; }
    .quiz-card::before { content:''; position:absolute; left:0; right:0; top:0; height:4px; background:var(--slate); }
    .quiz-card[data-status="aktiv"]::before { background:linear-gradient(90deg,#16a34a,#4ade80); }
    .quiz-card[data-status="kladde"]::before, .quiz-card[data-status="testing"]::before { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:4px; }
    .card-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.12rem; line-height:1.25; word-break:break-word; }
    .card-sub { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; color:var(--muted); font-size:.78rem; margin-bottom:16px; }
    .chip { display:inline-flex; align-items:center; gap:4px; background:var(--bg); border-radius:99px; padding:2px 9px; color:var(--ink-2); font-weight:600; }
    .badge { display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; }
    .badge::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .badge.aktiv { background:var(--green-soft); color:var(--green); } .badge.aktiv::before { animation:pulse 1.8s infinite; }
    .badge.kladde, .badge.testing { background:var(--amber-soft); color:var(--amber); }
    .badge.arkiveret { background:var(--slate-soft); color:var(--slate); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

    .metrics { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line-2); border-radius:12px; margin-bottom:16px; overflow:hidden; }
    .metric { padding:10px 12px; display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--line-2); }
    .metric:last-child { border-right:none; }
    .metric b { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:800; line-height:1.1; }
    .metric span { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:.74rem; font-weight:600; }

    /* trin-for-trin (kun kladder) */
    .cl { display:flex; margin-bottom:14px; }
    .cl-step { flex:1; text-align:center; position:relative; font-size:.66rem; color:var(--muted); font-weight:600; }
    .cl-step::before { content:''; position:absolute; top:10px; right:50%; width:100%; height:2px; background:var(--line); z-index:0; }
    .cl-step:first-child::before { display:none; }
    .cl-step.done::before { background:var(--green); }
    .cl-step i { position:relative; z-index:1; width:22px; height:22px; border-radius:50%; margin:0 auto 4px; background:var(--white); border:2px solid var(--line); display:grid; place-items:center; font-style:normal; font-size:.68rem; font-weight:800; }
    .cl-step.done i { background:var(--green); border-color:var(--green); color:#fff; }
    .cl-step.cur { color:var(--ink); } .cl-step.cur i { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }

    /* næste skridt */
    .next { display:flex; gap:12px; align-items:center; background:var(--accent-soft); border-radius:12px; padding:12px; margin-bottom:14px; }
    .next.live { background:var(--green-soft); } .next.ended { background:var(--slate-soft); }
    .next-ic { width:38px; height:38px; border-radius:11px; background:var(--white); display:grid; place-items:center; color:var(--accent); flex-shrink:0; }
    .next.live .next-ic { color:var(--green); } .next.ended .next-ic { color:var(--slate); }
    .next-body { flex:1; min-width:0; }
    .next-title { font-weight:700; font-size:.92rem; line-height:1.25; } .next-text { color:var(--ink-2); font-size:.8rem; line-height:1.4; margin-top:1px; }
    .next .btn-primary { height:38px; padding:0 14px; font-size:.84rem; box-shadow:none; white-space:nowrap; }
    .next.live .btn-primary { background:var(--green); } .next.ended .btn-primary { background:var(--slate); }
    .next .btn-primary:disabled { opacity:.5; cursor:not-allowed; }

    /* hold */
    details.teams { border:1px solid var(--line-2); border-radius:12px; margin-bottom:14px; }
    details.teams summary { list-style:none; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; font-weight:700; font-size:.85rem; cursor:pointer; }
    details.teams summary::-webkit-details-marker { display:none; }
    details.teams summary .ch { transition:transform .2s; color:var(--muted); } details.teams[open] summary .ch { transform:rotate(180deg); }
    .team-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 12px; border-top:1px solid var(--line-2); }
    .tname { font-size:.86rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .team-btns { display:flex; gap:4px; }
    .tbtn { width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--white); color:var(--ink-2); display:grid; place-items:center; }
    .tbtn:hover { background:var(--accent-soft); color:var(--accent); border-color:#d9d6ff; }
    .teams-empty { padding:10px 12px; border-top:1px solid var(--line-2); font-size:.8rem; color:var(--muted); }
    .board-row { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-top:1px solid var(--line-2); background:var(--bg); border-radius:0 0 11px 11px; font-size:.82rem; font-weight:600; }

    /* handlinger */
    .actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; }
    .act { display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--white); color:var(--ink); border-radius:10px; padding:9px 8px; font-size:.8rem; font-weight:600; transition:background .12s, border-color .12s; }
    .act:hover { background:var(--bg); border-color:#d5dae6; }
    .act.good { background:var(--green-soft); border-color:#bfe6cc; color:#166534; }
    .danger-link { display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--red); font-size:.8rem; font-weight:600; margin-top:12px; padding:4px 2px; }
    .danger-link:hover { text-decoration:underline; }

    /* tom/ladning */
    .empty-state { text-align:center; background:var(--white); border:1px dashed #cdd3e0; border-radius:var(--radius); padding:44px 20px; color:var(--ink-2); }
    .empty-state .badge-ic { width:56px; height:56px; border-radius:16px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin:0 auto 12px; }
    .empty-state h2 { font-size:1.15rem; color:var(--ink); margin-bottom:4px; }
    .skel { background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:20px; height:300px; overflow:hidden; position:relative; }
    .skel::after { content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%); transform:translateX(-100%); animation:shim 1.4s infinite; }
    .skel i { display:block; height:14px; border-radius:7px; background:var(--line-2); margin-bottom:14px; } @keyframes shim { to { transform:translateX(100%); } }

    /* toast */
    #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:.86rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:300; display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.25); max-width:90vw; }
    #toast.show { opacity:1; transform:translate(-50%,0); }

    /* modal (QR) */
    .modal-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(15,21,48,.5); align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--white); border-radius:20px; padding:24px; width:100%; max-width:340px; text-align:center; }
    .modal-box h3 { font-size:1.05rem; margin-bottom:12px; }
    #qr-canvas { display:flex; justify-content:center; margin:8px 0; }
    #qr-url { font-size:.68rem; color:var(--muted); word-break:break-all; margin-bottom:14px; }
    .btn-close-modal { border:1px solid var(--line); background:var(--white); border-radius:12px; height:44px; padding:0 18px; font-weight:700; }
    footer.legal { text-align:center; margin-top:40px; font-size:.76rem; color:var(--muted); }
    footer.legal a { color:inherit; }

    @media (max-width:700px) {
      main { padding:20px 14px 48px; } header { padding:0 14px; }
      .page-header h1 { font-size:1.45rem; } .quiz-grid { grid-template-columns:1fr; gap:14px; }
      .g-steps { grid-template-columns:1fr; } .g-help { margin-left:0; }
      .next { flex-wrap:wrap; } .next .btn-primary { width:100%; }
    }
    @media print { body > *:not(#qr-modal) { display:none !important; } #qr-modal { display:flex !important; position:static; background:none; } }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark"><svg class="ic sm" style="stroke-width:2.2"><use href="#i-pin"/></svg></div>Jagten</div>
  <div class="top-right">
    <span id="customer-badge">Indlæser…</span>
    <button class="icon-btn" id="btn-help" onclick="openGuide()" title="Vis guide" aria-label="Vis guide"><svg class="ic"><use href="#i-help"/></svg></button>
    <button class="btn-logout" onclick="signOut()">Log ud</button>
  </div>
</header>

<main>
  <div class="page-header">
    <div>
      <h1>Mine løb</h1>
      <p>Byg, test og del dine GPS-løb</p>
    </div>
    <button class="btn-primary" onclick="newQuiz()"><svg class="ic"><use href="#i-plus"/></svg>Nyt løb</button>
  </div>

  <section id="guide" style="display:none"></section>

  <div id="tabs" class="tabs" style="display:none"></div>

  <div id="loading" class="quiz-grid">
    <div class="skel"><i style="width:60%;height:20px"></i><i style="width:40%"></i><i style="height:56px"></i><i style="height:70px"></i><i style="width:80%"></i></div>
    <div class="skel"><i style="width:50%;height:20px"></i><i style="width:35%"></i><i style="height:56px"></i><i style="height:70px"></i><i style="width:70%"></i></div>
  </div>
  <div id="quiz-grid" class="quiz-grid" style="display:none;"></div>
  <div id="empty" style="display:none"></div>

  <footer class="legal"><a href="../privatliv.html">Privatlivspolitik</a> · <a href="../databehandleraftale.html">Databehandleraftale (til underskrift)</a></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<!-- QR modal -->
<div id="qr-modal" class="modal-overlay" onclick="if(event.target===this)closeQR()">
  <div class="modal-box">
    <h3 id="qr-title"></h3>
    <div id="qr-canvas"></div>
    <div id="qr-url"></div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="btn-primary" style="flex:1;" onclick="window.print()"><svg class="ic sm"><use href="#i-print"/></svg>Print</button>
      <button class="btn-close-modal" style="flex:1;" onclick="closeQR()">Luk</button>
    </div>
  </div>
</div>

<script>
// Print-vinduer er nye sider: de skal have en ABSOLUT sti til QR-biblioteket
const QR_SRC = new URL('../vendor/qrcode.min.js', location.href).href
let customerId = null, customerName = ''
let quizzes    = []
let filter     = 'alle'

const ico = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`

async function init() {
  const session = await getSession()
  if (!session) { location.href = 'login.html'; return; }
  if (session.type === 'pin') {
    if (session.is_admin) { location.href = 'overview.html'; return; }
    activatePinClient()
    customerId = session.customer_id
  }

  // Kundenavn (kunder må ikke læse customers direkte – via RPC)
  const { data: me } = await sb.schema('quiz').rpc('get_my_customer')
  customerName = me?.[0]?.customer_name ?? ''
  document.getElementById('customer-badge').textContent = customerName || 'Kunde'

  await loadQuizzes()
}

async function loadQuizzes() {
  const { data, error } = await sb.schema('quiz').from('quizzes')
    .select('id, title, status, round_no, created_at, theme, stops(id, activities(id, type)), teams(id, name, token)')
    .eq('customer_id', customerId)
    .order('created_at', { ascending: false })

  document.getElementById('loading').style.display = 'none'
  if (error) { toast('Kunne ikke hente dine løb: ' + error.message, true) }

  // Hvilke opgaver mangler fasit? (blokerer aktivering på serveren)
  const list = data ?? []
  const needKey = ['mc', 'tekst', 'tal']
  const ids = list.flatMap(q => (q.stops ?? []).flatMap(s => (s.activities ?? []).filter(a => needKey.includes(a.type)).map(a => a.id)))
  const keyed = new Set()
  for (let i = 0; i < ids.length; i += 80) {
    const { data: keys } = await sb.schema('quiz').from('answer_keys').select('activity_id').in('activity_id', ids.slice(i, i + 80))
    ;(keys ?? []).forEach(k => keyed.add(k.activity_id))
  }
  list.forEach(q => {
    q.missingKeys = (q.stops ?? []).flatMap(s => s.activities ?? []).filter(a => needKey.includes(a.type) && !keyed.has(a.id)).length
  })

  // Aktive øverst, så kladder, så afsluttede (nyeste først inden for hver gruppe)
  const rank = s => s === 'aktiv' ? 0 : s === 'arkiveret' ? 2 : 1
  quizzes = list.slice().sort((a, b) => rank(a.status) - rank(b.status) || new Date(b.created_at) - new Date(a.created_at))
  render()
}

// ── Velkomstguide til nye kunder ──────────────────────────────
const guideKey = () => 'jagten-guide-' + (customerId || '')
function guideDismissed() { try { return localStorage.getItem(guideKey()) === '1' } catch (_) { return false } }
function dismissGuide() { try { localStorage.setItem(guideKey(), '1') } catch (_) {}; renderGuide() }
function openGuide() { try { localStorage.removeItem(guideKey()) } catch (_) {}; renderGuide(true); document.getElementById('guide').scrollIntoView?.({ behavior: 'smooth', block: 'start' }) }

function renderGuide(force) {
  const box = document.getElementById('guide')
  const first = quizzes.length === 0
  if (!force && !first && guideDismissed()) { box.style.display = 'none'; return }
  const name = customerName ? ', ' + escHtml(customerName) : ''
  box.style.display = 'block'
  box.innerHTML = `
    <h2>Velkommen til Jagten${name}!</h2>
    <p class="sub">Sådan kommer du fra idé til live løb på tre trin:</p>
    <div class="g-steps">
      <div class="g-step"><div class="g-num">1</div><b>Opret løbet</b><span>Giv det et navn, skriv en kort velkomsttekst og vælg stil.</span></div>
      <div class="g-step"><div class="g-num">2</div><b>Byg ruten</b><span>Sæt stop på kortet, og tilføj opgaver med svar og point.</span></div>
      <div class="g-step"><div class="g-num">3</div><b>Test og del</b><span>Prøv løbet som testhold, opret hold, og del QR-koderne.</span></div>
    </div>
    <div class="g-actions">
      ${first ? `<button class="g-btn" onclick="newQuiz()">Opret dit første løb</button>` : `<button class="g-btn" onclick="dismissGuide()">Forstået</button>`}
      ${first ? '' : `<button class="g-link" onclick="newQuiz()">Opret nyt løb</button>`}
      <span class="g-help">Brug for hjælp? <a href="mailto:rasmus0705@gmail.com">rasmus0705@gmail.com</a></span>
    </div>`
}

// ── Trin og næste skridt ──────────────────────────────────────
function realTeams(q) { return (q.teams ?? []).filter(t => t.name !== '🧪 Testhold') }

function stepsOf(q) {
  const stops = q.stops ?? [], teams = realTeams(q)
  const hasAct = stops.some(s => (s.activities?.length ?? 0) > 0)
  const noKeys = q.missingKeys ?? 0
  const live = q.status === 'aktiv', ended = q.status === 'arkiveret'
  const tested = (q.teams ?? []).some(t => t.name === '🧪 Testhold') || live || ended
  return { hasAct, noKeys, teams, live, ended, tested,
    list: [['Rute', hasAct], ['Hold', teams.length > 0], ['Fasit', hasAct && noKeys === 0], ['Test', tested], ['Aktiv', live || ended], ['Afslut', ended]] }
}

function nextStep(q) {
  const s = stepsOf(q), id = q.id
  if (s.ended) return { tone: 'ended', ic: 'flag', title: 'Løbet er afsluttet', text: 'Se resultater og diplomer – eller start en ny runde.', label: 'Se resultater', click: `openResults('${id}')` }
  if (s.live)  return { tone: 'live', ic: 'play', title: 'Løbet er live', text: 'Del hold-links eller QR-koder, og følg scoreboardet.', label: 'Åbn scoreboard', click: `openScoreboard('${id}')` }
  if (!s.hasAct)  return { ic: 'route', title: 'Byg ruten', text: 'Tilføj mindst ét stop med en opgave.', label: 'Byg ruten', click: `openQuiz('${id}',2)` }
  if (s.noKeys)   return { ic: 'alert', title: 'Mangler fasit', text: `${s.noKeys} opgave${s.noKeys > 1 ? 'r' : ''} mangler fasit, før du kan aktivere.`, label: 'Ret opgaver', click: `openQuiz('${id}',2)` }
  if (!s.teams.length) return { ic: 'users', title: 'Opret hold', text: 'Hvert hold får sit eget link og QR-kode.', label: 'Opret hold', click: `openQuiz('${id}',3)` }
  if (!s.tested)  return { ic: 'flask', title: 'Test løbet', text: 'Prøv det som testhold, før du går live.', label: 'Test løbet', click: `startTestRun('${id}')` }
  return { ic: 'play', title: 'Klar til start', text: 'Aktivér løbet, når deltagerne er klar.', label: 'Aktivér løbet', click: `setQuizStatus('${id}','aktiv')` }
}

// ── Visning ───────────────────────────────────────────────────
function setFilter(f) { filter = f; render() }
const inFilter = (q, f) => f === 'alle' || (f === 'aktiv' && q.status === 'aktiv') || (f === 'kladde' && q.status !== 'aktiv' && q.status !== 'arkiveret') || (f === 'arkiveret' && q.status === 'arkiveret')

function render() {
  renderGuide()
  const tabs = document.getElementById('tabs'), grid = document.getElementById('quiz-grid'), empty = document.getElementById('empty')
  if (!quizzes.length) {
    tabs.style.display = 'none'; grid.style.display = 'none'; empty.style.display = 'block'
    empty.innerHTML = `<div class="empty-state"><div class="badge-ic">${ico('route', 'lg')}</div><h2>Du har ingen løb endnu</h2><p>Opret dit første løb, og kom i gang på få minutter.</p></div>`
    return
  }
  empty.style.display = 'none'
  const counts = { alle: quizzes.length, aktiv: 0, kladde: 0, arkiveret: 0 }
  quizzes.forEach(q => { counts[q.status === 'aktiv' ? 'aktiv' : q.status === 'arkiveret' ? 'arkiveret' : 'kladde']++ })
  tabs.style.display = 'inline-flex'
  tabs.innerHTML = [['alle', 'Alle'], ['aktiv', 'Aktive'], ['kladde', 'Kladder'], ['arkiveret', 'Afsluttede']]
    .map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-filter="${k}" onclick="setFilter('${k}')">${l}<span class="n">${counts[k]}</span></button>`).join('')

  const shown = quizzes.filter(q => inFilter(q, filter))
  grid.style.display = shown.length ? 'grid' : 'none'
  if (!shown.length) { empty.style.display = 'block'; empty.innerHTML = `<div class="empty-state"><h2>Ingen løb her</h2><p>Der er ingen løb med den status.</p></div>`; return }
  grid.innerHTML = shown.map(card).join('')
}

function card(q) {
  const stops = q.stops ?? []
  const actCount = stops.reduce((sum, s) => sum + (s.activities?.length ?? 0), 0)
  const s = stepsOf(q), next = nextStep(q), th = jagtenTheme(q.theme)
  const date = new Date(q.created_at).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' })
  const round = (q.round_no ?? 1) > 1 ? ' · runde ' + q.round_no : ''

  const teamRows = s.teams.length
    ? s.teams.map(t => `<div class="team-row"><span class="tname">${escHtml(t.name)}</span>
        <div class="team-btns">
          <button class="tbtn" onclick="copyTeamLink('${q.id}','${t.id}')" title="Kopiér link" aria-label="Kopiér link til ${escHtml(t.name)}">${ico('link', 'sm')}</button>
          <button class="tbtn" onclick="showTeamQRCard('${q.id}','${t.id}')" title="Vis QR-kode" aria-label="QR-kode til ${escHtml(t.name)}">${ico('qr', 'sm')}</button>
          <button class="tbtn" onclick="mailTeam('${q.id}','${t.id}')" title="Send på mail" aria-label="Send link til ${escHtml(t.name)}">${ico('mail', 'sm')}</button>
        </div></div>`).join('')
    : `<div class="teams-empty">Ingen hold endnu – opret dem i editoren.</div>`

  const boardRow = (s.live || s.ended) ? `<div class="board-row"><span>Scoreboard</span><div class="team-btns">
        <button class="tbtn" onclick="copyScoreLink('${q.id}')" title="Kopiér link" aria-label="Kopiér scoreboard-link">${ico('link', 'sm')}</button>
        <button class="tbtn" onclick="showScoreQR('${q.id}')" title="Vis QR-kode" aria-label="Scoreboard QR-kode">${ico('qr', 'sm')}</button></div></div>` : ''

  const secondary = [
    `<button class="act" onclick="openQuiz('${q.id}')">${ico('edit', 'sm')}Rediger</button>`,
    s.ended ? `<button class="act good" onclick="setQuizStatus('${q.id}','aktiv')">${ico('refresh', 'sm')}Ny runde</button>`
            : `<button class="act" onclick="startTestRun('${q.id}')">${ico('flask', 'sm')}Test</button>`,
    (s.live || s.ended) ? `<button class="act" onclick="openResults('${q.id}')">${ico('file', 'sm')}Resultater</button>` : '',
    `<button class="act" onclick="printTeams('${q.id}')">${ico('print', 'sm')}Print QR</button>`,
    `<button class="act" onclick="copyQuiz('${q.id}')" title="Kopiér stop, opgaver og fasit til et nyt løb">${ico('copy', 'sm')}Kopiér</button>`
  ].join('')

  return `
  <article class="quiz-card" data-status="${escHtml(q.status)}">
    <div class="card-top">
      <div class="card-title">${escHtml(q.title || 'Uden titel')}</div>
      <span class="badge ${escHtml(q.status)}">${statusLabel(q.status)}</span>
    </div>
    <div class="card-sub"><span>${date}${round}</span><span class="chip">${escHtml(th.emoji)} ${escHtml(th.name)}</span></div>

    <div class="metrics">
      <div class="metric"><b>${stops.length}</b><span>${ico('pin', 'sm')}stop</span></div>
      <div class="metric"><b>${actCount}</b><span>${ico('help', 'sm')}opgaver</span></div>
      <div class="metric"><b>${s.teams.length}</b><span>${ico('users', 'sm')}hold</span></div>
    </div>

    ${(s.live || s.ended) ? '' : `<div class="cl" aria-label="Fremgang">${s.list.map((x, i) => `<div class="cl-step ${x[1] ? 'done' : i === s.list.findIndex(y => !y[1]) ? 'cur' : ''}"><i>${x[1] ? ico('check', 'sm') : i + 1}</i>${x[0]}</div>`).join('')}</div>`}

    <div class="next ${next.tone || ''}">
      <div class="next-ic">${ico(next.ic, 'lg')}</div>
      <div class="next-body"><div class="next-title">${escHtml(next.title)}</div><div class="next-text">${escHtml(next.text)}</div></div>
      <button class="btn-primary" onclick="${next.click}">${escHtml(next.label)}</button>
    </div>

    <details class="teams" ${s.teams.length <= 3 ? 'open' : ''}>
      <summary><span>Hold · ${s.teams.length}</span><span class="ch">${ico('down', 'sm')}</span></summary>
      ${teamRows}${boardRow}
    </details>

    <div class="actions">${secondary}</div>
    ${s.live ? `<button class="danger-link" onclick="setQuizStatus('${q.id}','arkiveret')">${ico('stop', 'sm')}Afslut løbet…</button>` : ''}
  </article>`
}

// ── Handlinger ────────────────────────────────────────────────
function newQuiz() {
  // Løbet oprettes først, når kunden gemmer – så der ikke opstår tomme "Nyt løb"
  try { localStorage.removeItem('ced_step') } catch (_) {}
  location.href = 'customer-editor.html'
}
function openQuiz(quizId, step) {
  try { if (step) localStorage.setItem('ced_step', step) } catch (_) {}
  location.href = `customer-editor.html?q=${quizId}`
}
function openResults(quizId) { location.href = 'results.html?q=' + quizId }
const scoreUrl = id => new URL('../board/scoreboard.html?q=' + id, location.href).href
function openScoreboard(quizId) { window.open(scoreUrl(quizId), '_blank', 'noopener') }

async function copyQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId)
  const def = (q?.title || 'Løb') + ' (kopi)'
  const title = prompt('Navn på det nye løb:\n(stop, opgaver og fasit kopieres – hold gør ikke)', def)
  if (title === null) return
  const { error } = await sb.schema('quiz').rpc('copy_quiz', { p_quiz_id: quizId, p_title: title.trim() || def })
  if (error) { toast('Kunne ikke kopiere: ' + error.message, true); return }
  toast('Kopien er oprettet som kladde – husk at oprette nye hold')
  await loadQuizzes()
}

async function setQuizStatus(quizId, status) {
  const q = quizzes.find(x => x.id === quizId)
  if (status === 'arkiveret' && !confirm('Afslut løbet?\n\nHoldene kan ikke spille videre. Resultaterne gemmes.')) return
  if (status === 'aktiv' && q?.status === 'arkiveret' &&
      !confirm('Start en ny runde?\n\nHoldene starter forfra med nul point. Resultaterne fra forrige runde gemmes.')) return
  const { error } = await sb.schema('quiz').rpc('set_quiz_status', { p_quiz_id: quizId, p_status: status })
  if (error) { alert(error.message); return }
  await loadQuizzes()
}

// Test = eget skjult testhold. Berører hverken rigtige hold, point eller status.
async function startTestRun(quizId) {
  const q = quizzes.find(x => x.id === quizId)
  if (!(q?.stops ?? []).some(s => (s.activities?.length ?? 0) > 0)) {
    alert('Tilføj mindst ét stop med en opgave, før du kan teste.'); return
  }
  const { data: token, error } = await sb.schema('quiz').rpc('create_test_team', { p_quiz_id: quizId })
  if (error) { toast('Kunne ikke starte test: ' + error.message, true); return }
  window.open(new URL('../play/quiz.html?t=' + token, location.href).href, '_blank')
  await loadQuizzes()        // trinnet "Test" markeres som gjort
}

// ── Del / QR / print ──────────────────────────────────────────
function copyText(text, msg) {
  const done = () => toast(msg || 'Link kopieret')
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => prompt('Kopiér linket:', text))
  else prompt('Kopiér linket:', text)
}
function findTeam(quizId, teamId) {
  const q = quizzes.find(x => x.id === quizId)
  return { q, t: realTeams(q ?? {}).find(x => x.id === teamId) }
}
const teamUrl = t => new URL('../play/quiz.html?t=' + t.token, location.href).href
function copyTeamLink(quizId, teamId) { const { t } = findTeam(quizId, teamId); if (t) copyText(teamUrl(t), 'Holdlink kopieret') }
function copyScoreLink(quizId) { copyText(scoreUrl(quizId), 'Scoreboard-link kopieret') }
function showTeamQRCard(quizId, teamId) { const { t } = findTeam(quizId, teamId); if (t) showQR(teamUrl(t), t.name) }
function showScoreQR(quizId) {
  const q = quizzes.find(x => x.id === quizId); if (!q) return
  showQR(scoreUrl(q.id), (q.title || 'Løb') + ' – Scoreboard')
}
function mailTeam(quizId, teamId) {
  const { t } = findTeam(quizId, teamId); if (!t) return
  const subject = encodeURIComponent('Din holdlink: ' + t.name)
  const body = encodeURIComponent('Hej ' + t.name + ',\n\nÅbn dette link på din mobil for at deltage:\n' + teamUrl(t) + '\n\nGod fornøjelse!')
  window.open('mailto:?subject=' + subject + '&body=' + body)
}
function showQR(url, title) {
  document.getElementById('qr-title').textContent = title
  document.getElementById('qr-url').textContent = url
  const canvas = document.getElementById('qr-canvas')
  canvas.innerHTML = ''
  new QRCode(canvas, { text: url, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M })
  document.getElementById('qr-modal').classList.add('open')
}
function closeQR() { document.getElementById('qr-modal').classList.remove('open') }

function printTeams(quizId) {
  const q = quizzes.find(x => x.id === quizId)
  if (!q) return
  const quizTitle = q.title || 'Løb'
  const teams = realTeams(q)
  if (!teams.length) { toast('Opret først mindst ét hold – så kan du printe QR-koder'); return }
  const baseUrl = new URL('../play/quiz.html', location.href).href
  const win = window.open('', '_blank')
  if (!win) { toast('Browseren blokerede pop-up-vinduet – tillad pop-ups og prøv igen', true); return }
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8"><title>Hold – ${escHtml(quizTitle)}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
      h1 { font-size: 1.1rem; margin-bottom: 1.25rem; text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .hold { border: 2px solid #333; border-radius: 8px; padding: 1rem; text-align: center; page-break-inside: avoid; }
      .hold h2 { font-size: .95rem; margin-bottom: .5rem; }
      .hold p { font-size: .65rem; color: #666; word-break: break-all; margin-top: .5rem; }
      @media print { body { padding: 0; } }
    </style>
    <script src="${QR_SRC}"><\/script>
  </head><body>
    <h1>${escHtml(quizTitle)}</h1>
    <div class="grid">
      ${teams.map(t => `<div class="hold"><h2>${escHtml(t.name)}</h2><div id="q${t.id}"></div><p>${escHtml(baseUrl + '?t=' + t.token)}</p></div>`).join('')}
    </div>
    <script>
      ${teams.map(t => `new QRCode(document.getElementById('q${t.id}'),{text:'${baseUrl + '?t=' + t.token}',width:180,height:180,colorDark:'#000',colorLight:'#fff'});`).join('\n')}
      setTimeout(()=>window.print(),800)
    <\/script>
  </body></html>`)
  win.document.close()
}

// ── Små hjælpere ──────────────────────────────────────────────
let toastTimer = null
function toast(msg, isErr) {
  const el = document.getElementById('toast')
  el.innerHTML = (isErr ? ico('alert', 'sm') : ico('check', 'sm')) + '<span></span>'
  el.lastChild.textContent = msg
  el.classList.add('show')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), isErr ? 4200 : 2400)
}
function statusLabel(s) { return { kladde: 'Kladde', testing: 'Test', aktiv: 'Live', arkiveret: 'Afsluttet' }[s] ?? s }
function escHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

init()
</script>
