<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor – Quiz Platform</title>
  <link rel="stylesheet" href="../themes/standard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <style>
    #map { height:260px; border-radius:var(--radius); margin-bottom:.75rem; }

    .stop-card { border-left:4px solid var(--accent); padding:.75rem; margin-bottom:.75rem; }
    .stop-card.open { border-color:#4caf50; }

    .act-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:.4rem 0; border-bottom:1px solid rgba(255,255,255,.07);
      font-size:.85rem;
    }
    .act-row:last-child { border-bottom:none; }

    .act-form {
      background:rgba(255,255,255,.05); border-radius:var(--radius);
      padding:.75rem; margin-top:.75rem;
    }

    .team-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:.5rem 0; border-bottom:1px solid rgba(255,255,255,.07);
    }
    .team-row:last-child { border-bottom:none; }

    label { font-size:.82rem; color:var(--text-muted); display:block; margin-top:.5rem; margin-bottom:.2rem; }
    .row2 { display:flex; gap:.5rem; }
    .btn-sm { padding:.3rem .65rem; font-size:.8rem; }
    .btn-ghost { background:rgba(255,255,255,.08); }
    .btn-danger { background:var(--accent); }
    .icon-btn { background:none; border:none; cursor:pointer; color:var(--text-muted);
      font-size:.95rem; padding:.15rem .35rem; border-radius:4px; }
    .icon-btn:hover { color:var(--text); background:rgba(255,255,255,.1); }

    .status-pill {
      display:inline-block; padding:.2rem .6rem; border-radius:99px;
      font-size:.75rem; font-weight:600; vertical-align:middle;
    }
    .s-kladde   { background:#555; color:#fff; }
    .s-testing  { background:#f59e0b; color:#000; }
    .s-aktiv    { background:#4caf50; color:#fff; }
    .s-betalt   { background:#3b82f6; color:#fff; }
    .s-arkiveret{ background:#374151; color:#aaa; }

    #save-msg { font-size:.82rem; color:var(--text-muted); }
    .muted { color:var(--text-muted); font-size:.82rem; }
    textarea { width:100%; resize:vertical; }

    /* QR modal */
    #qr-modal {
      display:none; position:fixed; inset:0; z-index:9999;
      background:rgba(0,0,0,.75); align-items:center; justify-content:center;
    }
    #qr-modal.open { display:flex; }
    #qr-box {
      background:var(--surface); border-radius:var(--radius);
      padding:1.5rem; text-align:center; max-width:320px; width:90%;
    }
    #qr-box h3 { margin-bottom:.5rem; }
    #qr-canvas { margin:.75rem auto; }
    #qr-url { font-size:.7rem; color:var(--text-muted); word-break:break-all;
      margin-bottom:.75rem; }

    /* Tab navigation */
    .tab-bar {
      display:flex; gap:.25rem; margin-bottom:.75rem;
      border-bottom:1px solid rgba(255,255,255,.1);
      padding-bottom:.1rem;
    }
    .tab-btn {
      background:none; border:none; border-bottom:2px solid transparent;
      color:var(--text-muted); padding:.45rem .7rem;
      cursor:pointer; font-size:.88rem; border-radius:4px 4px 0 0;
      transition:color .15s, border-color .15s;
    }
    .tab-btn:hover { color:var(--text); background:rgba(255,255,255,.06); }
    .tab-btn.active { color:var(--text); border-bottom-color:var(--accent); }
    .badge {
      background:rgba(255,255,255,.15); border-radius:99px;
      padding:.05rem .4rem; font-size:.72rem;
    }

    .task-img-thumb {
      max-width:100%; max-height:120px; border-radius:var(--radius);
      display:block; margin-top:.4rem;
    }
    .upload-row {
      display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
      margin-top:.25rem;
    }

    @media print {
      body > *:not(#qr-modal) { display:none !important; }
      #qr-modal { display:flex !important; position:static; background:none; }
      #qr-box { box-shadow:none; padding:0; }
      #qr-print-btn, #qr-close-btn { display:none; }
    }
  </style>
</head>
<body class="page-transition">

  <!-- Topbar -->
  <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;">
    <button onclick="history.back()"
      style="background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;padding:0 .25rem;">←</button>
    <h2 id="quiz-title-display" style="flex:1;margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Ny quiz</h2>
    <span id="status-pill" class="status-pill s-kladde">kladde</span>
    <button class="btn btn-sm" onclick="saveQuiz()" style="white-space:nowrap;">💾 Gem</button>
  </div>
  <div style="min-height:.5rem;display:flex;align-items:center;margin-bottom:.5rem;">
    <span id="save-msg" style="font-size:.8rem;color:var(--text-muted);"></span>
  </div>

  <!-- Fane-navigation -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('opsaetning')" id="tab-opsaetning">⚙️ Opsætning</button>
    <button class="tab-btn" onclick="switchTab('stop')" id="tab-stop">📍 Stop <span id="stop-count" class="badge" style="margin-left:.25rem;">0</span> <span id="stop-check"></span></button>
    <button class="tab-btn" onclick="switchTab('hold')" id="tab-hold">👥 Hold <span id="hold-check"></span></button>
  </div>
  <div id="readiness-hint" class="muted" style="margin:-.25rem 0 .75rem;"></div>

  <!-- TAB: Opsætning -->
  <div id="pane-opsaetning" class="tab-pane">
    <div class="card">
      <label>Titel</label>
      <input id="title" placeholder="Fx: Auning Historiske Byvandring">

      <label style="margin-top:.75rem;">Status</label>
      <div class="row2" style="flex-wrap:wrap;margin-top:.25rem;">
        <button class="btn btn-sm btn-ghost" onclick="setStatus('kladde')">Kladde</button>
        <button class="btn btn-sm btn-ghost" onclick="setStatus('testing')">Testing</button>
        <button class="btn btn-sm" onclick="activateQuiz()" style="background:#4caf50;">▶ Aktiv</button>
        <button class="btn btn-sm btn-ghost" onclick="setStatus('arkiveret')">Arkivér</button>
      </div>
    </div>
  </div>

  <!-- TAB: Stop & Kort -->
  <div id="pane-stop" class="tab-pane" style="display:none;">
    <div class="card">
      <div id="map"></div>
      <p class="muted" style="margin:.5rem 0 .75rem;">Klik på kortet for at tilføje et stop.</p>
      <div id="stop-list"></div>
    </div>
  </div>

  <!-- TAB: Hold -->
  <div id="pane-hold" class="tab-pane" style="display:none;">
    <div class="card">
      <p class="muted" style="margin-bottom:.75rem;">
        Del linket (eller QR-koden) med holdet – de skal ikke oprette login, bare åbne linket på deres mobil.
      </p>
      <div id="team-list"><p class="muted">Ingen hold endnu.</p></div>
      <div class="row2" style="margin-top:.75rem;">
        <input id="new-team-name" placeholder="Holdnavn…" style="flex:1;width:auto;">
        <button class="btn btn-sm" onclick="addTeam()" style="width:auto;flex-shrink:0;white-space:nowrap;">+ Tilføj</button>
      </div>
      <button class="btn btn-sm btn-ghost" style="margin-top:.75rem;width:100%;" onclick="testAsPlayer()">
        🧪 Test som spiller
      </button>
    </div>
  </div>

  <!-- QR modal -->
  <div id="qr-modal" onclick="if(event.target===this)closeQR()">
    <div id="qr-box">
      <h3 id="qr-team-name"></h3>
      <div id="qr-canvas"></div>
      <div id="qr-url"></div>
      <div style="display:flex;gap:.5rem;justify-content:center;">
        <button id="qr-print-btn" class="btn btn-sm" onclick="window.print()">🖨️ Print</button>
        <button id="qr-close-btn" class="btn btn-sm btn-ghost" onclick="closeQR()">Luk</button>
      </div>
    </div>
  </div>

<script>
// ── State ────────────────────────────────────────────────────
const params   = new URLSearchParams(location.search);
let quizId     = params.get('q');
let quizStatus = 'kladde';
let stops      = [];
let teams      = [];
let map, markers = [];
let openStopId = null;

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const session = await getSession();
  if (!session) { location.href = 'login.html'; return; }

  if (session.type === 'pin') {
    activatePinClient();
  }

  map = L.map('map').setView([56.3, 10.0], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '© OpenStreetMap' }).addTo(map);
  map.on('click', onMapClick);

  if (quizId) await loadAll();
  updateReadinessUI();

  try { const t = localStorage.getItem('editor_tab'); if (t) switchTab(t); } catch {}
}

// ── Tab-navigation ────────────────────────────────────────────
function switchTab(name) {
  const tabs = ['opsaetning', 'stop', 'hold'];
  tabs.forEach(t => {
    document.getElementById('pane-' + t).style.display = (t === name) ? '' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
  });
  if (name === 'stop' && map) setTimeout(() => map.invalidateSize(), 50);
  try { localStorage.setItem('editor_tab', name); } catch {}
}

// ── Load ─────────────────────────────────────────────────────
async function loadAll() {
  const { data: q } = await sb.schema('quiz').from('quizzes')
    .select('*').eq('id', quizId).single();
  if (!q) return;
  quizStatus = q.status;
  document.getElementById('title').value = q.title;
  document.getElementById('quiz-title-display').textContent = q.title;
  setStatusPill(q.status);

  if (q.pin_expires_at) {
    const exp = new Date(q.pin_expires_at).toLocaleString('da-DK');
    const pinCurrent = document.getElementById('pin-current');
    if (pinCurrent) pinCurrent.textContent = 'Nuværende udløb: ' + exp;
  }

  const { data: stopRows } = await sb.schema('quiz').from('stops')
    .select('*, activities(*)')
    .eq('quiz_id', quizId).order('sort');

  const actIds = (stopRows ?? []).flatMap(s => (s.activities ?? []).map(a => a.id));
  let keyMap = {};
  if (actIds.length) {
    const { data: keys } = await sb.schema('quiz').from('answer_keys')
      .select('*').in('activity_id', actIds);
    (keys ?? []).forEach(k => { keyMap[k.activity_id] = k; });
  }

  stops = (stopRows ?? []).map(s => ({
    ...s,
    activities: (s.activities ?? [])
      .sort((a,b) => (a.sort??0)-(b.sort??0))
      .map(a => ({ ...a, answerKey: keyMap[a.id] ?? null }))
  }));
  renderStops();

  const { data: teamRows } = await sb.schema('quiz').from('teams')
    .select('*').eq('quiz_id', quizId).order('created_at');
  const allTeams = teamRows ?? [];

  const leftoverTest = allTeams.filter(t => t.name === TEST_TEAM_NAME);
  teams = allTeams.filter(t => t.name !== TEST_TEAM_NAME);
  if (leftoverTest.length) cleanupTestTeams(leftoverTest.map(t => t.id));

  renderTeams();
}

const TEST_TEAM_NAME = '🧪 Testhold';

async function cleanupTestTeams(teamIds) {
  if (!teamIds.length) return;
  await sb.schema('quiz').from('submissions').delete().in('team_id', teamIds);
  await sb.schema('quiz').from('team_positions').delete().in('team_id', teamIds);
  await sb.schema('quiz').from('teams').delete().in('id', teamIds);
}

// ── Quiz gem / status ─────────────────────────────────────────
async function saveQuiz() {
  const session = await getSession();
  const title   = document.getElementById('title').value.trim();
  if (!title) { flash('⚠️ Titel mangler'); return; }

  const payload = { title, status: quizStatus };
  if (session?.user?.id) payload.owner_id = session.user.id;
  let error;

  if (quizId) {
    ({ error } = await sb.schema('quiz').from('quizzes').update(payload).eq('id', quizId));
  } else {
    const { data, error: e } = await sb.schema('quiz').from('quizzes')
      .insert(payload).select().single();
    error = e;
    if (data) {
      quizId = data.id;
      history.replaceState(null, '', '?q=' + quizId);
    }
  }
  if (error) flash('❌ ' + error.message);
  else {
    document.getElementById('quiz-title-display').textContent = title;
    flash('✅ Gemt');
  }
}

async function setStatus(status) {
  if (!quizId) { await saveQuiz(); if (!quizId) return; }
  const { error } = await sb.schema('quiz').from('quizzes')
    .update({ status }).eq('id', quizId);
  if (error) { flash('❌ ' + error.message); return; }
  quizStatus = status;
  setStatusPill(status);
  flash('Status: ' + status);
}

// ── Klar-til-aktivering ───────────────────────────────────────
function getReadiness() {
  const hasStopWithActivity = stops.some(s => s.activities.length > 0);
  const hasTeam = teams.length > 0;
  const missing = [];
  if (!hasStopWithActivity) missing.push('mindst ét stop med en opgave');
  if (!hasTeam) missing.push('mindst ét hold');
  return { ready: missing.length === 0, missing, hasStopWithActivity, hasTeam };
}

function updateReadinessUI() {
  const r = getReadiness();
  document.getElementById('stop-check').textContent = r.hasStopWithActivity ? '✅' : '';
  document.getElementById('hold-check').textContent  = r.hasTeam ? '✅' : '';
  const hintEl = document.getElementById('readiness-hint');
  if (r.ready) {
    hintEl.textContent = quizStatus === 'aktiv' ? '' : '✅ Klar til at blive aktiveret.';
    hintEl.style.color = '#4caf50';
  } else {
    hintEl.textContent = '⚠️ Mangler: ' + r.missing.join(' og ') + ' for at kunne aktivere løbet.';
    hintEl.style.color = '';
  }
}

async function activateQuiz() {
  const r = getReadiness();
  if (!r.ready) {
    flash('⚠️ Mangler: ' + r.missing.join(' og '), 5000);
    return;
  }
  await setStatus('aktiv');
}

function setStatusPill(status) {
  const el = document.getElementById('status-pill');
  el.textContent = status;
  el.className   = 'status-pill s-' + status;
}

function flash(txt, ms=3000) {
  const el = document.getElementById('save-msg');
  el.textContent = txt;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.textContent=''; }, ms);
}

// ── Stops ─────────────────────────────────────────────────────
async function onMapClick(e) {
  if (!quizId) { flash('⚠️ Gem quizzen først'); return; }
  const name = prompt('Stop-navn:');
  if (!name) return;
  const { data, error } = await sb.schema('quiz').from('stops').insert({
    quiz_id: quizId, name,
    lat: e.latlng.lat, lng: e.latlng.lng,
    sort: stops.length, radius_m: 15
  }).select().single();
  if (error) { alert(error.message); return; }
  stops.push({ ...data, activities: [] });
  openStopId = data.id;
  renderStops();
}

async function deleteStop(stopId) {
  if (!confirm('Slet dette stop og alle dets opgaver?')) return;
  const { error } = await sb.schema('quiz').from('stops').delete().eq('id', stopId);
  if (error) { alert(error.message); return; }
  stops = stops.filter(s => s.id !== stopId);
  if (openStopId === stopId) openStopId = null;
  renderStops();
}

async function saveRadius(stopId, value) {
  const radius = parseInt(value)
  if (isNaN(radius) || radius < 5) return
  const { error } = await sb.schema('quiz').from('stops')
    .update({ radius_m: radius }).eq('id', stopId)
  if (error) { flash('❌ ' + error.message); return; }
  const stop = stops.find(s => s.id === stopId)
  if (stop) stop.radius_m = radius
  flash('✅ Radius gemt')
}

function toggleStop(stopId) {
  openStopId = openStopId === stopId ? null : stopId;
  renderStops();
}

function renderStops() {
  markers.forEach(m => m.remove()); markers = [];
  const bounds = [];
  stops.forEach((s, i) => {
    if (s.lat && s.lng) {
      const m = L.marker([s.lat, s.lng]).addTo(map)
        .bindPopup(`<b>${i+1}. ${s.name}</b>`);
      markers.push(m);
      bounds.push([s.lat, s.lng]);
    }
  });
  if (bounds.length) map.fitBounds(bounds, { padding:[40,40] });

  document.getElementById('stop-count').textContent = stops.length;
  document.getElementById('stop-list').innerHTML = stops.map((s,i) => `
    <div class="card stop-card ${openStopId===s.id?'open':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="cursor:pointer;font-weight:600;" onclick="toggleStop('${s.id}')">
          ${i+1}. ${s.name}
          <span class="muted" style="font-weight:400;">
            (${s.activities.length} opgave${s.activities.length!==1?'r':''})
          </span>
        </span>
        <div>
          <button class="icon-btn" onclick="toggleStop('${s.id}')">${openStopId===s.id?'▲':'▼'}</button>
          <button class="icon-btn" onclick="deleteStop('${s.id}')" title="Slet stop">🗑</button>
        </div>
      </div>
      ${openStopId===s.id ? stopDetail(s) : ''}
    </div>`).join('');
  updateReadinessUI();
}

function stopDetail(stop) {
  const rows = stop.activities.map(a => `
    <div class="act-row">
      <span>${typeLabel(a.type)} – ${shortQ(a.question)} · ${a.points??0}p
        ${a.type==='foto' ? `<span class="muted">(${approvalLabel(a.approval)})</span>` : ''}
        ${a.media_url ? '🖼' : ''}
        ${(a.type !== 'foto' && a.type !== 'info') && !a.answerKey ? '<span style="color:#f59e0b;" title="Ingen fasit">⚠️</span>' : ''}
      </span>
      <div>
        <button class="icon-btn" onclick="openActForm('${stop.id}','${a.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteActivity('${stop.id}','${a.id}')">🗑</button>
      </div>
    </div>`).join('');

  return `
    <div style="margin-top:.5rem;">
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;">
        <label style="margin:0;white-space:nowrap;">GPS-radius (meter)</label>
        <input type="number" id="radius-${stop.id}" value="${stop.radius_m??50}"
          style="width:70px;" min="5" max="500"
          onchange="saveRadius('${stop.id}',this.value)">
        <span class="muted" style="font-size:.75rem;">Anbefalet: 10–20m</span>
      </div>
      ${rows || '<p class="muted">Ingen opgaver endnu.</p>'}
      <button class="btn btn-sm" style="margin-top:.5rem;width:100%;"
        onclick="openActForm('${stop.id}','')">+ Tilføj opgave</button>
      <div id="af-${stop.id}"></div>
    </div>`;
}

function typeLabel(t) {
  return {mc:'MC',tekst:'Tekst',tal:'Tal',foto:'Foto',info:'Info'}[t]??t;
}
function approvalLabel(a) {
  return {auto:'auto',manuel:'manuel',vis_kun:'vis kun'}[a] ?? a ?? 'auto';
}
function shortQ(q) {
  if (!q) return '–';
  return q.length>45 ? q.substring(0,45)+'…' : q;
}

// ── Activity form ─────────────────────────────────────────────
function openActForm(stopId, actId) {
  const stop = stops.find(s=>s.id===stopId);
  const act  = actId ? stop.activities.find(a=>a.id===actId) : null;
  const el   = document.getElementById('af-'+stopId);
  el.innerHTML = buildForm(stopId, act);
}

function buildForm(stopId, act, mcCountOverride) {
  const type     = act?.type ?? 'mc';
  const q        = act?.question ?? '';
  const pts      = act?.points ?? 10;
  const approval = act?.approval ?? 'auto';
  const mediaUrl = act?.media_url ?? '';
  const rawOpts  = act?.options
    ? (Array.isArray(act.options) ? act.options : Object.values(act.options))
    : ['','','',''];
  const mcCount  = mcCountOverride !== undefined ? mcCountOverride : (rawOpts.filter(o => o !== '').length || 4);
  const opts     = Array.from({length: 4}, (_, i) => rawOpts[i] ?? '');
  const key      = act?.answerKey;
  const correct  = key?.correct;
  const tol      = key?.tolerance ?? 0;

  let correctVal = '';
  if (correct !== null && correct !== undefined) {
    correctVal = Array.isArray(correct) ? correct.join(', ') : String(correct);
  }

  let mcIdx = 0;
  if (type==='mc' && correct !== null && correct !== undefined) {
    const ci = opts.findIndex(o => String(o).toLowerCase() === String(correct).toLowerCase());
    if (ci>=0) mcIdx = ci;
  }

  return `<div class="act-form">
    <label>Type</label>
    <select id="af-type-${stopId}" onchange="rebuildForm('${stopId}','${act?.id??''}')">
      ${['mc','tekst','tal','foto','info'].map(t =>
        `<option value="${t}" ${type===t?'selected':''}>${{mc:'Multiple choice',tekst:'Tekst',tal:'Tal',foto:'Foto',info:'Info'}[t]}</option>`
      ).join('')}
    </select>

    <label>Spørgsmål / tekst</label>
    <textarea id="af-q-${stopId}" rows="2">${escHtml(q)}</textarea>

    <label>Billede til spørgsmål (valgfrit)</label>
    <div class="upload-row">
      <input type="file" id="af-img-${stopId}" accept="image/*"
        style="flex:1;font-size:.8rem;"
        onchange="previewTaskImage('${stopId}')">
      <button class="btn btn-sm btn-ghost" type="button"
        onclick="uploadTaskImage('${stopId}')" style="white-space:nowrap;">
        ⬆ Upload
      </button>
    </div>
    <div id="af-img-preview-${stopId}">
      ${mediaUrl
        ? `<img src="${escHtml(mediaUrl)}" class="task-img-thumb">
           <button class="btn btn-sm btn-ghost" style="margin-top:.25rem;font-size:.75rem;"
             onclick="removeTaskImage('${stopId}')">🗑 Fjern billede</button>`
        : ''}
    </div>
    <input type="hidden" id="af-media-url-${stopId}" value="${escHtml(mediaUrl)}">

    <label>Point</label>
    <input type="number" id="af-pts-${stopId}" value="${pts}" style="width:80px;">

    ${type==='mc' ? `
      <div class="row2" style="align-items:center;margin-bottom:.5rem;">
        <label style="margin:0;">Antal svarmuligheder</label>
        <select id="af-mccount-${stopId}" style="width:70px;"
          onchange="rebuildForm('${stopId}','${act?.id??''}',parseInt(this.value))">
          ${[2,3,4].map(n=>`<option value="${n}" ${mcCount===n?'selected':''}>${n}</option>`).join('')}
        </select>
      </div>
      <label>Svarmuligheder</label>
      ${[0,1,2,3].filter(i=>i<mcCount).map(i=>`
        <div class="row2" style="align-items:center;margin-bottom:.25rem;">
          <span class="muted" style="width:18px;">${String.fromCharCode(65+i)}.</span>
          <input id="af-o${i}-${stopId}" value="${escHtml(opts[i]??'')}" style="flex:1;" placeholder="Svar ${String.fromCharCode(65+i)}">
        </div>`).join('')}
      <label>Korrekt svar</label>
      <select id="af-correct-${stopId}">
        ${[0,1,2,3].filter(i=>i<mcCount).map(i=>`<option value="${i}" ${mcIdx===i?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}
      </select>
    ` : ''}

    ${type==='tekst' ? `
      <label>Fasit (komma-separeret hvis flere accepterede)</label>
      <input id="af-correct-${stopId}" value="${escHtml(correctVal)}" placeholder="Fx: skovmand, Skovmand">
    ` : ''}

    ${type==='tal' ? `
      <label>Korrekt tal</label>
      <input type="number" step="any" id="af-correct-${stopId}" value="${escHtml(correctVal)}">
      <label>Tolerance (± antal)</label>
      <input type="number" step="any" id="af-tol-${stopId}" value="${tol}">
    ` : ''}

    ${type==='foto' ? `
      <label>Godkendelse af svar-billede</label>
      <select id="af-approval-${stopId}">
        <option value="auto"    ${approval==='auto'   ?'selected':''}>Auto – point med det samme</option>
        <option value="manuel"  ${approval==='manuel' ?'selected':''}>Manuel – admin godkender</option>
        <option value="vis_kun" ${approval==='vis_kun'?'selected':''}>Vis kun – ingen point</option>
      </select>
    ` : ''}

    <div class="row2" style="margin-top:.75rem;">
      <button class="btn" onclick="saveActivity('${stopId}','${act?.id??''}')" style="flex:1;">
        Gem opgave
      </button>
      <button class="btn btn-sm btn-ghost"
        onclick="document.getElementById('af-${stopId}').innerHTML=''">
        Annuller
      </button>
    </div>
  </div>`;
}

function rebuildForm(stopId, actId, mcCountOverride) {
  const stop = stops.find(s=>s.id===stopId);
  const act  = actId ? stop.activities.find(a=>a.id===actId) : null;
  const type = document.getElementById('af-type-'+stopId).value;
  const q    = document.getElementById('af-q-'+stopId)?.value ?? '';
  const pts  = document.getElementById('af-pts-'+stopId)?.value ?? 10;
  const mediaUrl = document.getElementById('af-media-url-'+stopId)?.value ?? '';
  const mc   = mcCountOverride !== undefined ? mcCountOverride : parseInt(document.getElementById('af-mccount-'+stopId)?.value ?? '4');
  document.getElementById('af-'+stopId).innerHTML =
    buildForm(stopId, { ...act, type, question:q, points:pts, media_url:mediaUrl }, mc);
}

function previewTaskImage(stopId) {
  const file = document.getElementById('af-img-'+stopId)?.files?.[0];
  if (!file) return;
  const preview = document.getElementById('af-img-preview-'+stopId);
  const reader = new FileReader();
  reader.onload = e => {
    preview.innerHTML = `<img src="${e.target.result}" class="task-img-thumb">`;
  };
  reader.readAsDataURL(file);
}

async function uploadTaskImage(stopId) {
  const file = document.getElementById('af-img-'+stopId)?.files?.[0];
  if (!file) { flash('⚠️ Vælg et billede først'); return; }
  if (!quizId) { flash('⚠️ Gem quizzen først'); return; }

  const ext  = file.name.split('.').pop().toLowerCase();
  const path = `task-images/${quizId}/${Date.now()}.${ext}`;

  flash('⏳ Uploader…');
  const { error } = await sb.storage
    .from('quiz-uploads')
    .upload(path, file, { upsert: true });

  if (error) { flash('❌ Upload fejlede: ' + error.message); return; }

  const { data: urlData } = sb.storage
    .from('quiz-uploads')
    .getPublicUrl(path);

  document.getElementById('af-media-url-'+stopId).value = urlData.publicUrl;
  const preview = document.getElementById('af-img-preview-'+stopId);
  preview.innerHTML = `<img src="${escHtml(urlData.publicUrl)}" class="task-img-thumb">
    <button class="btn btn-sm btn-ghost" style="margin-top:.25rem;font-size:.75rem;"
      onclick="removeTaskImage('${stopId}')">🗑 Fjern billede</button>`;
  flash('✅ Billede uploadet – husk at gemme opgaven');
}

function removeTaskImage(stopId) {
  document.getElementById('af-media-url-'+stopId).value = '';
  document.getElementById('af-img-preview-'+stopId).innerHTML = '';
  const fileInput = document.getElementById('af-img-'+stopId);
  if (fileInput) fileInput.value = '';
}

async function saveActivity(stopId, actId) {
  const stop     = stops.find(s=>s.id===stopId);
  const type     = document.getElementById('af-type-'+stopId).value;
  const question = document.getElementById('af-q-'+stopId).value.trim();
  const points   = parseInt(document.getElementById('af-pts-'+stopId).value)||0;
  const mediaUrl = document.getElementById('af-media-url-'+stopId)?.value || null;
  const approval = type === 'foto'
    ? (document.getElementById('af-approval-'+stopId)?.value ?? 'auto')
    : 'auto';

  let options = null;
  if (type==='mc') {
    const mcCount = parseInt(document.getElementById('af-mccount-'+stopId)?.value ?? '4');
    options = [0,1,2,3].filter(i=>i<mcCount).map(i => document.getElementById('af-o'+i+'-'+stopId)?.value??'');
  }

  const payload = {
    stop_id: stopId, type, question, points,
    sort: stop.activities.length,
    media_url: mediaUrl,
    approval,
    ...(options ? { options } : { options: null })
  };

  let actRecord;
  if (actId) {
    const { data, error } = await sb.schema('quiz').from('activities')
      .update(payload).eq('id', actId).select().single();
    if (error) { alert(error.message); return; }
    actRecord = data;
  } else {
    const { data, error } = await sb.schema('quiz').from('activities')
      .insert(payload).select().single();
    if (error) { alert(error.message); return; }
    actRecord = data;
  }

  // Gem fasit (ikke relevant for foto/info)
  const correctVal = getCorrectVal(type, stopId, options);
  const tolerance  = type==='tal'
    ? parseFloat(document.getElementById('af-tol-'+stopId)?.value)||0
    : null;

  if (correctVal !== null) {
    const existingKey = stop.activities.find(a=>a.id===actId)?.answerKey;
    if (existingKey) {
      await sb.schema('quiz').from('answer_keys')
        .update({ correct: correctVal, tolerance })
        .eq('activity_id', actRecord.id);
    } else {
      await sb.schema('quiz').from('answer_keys')
        .insert({ activity_id: actRecord.id, correct: correctVal, tolerance });
    }
  }

  await loadAll();
  openStopId = stopId;
  renderStops();
  setTimeout(() => {
    document.getElementById('stop-list')
      ?.querySelector(`[onclick*="${stopId}"]`)
      ?.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 100);
}

function getCorrectVal(type, stopId, options) {
  if (type==='mc') {
    const idx = parseInt(document.getElementById('af-correct-'+stopId).value);
    const val = options?.[idx];
    return val != null && val !== '' ? val : null;
  }
  if (type==='tekst') {
    const raw = document.getElementById('af-correct-'+stopId)?.value.trim();
    if (!raw) return null;
    const parts = raw.split(',').map(v=>v.trim()).filter(Boolean);
    return parts.length===1 ? parts[0] : parts;
  }
  if (type==='tal') {
    const n = parseFloat(document.getElementById('af-correct-'+stopId)?.value);
    return isNaN(n) ? null : n;
  }
  return null; // foto, info
}

async function deleteActivity(stopId, actId) {
  if (!confirm('Slet denne opgave?')) return;
  const { error } = await sb.schema('quiz').from('activities').delete().eq('id', actId);
  if (error) { alert(error.message); return; }
  const stop = stops.find(s=>s.id===stopId);
  stop.activities = stop.activities.filter(a=>a.id!==actId);
  renderStops();
}

// ── Teams ─────────────────────────────────────────────────────
async function addTeam() {
  if (!quizId) { flash('⚠️ Gem quizzen først'); return; }
  const name = document.getElementById('new-team-name').value.trim();
  if (!name) return;
  const token = name.toLowerCase()
    .replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa')
    .replace(/[^a-z0-9]/g,'-') + '-' + Math.random().toString(36).slice(2,6);

  const { data, error } = await sb.schema('quiz').from('teams')
    .insert({ quiz_id: quizId, name, token }).select().single();
  if (error) { alert(error.message); return; }
  teams.push(data);
  document.getElementById('new-team-name').value = '';
  renderTeams();
}

async function deleteTeam(teamId) {
  if (!confirm('Slet holdet? (besvarelser slettes også)')) return;
  const { error } = await sb.schema('quiz').from('teams').delete().eq('id', teamId);
  if (error) { alert(error.message); return; }
  teams = teams.filter(t=>t.id!==teamId);
  renderTeams();
}

function renderTeams() {
  const base = location.origin +
    location.pathname.replace(/app\/editor\.html.*/, 'play/quiz.html');
  const el = document.getElementById('team-list');
  if (!teams.length) {
    el.innerHTML='<p class="muted">Ingen hold endnu.</p>'; return;
  }
  el.innerHTML = teams.map(t => {
    const url = base + '?t=' + t.token;
    return `
      <div class="team-row">
        <div>
          <strong>${escHtml(t.name)}</strong>
          <div class="muted" style="font-size:.72rem;word-break:break-all;">${url}</div>
        </div>
        <div style="display:flex;gap:.4rem;align-items:center;margin-left:.5rem;">
          <button class="btn btn-sm btn-ghost" onclick="copyLink('${url}')">Kopiér</button>
          <button class="btn btn-sm btn-ghost" onclick="showQR('${escHtml(url)}','${escHtml(t.name)}')">QR</button>
          <button class="icon-btn" onclick="deleteTeam('${t.id}')">🗑</button>
        </div>
      </div>`;
  }).join('');
  updateReadinessUI();
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(()=>flash('✅ Link kopieret'));
}

async function testAsPlayer() {
  if (!quizId) { flash('⚠️ Gem quizzen først'); return; }
  const base = location.origin +
    location.pathname.replace(/app\/editor\.html.*/, 'play/quiz.html');

  const { data: oldTest } = await sb.schema('quiz').from('teams')
    .select('id').eq('quiz_id', quizId).eq('name', TEST_TEAM_NAME);
  if (oldTest?.length) await cleanupTestTeams(oldTest.map(t => t.id));

  const token = 'test-' + Math.random().toString(36).slice(2, 8);
  const { data: testTeam, error } = await sb.schema('quiz').from('teams')
    .insert({ quiz_id: quizId, name: TEST_TEAM_NAME, token }).select().single();
  if (error) { flash('❌ ' + error.message); return; }

  window.open(base + '?t=' + testTeam.token, '_blank');
  flash('🧪 Testhold oprettet – ryddes automatisk op, når du genindlæser editoren');
}

// ── QR ────────────────────────────────────────────────────────
let _qrObj = null;
function showQR(url, teamName) {
  document.getElementById('qr-team-name').textContent = teamName;
  document.getElementById('qr-url').textContent = url;
  const canvas = document.getElementById('qr-canvas');
  canvas.innerHTML = '';
  _qrObj = new QRCode(canvas, {
    text: url, width: 220, height: 220,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('qr-modal').classList.add('open');
}
function closeQR() {
  document.getElementById('qr-modal').classList.remove('open');
}

// ── Helpers ───────────────────────────────────────────────────
function escHtml(s) {
  return String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
