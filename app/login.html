<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Log ind – GPS Jagten</title>
  <link rel="stylesheet" href="../themes/standard.css">
  <script src="../vendor/supabase.js"></script>
  <script src="../js/config.js"></script>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem;
    }
    .login-box { width: 100%; max-width: 320px; }
    .logo { text-align: center; font-size: 2.5rem; margin-bottom: .5rem; }
    .app-name {
      text-align: center; font-size: 1.1rem; font-weight: 700;
      margin-bottom: 1.75rem; color: var(--text);
    }
    #pin-input {
      font-size: 1.8rem; text-align: center;
      letter-spacing: .6rem; font-weight: 700;
      padding: .75rem; width: 100%;
    }
    #error-msg {
      text-align: center; color: var(--accent);
      font-size: .85rem; min-height: 1.2rem;
      margin-top: .5rem;
    }
    #context-label {
      text-align: center; font-size: .8rem;
      color: var(--text-muted); margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">🗺️</div>
    <div class="app-name">GPS Jagten</div>

    <div class="card">
      <div id="context-label"></div>
      <label style="display:block;margin-bottom:.4rem;font-size:.82rem;color:var(--text-muted);">
        PIN-kode
      </label>
      <input id="pin-input" type="password" inputmode="numeric"
        maxlength="8" placeholder="••••" autocomplete="off" autofocus>
      <p id="error-msg"></p>
      <button id="login-btn" class="btn" style="width:100%;margin-top:.75rem;"
        onclick="login()">Log ind</button>
    </div>
  </div>

<script>
  const params     = new URLSearchParams(location.search)
  const customerId = params.get('c')   // kunde-login
  // admin-login: ingen parameter

  if (customerId) {
    document.getElementById('context-label').textContent = 'Kunde-adgang'
  }

  // Allerede logget ind? Redirect
  const stored = (() => {
    try {
      const raw = localStorage.getItem('pin_session')
      if (!raw) return null
      const s = JSON.parse(raw)
      if (!s.expires_at || new Date(s.expires_at) < new Date()) {
        localStorage.removeItem('pin_session'); return null
      }
      return s
    } catch { return null }
  })()

  // Auto-redirect hvis session findes og vi ikke er midt i et nyt login
  if (stored && !customerId) {
    if (stored.is_admin) location.replace('overview.html')
    else                 location.replace('customer-overview.html')
  }
  if (stored && customerId && stored.customer_id === customerId) {
    location.replace('customer-overview.html')
  }

  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login()
  })

  async function login() {
    const pin = document.getElementById('pin-input').value.trim()
    if (!pin) return

    const btn = document.getElementById('login-btn')
    btn.disabled = true; btn.textContent = '…'
    document.getElementById('error-msg').textContent = ''

    try {
      const { createClient } = supabase
      const client = createClient(SUPABASE_URL, SUPABASE_ANON)

      const body = customerId
        ? { customer_id: customerId, pin }
        : { pin }

      const { data, error } = await client.functions.invoke('quiz-pin-auth', { body })

      if (error || data?.error) {
        // supabase-js giver kun en generisk fejl ved 401/429 – læs den rigtige besked fra svaret
        let msg = data?.error ?? 'Fejl ved login'
        if (error) { try { const body = await error.context.json(); msg = body.error || msg } catch (_) {} }
        showError(msg)
        btn.disabled = false; btn.textContent = 'Log ind'
        return
      }

      localStorage.setItem('pin_session', JSON.stringify({
        session_id  : data.session_id,
        is_admin    : data.is_admin,
        customer_id : data.customer_id,
        expires_at  : data.expires_at
      }))

      if (data.is_admin) location.href = 'overview.html'
      else               location.href = 'customer-overview.html'

    } catch (e) {
      showError('Netværksfejl – prøv igen')
      btn.disabled = false; btn.textContent = 'Log ind'
    }
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    document.getElementById('pin-input').value = ''
    document.getElementById('pin-input').focus()
  }
</script>
<p style="position:fixed;bottom:.7rem;left:0;right:0;text-align:center;font-size:.72rem;opacity:.65"><a href="../privatliv.html" style="color:inherit">Privatlivspolitik</a></p>
</body>
</html>
