<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – Quiz Platform</title>
<link rel="stylesheet" href="../themes/standard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f6f9; min-height: 100vh; }

  header {
    background: #1a2744; color: #fff;
    padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.2rem; }
  header span { font-size: 0.85rem; opacity: .7; }

  .top-bar {
    display: flex; align-items: center; gap: .75rem;
  }
  .btn { padding: .5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  .btn-primary { background: #e8445a; color: #fff; }
  .btn-primary:hover { background: #c73349; }
  .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }

  main { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }

  .section-title {
    font-size: 1rem; font-weight: 600; color: #444;
    margin-bottom: 1rem;
  }

  .quiz-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  .quiz-card {
    background: #fff; border-radius: 10px;
    padding: 1.25rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    display: flex; flex-direction: column; gap: .6rem;
    cursor: pointer;
    transition: box-shadow .15s;
    text-decoration: none; color: inherit;
  }
  .quiz-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.14); }

  .quiz-card h2 { font-size: 1rem; font-weight: 600; }
  .quiz-card p  { font-size: .82rem; color: #888; }

  .badge {
    display: inline-block;
    padding: .2rem .55rem;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    width: fit-content;
  }
  .badge-kladde   { background: #eee;  color: #555; }
  .badge-testing  { background: #fff3cd; color: #856404; }
  .badge-aktiv    { background: #d1f5d3; color: #1a6b1e; }
  .badge-arkiveret{ background: #f8d7da; color: #842029; }

  .new-card {
    background: #fff; border-radius: 10px;
    padding: 1.25rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border: 2px dashed #cdd5e0;
    display: flex; align-items: center; justify-content: center;
    gap: .5rem;
    cursor: pointer;
    color: #777; font-size: .9rem;
    transition: border-color .15s, color .15s;
  }
  .new-card:hover { border-color: #e8445a; color: #e8445a; }

  .empty {
    text-align: center; color: #aaa;
    padding: 3rem 1rem;
    grid-column: 1 / -1;
  }

  #loading {
    text-align: center; color: #aaa;
    padding: 3rem 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>🗺️ Quiz Platform</h1>
  <div class="top-bar">
    <span id="user-email"></span>
    <button class="btn btn-ghost" onclick="signOut()">Log ud</button>
  </div>
</header>

<main>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem;">
    <div class="section-title">Dine quizzer</div>
    <button class="btn btn-primary" onclick="createQuiz()">+ Ny quiz</button>
  </div>

  <div id="loading">Indlæser…</div>
  <div class="quiz-grid" id="grid" style="display:none;"></div>
</main>

<script>
let isAdmin = false;

(async () => {
  // Auth-tjek – understøtter både PIN-session og Supabase-session
  const session = await getSession();
  if (!session) {
    location.href = 'login.html';
    return;
  }

  // Aktiver PIN-klient hvis det er en PIN-session
  if (session.type === 'pin') {
    if (!session.is_admin) {
      // Kunde-PIN hører til editor, ikke dashboard
      location.href = `editor.html?q=${session.quiz_id}`;
      return;
    }
    activatePinClient();
    isAdmin = true;
    document.getElementById('user-email').textContent = 'Admin';
  } else {
    isAdmin = true; // Supabase-login = altid admin
    document.getElementById('user-email').textContent = session.user?.email ?? '';
  }

  await loadQuizzes();
})();

async function loadQuizzes() {
  const { data, error } = await sb
    .schema('quiz')
    .from('quizzes')
    .select('id, title, status, created_at')
    .order('created_at', { ascending: false });

  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('grid');
  grid.style.display = 'grid';
  grid.innerHTML = '';

  if (error) {
    grid.innerHTML = `<p style="color:red;grid-column:1/-1">Fejl: ${error.message}</p>`;
    return;
  }

  if (!data || data.length === 0) {
    grid.innerHTML = `<div class="empty">Du har ingen quizzer endnu.<br>Klik "+ Ny quiz" for at starte.</div>`;
  } else {
    data.forEach(q => {
      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.innerHTML = `
        <a href="editor.html?q=${q.id}" style="text-decoration:none;color:inherit;">
          <h2>${q.title || '(uden titel)'}</h2>
          <span class="badge badge-${q.status}">${labelStatus(q.status)}</span>
          <p>Oprettet ${formatDate(q.created_at)}</p>
        </a>
        ${isAdmin ? `<button class="btn btn-sm" style="margin-top:.5rem;width:100%;" onclick="openPin('${q.id}','${(q.title||'').replace(/'/g,"\\'")}')">🔑 Kunde-PIN</button>` : ''}
      `;
      grid.appendChild(card);
    });
  }
}

async function createQuiz() {
  const session = await getSession();
  // PIN-admin har ingen user.id – owner_id er nullable for PIN-oprettede quizzer
  const insertRow = { title: 'Ny quiz', status: 'kladde' };
  if (session?.user?.id) insertRow.owner_id = session.user.id;

  const { data, error } = await sb
    .schema('quiz')
    .from('quizzes')
    .insert(insertRow)
    .select('id')
    .single();

  if (error) { alert('Kunne ikke oprette quiz: ' + error.message); return; }
  location.href = `editor.html?q=${data.id}`;
}

function labelStatus(s) {
  return { kladde: 'Kladde', testing: 'Test', aktiv: 'Aktiv', arkiveret: 'Arkiveret' }[s] ?? s;
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ── Kunde-PIN modal ───────────────────────────────────────────
let pinQuizId = null;

function openPin(quizId, title) {
  pinQuizId = quizId;
  document.getElementById('pin-modal-title').textContent = title;
  document.getElementById('pin-new').value = '';
  document.getElementById('pin-expires').value = '';
  document.getElementById('pin-msg').textContent = '';
  document.getElementById('pin-modal').style.display = 'flex';
}

function closePin() {
  document.getElementById('pin-modal').style.display = 'none';
  pinQuizId = null;
}

async function savePin() {
  if (!pinQuizId) return;
  const pin     = document.getElementById('pin-new').value.trim();
  const expires = document.getElementById('pin-expires').value;
  const msgEl   = document.getElementById('pin-msg');

  if (!pin || pin.length < 4) { msgEl.textContent = '⚠️ PIN skal være mindst 4 cifre'; return; }
  if (!/^\d+$/.test(pin))     { msgEl.textContent = '⚠️ PIN må kun indeholde tal'; return; }

  const buf     = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
  const pinHash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');

  const update = { pin_hash: pinHash };
  if (expires) update.pin_expires_at = new Date(expires).toISOString();

  const { error } = await sb.schema('quiz').from('quizzes').update(update).eq('id', pinQuizId);
  if (error) {
    msgEl.textContent = '❌ ' + error.message;
  } else {
    const loginUrl = `${location.origin}${location.pathname.replace('dashboard.html','login.html')}?q=${pinQuizId}`;
    msgEl.innerHTML = `✅ PIN gemt!<br><b>Kode: ${pin}</b><br><small style="word-break:break-all">${loginUrl}</small>
      <br><button onclick="navigator.clipboard.writeText('Link: ${loginUrl}\\nPIN: ${pin}')" style="margin-top:.4rem;font-size:.8rem;cursor:pointer;">📋 Kopiér link + PIN</button>`;
  }
}
</script>
<!-- Kunde-PIN modal -->
<div id="pin-modal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);align-items:center;justify-content:center;" onclick="if(event.target===this)closePin()">
  <div style="background:#fff;border-radius:10px;padding:1.5rem;width:90%;max-width:380px;display:flex;flex-direction:column;gap:.75rem;">
    <h3 style="margin:0;">🔑 Kunde-PIN – <span id="pin-modal-title"></span></h3>
    <div>
      <label style="font-size:.82rem;color:#666;display:block;margin-bottom:.25rem;">Ny PIN (4–8 cifre)</label>
      <input id="pin-new" type="text" inputmode="numeric" maxlength="8" placeholder="••••"
        style="width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px;font-size:1.1rem;letter-spacing:.3rem;font-weight:700;">
    </div>
    <div>
      <label style="font-size:.82rem;color:#666;display:block;margin-bottom:.25rem;">Udløber (valgfrit)</label>
      <input id="pin-expires" type="datetime-local" style="width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px;">
    </div>
    <div style="display:flex;gap:.5rem;">
      <button class="btn btn-primary" style="flex:1;" onclick="savePin()">Gem PIN</button>
      <button class="btn" style="background:#eee;color:#333;" onclick="closePin()">Luk</button>
    </div>
    <p id="pin-msg" style="font-size:.82rem;color:#555;margin:0;min-height:1rem;"></p>
  </div>
</div>
</body>
</html>
