<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard – Jagten</title>
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --night:#0d0f14; --deep:#13161e; --panel:#1a1e28; --border:rgba(255,255,255,.08);
    --gold:#e8c84a; --silver:#b0b8c8; --bronze:#cd7f32; --green:#22c55e; --coral:#e94560;
    --muted:rgba(255,255,255,.45); --text:#f0eeea;
  }
  html, body { min-height:100vh; background:var(--night); color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
  button, select { font-family:inherit; }

  header {
    background:var(--deep); border-bottom:1px solid var(--border); padding:1rem 1.75rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
    position:sticky; top:0; z-index:100;
  }
  header h1 { font-size:1.2rem; font-weight:800; }
  #quiz-title { font-size:.85rem; color:var(--muted); margin-top:.15rem; }
  .hr { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:.4rem; font-size:.75rem; font-weight:700; padding:.3rem .75rem; border-radius:99px; border:1px solid; }
  .pill.live  { background:rgba(34,197,94,.15);  border-color:rgba(34,197,94,.3);  color:var(--green); }
  .pill.test  { background:rgba(232,200,74,.12); border-color:rgba(232,200,74,.3); color:var(--gold); }
  .pill.ended { background:rgba(255,255,255,.07); border-color:var(--border);      color:var(--muted); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:blink 2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  select#round-sel, .tv-btn {
    background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:99px;
    padding:.3rem .75rem; font-size:.75rem; font-weight:600; cursor:pointer;
  }
  #updated { font-size:.7rem; color:var(--muted); }

  /* quizmaster-bar */
  #mgr { display:none; background:var(--panel); border-bottom:1px solid var(--border); padding:.7rem 1.75rem; gap:.75rem; align-items:center; flex-wrap:wrap; font-size:.82rem; color:var(--muted); }
  #mgr.show { display:flex; }
  .mbtn { border:none; border-radius:99px; padding:.45rem 1rem; font-size:.8rem; font-weight:700; cursor:pointer; color:#fff; }
  .mbtn.red { background:var(--coral); } .mbtn.green { background:#16a34a; }
  #mgr-msg { color:var(--gold); }

  main { max-width:820px; margin:0 auto; padding:1.75rem 1.25rem 4rem; }
  #notice { display:none; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:1.25rem; text-align:center; color:var(--muted); margin-bottom:1.25rem; line-height:1.6; }
  #notice.show { display:block; }
  #notice.err { color:#ffb3c0; border-color:rgba(233,69,96,.4); }

  #winner { display:none; background:linear-gradient(135deg, rgba(232,200,74,.2), rgba(232,200,74,.05)); border:1px solid rgba(232,200,74,.3); border-radius:16px; padding:1.5rem; text-align:center; margin-bottom:1.5rem; }
  #winner .t { font-size:2.6rem; } #winner h2 { color:var(--gold); font-size:1.4rem; margin:.3rem 0 .15rem; } #winner p { color:var(--muted); font-size:.88rem; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin-bottom:1.5rem; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:.85rem; text-align:center; }
  .stat b { display:block; font-size:1.5rem; color:var(--gold); } .stat span { font-size:.72rem; color:var(--muted); }

  .podium { display:flex; align-items:flex-end; justify-content:center; gap:.9rem; margin-bottom:1.75rem; min-height:170px; }
  .slot { display:flex; flex-direction:column; align-items:center; gap:.3rem; }
  .slot .n { font-size:.82rem; font-weight:700; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .slot .p { font-size:.75rem; color:var(--muted); }
  .blk { width:96px; border-radius:10px 10px 0 0; display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .s1 .blk { height:130px; background:linear-gradient(180deg,#f5c518,#c9a200); }
  .s2 .blk { height:95px;  background:linear-gradient(180deg,#c8d0dc,#8a95a8); }
  .s3 .blk { height:68px;  background:linear-gradient(180deg,#cd7f32,#a05e1a); }

  .sec { font-size:.72rem; font-weight:700; letter-spacing:.08em; color:var(--muted); margin:1.5rem 0 .7rem; }
  .row { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:.85rem 1.1rem; display:flex; align-items:center; gap:.85rem; margin-bottom:.5rem; transition:background .3s; }
  .row.top { border-color:rgba(232,200,74,.2); } .row.fin { border-color:rgba(34,197,94,.25); }
  .row.bump { animation:bump 1.4s ease-out; }
  @keyframes bump { 0% { background:rgba(232,200,74,.35); transform:scale(1.02); } 100% { background:var(--panel); transform:none; } }
  .rk { width:1.8rem; text-align:center; font-weight:800; color:var(--muted); }
  .rk.g { color:var(--gold); } .rk.s { color:var(--silver); } .rk.b { color:var(--bronze); }
  .info { flex:1; min-width:0; }
  .nm { font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .badge { font-size:.65rem; font-weight:700; padding:.15rem .5rem; border-radius:99px; background:rgba(34,197,94,.15); color:var(--green); border:1px solid rgba(34,197,94,.3); }
  .meta { font-size:.75rem; color:var(--muted); margin-top:.1rem; display:flex; gap:.7rem; flex-wrap:wrap; }
  .bar { height:4px; background:rgba(255,255,255,.08); border-radius:99px; margin-top:.4rem; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .6s; } .bar i.f { background:var(--green); }
  .pts { font-size:1.15rem; font-weight:800; color:var(--gold); text-align:right; } .tm { font-size:.72rem; color:var(--muted); text-align:right; }

  /* fotos */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.75rem; }
  .ph { position:relative; border-radius:10px; overflow:hidden; aspect-ratio:1; background:var(--panel); }
  .ph img { width:100%; height:100%; object-fit:cover; }
  .ph span { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent, rgba(0,0,0,.75)); padding:.35rem .5rem; font-size:.68rem; font-weight:600; }
  .pend { background:var(--panel); border:1px solid rgba(232,200,74,.3); border-radius:12px; padding:.75rem; display:flex; gap:.85rem; align-items:center; margin-bottom:.6rem; }
  .pend img { width:84px; height:84px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .pend .t { flex:1; min-width:0; font-size:.82rem; } .pend .t b { display:block; font-size:.9rem; }
  .pend .a { display:flex; flex-direction:column; gap:.35rem; }

  .attr { text-align:center; font-size:.7rem; color:rgba(255,255,255,.25); margin-top:2.5rem; }

  /* TV-visning */
  body.tv main { max-width:1100px; } body.tv .nm { font-size:1.5rem; } body.tv .pts { font-size:2rem; }
  body.tv .meta { font-size:1rem; } body.tv .row { padding:1.2rem 1.5rem; } body.tv .rk { font-size:1.6rem; width:3rem; }
  body.tv .stats, body.tv #mgr, body.tv .attr { display:none; }

  @media (max-width:600px) {
    header, #mgr { padding:.85rem 1rem; } main { padding:1.25rem 1rem 3rem; }
    .blk { width:78px; } .s1 .blk { height:105px; } .s2 .blk { height:78px; } .s3 .blk { height:56px; }
  }
</style>
</head>
<body>

<header>
  <div><h1>🏆 Scoreboard</h1><div id="quiz-title">Indlæser…</div></div>
  <div class="hr">
    <select id="round-sel" style="display:none" title="Vælg runde"></select>
    <span id="status-pill" class="pill live" style="display:none"></span>
    <button class="tv-btn" id="tv-btn" title="Stor visning til skærm">📺</button>
    <span id="updated"></span>
  </div>
</header>

<div id="mgr">
  <span>Quizmaster</span>
  <button class="mbtn red"   id="btn-end"    style="display:none">🏁 Afslut løbet</button>
  <button class="mbtn green" id="btn-reopen" style="display:none">▶ Start ny runde</button>
  <span id="mgr-msg"></span>
</div>

<main>
  <div id="notice"></div>
  <div id="winner"><div class="t">🏆</div><h2 id="winner-name"></h2><p id="winner-sub"></p></div>

  <div id="pending-wrap" style="display:none">
    <div class="sec">📸 AFVENTER GODKENDELSE</div>
    <div id="pending"></div>
  </div>

  <div id="body" style="display:none">
    <div class="stats">
      <div class="stat"><b id="s-teams">–</b><span>Hold</span></div>
      <div class="stat"><b id="s-done">–</b><span>Færdige</span></div>
      <div class="stat"><b id="s-stops">–</b><span>Stop</span></div>
    </div>
    <div class="podium" id="podium"></div>
    <div class="sec">RANGLISTE</div>
    <div id="list"></div>
    <div id="photos-wrap" style="display:none">
      <div class="sec">📸 FOTO-BESVARELSER</div>
      <div class="grid" id="photos"></div>
    </div>
  </div>
  <div class="attr">Jagten · live opdatering</div>
</main>

<script>
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);          // offentlig klient – kun RPC
const qs = new URLSearchParams(location.search);
const quizId = qs.get('q');
let viewRound = Number(qs.get('r')) || null;
let sbm = null, isManager = false;                              // klient med quizmaster-session
let prev = {}, firstRender = true, lastData = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function notice(text, err) { const n = $('notice'); n.textContent = text; n.className = 'show' + (err ? ' err' : ''); if (!text) n.className = ''; }

// ── quizmaster-detektion: kun hvis der ligger en gyldig session OG den må styre dette løb ──
async function detectManager() {
  try {
    const s = JSON.parse(localStorage.getItem('pin_session') || 'null');
    if (!s || !(new Date(s.expires_at) > new Date())) return;
    sbm = createClient(SUPABASE_URL, SUPABASE_ANON, { global: { headers: { 'x-session': s.session_id } } });
    const { data } = await sbm.schema('quiz').rpc('check_session', { p_quiz_id: quizId });
    isManager = data === true;
    $('mgr').classList.toggle('show', isManager);
  } catch (_) {}
}

// ── hent + tegn ──
async function load() {
  if (!quizId || !UUID.test(quizId)) { $('quiz-title').textContent = ''; notice('Ugyldigt scoreboard-link. Der mangler ?q=<quiz-id>.', true); return; }
  const { data, error } = await sb.schema('quiz').rpc('get_scoreboard', { p_quiz_id: quizId, p_round: viewRound });
  if (error) { notice('Kunne ikke hente scoreboard: ' + error.message, true); return; }
  if (!data) { $('quiz-title').textContent = ''; $('body').style.display = 'none'; notice('Scoreboardet er ikke åbent endnu – det vises, når løbet er aktivt.'); return; }
  lastData = data; notice(''); render(data);
  if (isManager) loadPending();
}

function fmtDur(s) { if (s == null) return '–'; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}t ${m}m` : m ? `${m}m ${x}s` : `${x}s`; }

function render(d) {
  const q = d.quiz, teams = d.teams || [];
  $('quiz-title').textContent = q.title + (d.rounds.length > 1 ? ` · Runde ${d.round}` : '');
  document.title = q.title + ' – Scoreboard';

  const pill = $('status-pill'); pill.style.display = 'inline-flex';
  if (q.status === 'aktiv')        { pill.className = 'pill live';  pill.innerHTML = '<span class="dot"></span> Live'; }
  else if (q.status === 'testing') { pill.className = 'pill test';  pill.textContent = '🧪 Test'; }
  else                             { pill.className = 'pill ended'; pill.textContent = '🏁 Afsluttet'; }

  const sel = $('round-sel');
  if (d.rounds.length > 1) {
    sel.style.display = '';
    sel.innerHTML = d.rounds.slice().reverse().map(r => `<option value="${r}" ${r === d.round ? 'selected' : ''}>Runde ${r}${r === q.round_no ? ' (nuværende)' : ''}</option>`).join('');
  } else sel.style.display = 'none';

  $('btn-end').style.display    = isManager && q.status !== 'arkiveret' ? '' : 'none';
  $('btn-reopen').style.display = isManager && q.status === 'arkiveret' ? '' : 'none';

  $('body').style.display = 'block';
  const doneN = teams.filter(t => t.finished).length;
  $('s-teams').textContent = teams.length; $('s-done').textContent = doneN; $('s-stops').textContent = d.stops;

  // vinder
  const ended = q.status === 'arkiveret' || (teams.length > 0 && doneN === teams.length);
  if (ended && teams.length && teams[0].answered > 0) {
    $('winner').style.display = 'block';
    $('winner-name').textContent = '🥇 ' + teams[0].name;
    $('winner-sub').textContent = `${teams[0].points} point – tillykke!`;
  } else $('winner').style.display = 'none';

  // podium
  const pod = $('podium'), medals = ['🥇','🥈','🥉'];
  pod.innerHTML = [1, 0, 2].map(i => {
    const t = teams[i]; if (!t) return '';
    return `<div class="slot s${i+1}"><div class="n">${esc(t.name)}</div><div class="p">${t.points} pt</div><div class="blk">${medals[i]}</div></div>`;
  }).join('');
  pod.style.display = teams.length ? 'flex' : 'none';

  // liste
  const total = d.activities;
  $('list').innerHTML = teams.length ? teams.map((t, i) => {
    const pct = total ? Math.min(100, t.answered / total * 100) : 0;
    const rk = i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : '';
    const bump = !firstRender && prev[t.name] !== undefined && t.points > prev[t.name] ? ' bump' : '';
    return `<div class="row${i < 3 ? ' top' : ''}${t.finished ? ' fin' : ''}${bump}">
      <div class="rk ${rk}">${i + 1}</div>
      <div class="info">
        <div class="nm">${esc(t.name)} ${t.finished ? '<span class="badge">✅ Færdig</span>' : ''}</div>
        <div class="meta"><span>${t.correct} rigtige</span><span>${t.answered}/${total} besvaret</span>${t.finished ? `<span>⏱ ${fmtDur(t.duration_s)}</span>` : ''}</div>
        <div class="bar"><i class="${t.finished ? 'f' : ''}" style="width:${pct}%"></i></div>
      </div>
      <div><div class="pts">${t.points} pt</div>${t.finished ? `<div class="tm">${fmtDur(t.duration_s)}</div>` : ''}</div>
    </div>`;
  }).join('') : '<p style="color:var(--muted);text-align:center;padding:2rem">Ingen hold endnu</p>';
  prev = {}; teams.forEach(t => prev[t.name] = t.points); firstRender = false;

  // fotos (kun godkendte)
  const photos = d.photos || [];
  $('photos-wrap').style.display = photos.length ? 'block' : 'none';
  $('photos').innerHTML = photos.map(p => `<div class="ph"><img src="${esc(p.url)}" alt="" loading="lazy"><span>${esc(p.team)}</span></div>`).join('');

  $('updated').textContent = 'Opdateret ' + new Date().toLocaleTimeString('da-DK', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

// ── quizmaster: foto-godkendelse ──
async function loadPending() {
  const { data, error } = await sbm.schema('quiz').rpc('get_pending_photos', { p_quiz_id: quizId });
  if (error) return;
  $('pending-wrap').style.display = data?.length ? 'block' : 'none';
  $('pending').innerHTML = (data || []).map(p => `<div class="pend">
      <a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" alt=""></a>
      <div class="t"><b>${esc(p.team_name)}</b>${esc(p.question || '')}<br><span style="color:var(--gold)">${p.points ?? 0} point</span></div>
      <div class="a"><button class="mbtn green" data-id="${esc(p.submission_id)}" data-ok="1">✓ Godkend</button>
      <button class="mbtn red" data-id="${esc(p.submission_id)}" data-ok="0">✕ Afvis</button></div></div>`).join('');
}
$('pending').addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  b.disabled = true;
  const { error } = await sbm.schema('quiz').rpc('review_submission', { p_submission_id: b.dataset.id, p_approve: b.dataset.ok === '1' });
  if (error) { alert('Fejl: ' + error.message); b.disabled = false; return; }
  load();
});

// ── quizmaster: afslut / ny runde ──
$('btn-end').onclick = async () => {
  if (!confirm('Afslut løbet nu? Holdene kan ikke spille videre.')) return;
  await setStatus('arkiveret', '🏁 Løbet er afsluttet');
};
$('btn-reopen').onclick = async () => {
  if (!confirm('Start en NY runde?\n\nHoldene starter forfra med nul point. Resultaterne fra forrige runde gemmes og kan ses via rundevælgeren.')) return;
  viewRound = null;
  await setStatus('aktiv', '▶ Ny runde er startet');
};
async function setStatus(status, okMsg) {
  const { error } = await sbm.schema('quiz').rpc('set_quiz_status', { p_quiz_id: quizId, p_status: status });
  $('mgr-msg').textContent = error ? '❌ ' + error.message : okMsg;
  setTimeout(() => { $('mgr-msg').textContent = ''; }, 6000);
  load();
}

$('round-sel').onchange = e => { viewRound = Number(e.target.value); firstRender = true; load(); };
$('tv-btn').onclick = () => document.body.classList.toggle('tv');
if (qs.get('tv') === '1') document.body.classList.add('tv');

// ── start: poll hvert 5. sek (kun når fanen er synlig) ──
detectManager().then(load);
setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
