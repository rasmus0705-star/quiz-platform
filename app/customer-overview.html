<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine løb – Quiz Platform</title>
  <link rel="stylesheet" href="../themes/standard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <style>
    .status-pill {
      display:inline-block; padding:.2rem .6rem; border-radius:99px;
      font-size:.75rem; font-weight:600; vertical-align:middle;
    }
    .s-kladde    { background:#555; color:#fff; }
    .s-testing   { background:#f59e0b; color:#000; }
    .s-aktiv     { background:#4caf50; color:#fff; }
    .s-arkiveret { background:#374151; color:#aaa; }

    .quiz-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:.75rem 0; border-bottom:1px solid rgba(255,255,255,.07);
      gap:.5rem;
    }
    .quiz-row:last-child { border-bottom:none; }

    .btn-sm { padding:.3rem .65rem; font-size:.8rem; }
    .btn-ghost { background:rgba(255,255,255,.08); }
    .muted { color:var(--text-muted); font-size:.82rem; }

    /* QR modal */
    #qr-modal {
      display:none; position:fixed; inset:0; z-index:9999;
      background:rgba(0,0,0,.75); align-items:center; justify-content:center;
    }
    #qr-modal.open { display:flex; }
    #qr-box {
      background:var(--surface); border-radius:var(--radius);
      padding:1.5rem; text-align:center; max-width:320px; width:90%;
    }
    #qr-box h3 { margin-bottom:.5rem; }
    #qr-canvas { margin:.75rem auto; }
    #qr-url { font-size:.7rem; color:var(--text-muted); word-break:break-all; margin-bottom:.75rem; }
  </style>
</head>
<body class="page-transition">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
    <h2 style="margin:0;font-size:1.1rem;">🗺️ Mine løb</h2>
    <button class="btn btn-sm btn-ghost" onclick="signOut()">Log ud</button>
  </div>

  <div id="customer-name" class="muted" style="margin-bottom:1rem;"></div>
  <div id="quiz-list"><p class="muted">Indlæser…</p></div>

  <!-- QR modal -->
  <div id="qr-modal" onclick="if(event.target===this)closeQR()">
    <div id="qr-box">
      <h3 id="qr-title"></h3>
      <div id="qr-canvas"></div>
      <div id="qr-url"></div>
      <div style="display:flex;gap:.5rem;justify-content:center;">
        <button class="btn btn-sm" onclick="window.print()">🖨️ Print</button>
        <button class="btn btn-sm btn-ghost" onclick="closeQR()">Luk</button>
      </div>
    </div>
  </div>

<script>
let customerId = null

async function init() {
  const session = await getSession()
  if (!session) { location.href = 'login.html'; return; }
  if (session.type === 'pin') {
    if (session.is_admin) { location.href = 'overview.html'; return; }
    activatePinClient()
    customerId = session.customer_id
  }

  // Hent kundenavn
  const { data: customer } = await sb.schema('quiz').from('customers')
    .select('name').eq('id', customerId).single()
  if (customer) {
    document.getElementById('customer-name').textContent = 'Logget ind som: ' + customer.name
  }

  // Hent løb
  const { data: quizzes, error } = await sb.schema('quiz').from('quizzes')
    .select('id, title, status, created_at')
    .eq('customer_id', customerId)
    .order('created_at', { ascending: false })

  const el = document.getElementById('quiz-list')
  if (error) { el.innerHTML = '<p class="muted">Kunne ikke hente løb.</p>'; return; }
  if (!quizzes || !quizzes.length) {
    el.innerHTML = '<p class="muted">Ingen løb endnu — kontakt din administrator.</p>'
    return
  }

  el.innerHTML = quizzes.map(q => `
    <div class="card quiz-row">
      <div>
        <strong>${escHtml(q.title || '(uden titel)')}</strong>
        <span class="status-pill s-${q.status}" style="margin-left:.5rem;">${q.status}</span>
        <div class="muted">${new Date(q.created_at).toLocaleDateString('da-DK')}</div>
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;">
        <a href="editor.html?q=${q.id}" class="btn btn-sm">✏️ Redigér</a>
        <button class="btn btn-sm btn-ghost" onclick="copyScoreboard('${q.id}')">📋 Scoreboard</button>
        <button class="btn btn-sm btn-ghost" onclick="showQR(getScoreboardUrl('${q.id}'),'Scoreboard – ${escHtml(q.title||'')}')">📱 QR</button>
        <button class="btn btn-sm btn-ghost" onclick="mailScoreboard('${q.id}','${escHtml(q.title||'')}')">📧 Del</button>
      </div>
    </div>`).join('')
}

function getScoreboardUrl(quizId) {
  return location.origin + location.pathname.replace('app/customer-overview.html','board/scoreboard.html') + '?q=' + quizId
}

function copyScoreboard(quizId) {
  navigator.clipboard.writeText(getScoreboardUrl(quizId))
    .then(() => alert('✅ Scoreboard-link kopieret'))
}

function mailScoreboard(quizId, title) {
  const url = getScoreboardUrl(quizId)
  const subject = encodeURIComponent('Scoreboard – ' + title)
  const body = encodeURIComponent('Se live scoreboard her:\n' + url)
  window.open('mailto:?subject=' + subject + '&body=' + body)
}

function showQR(url, title) {
  document.getElementById('qr-title').textContent = title
  document.getElementById('qr-url').textContent = url
  const canvas = document.getElementById('qr-canvas')
  canvas.innerHTML = ''
  new QRCode(canvas, { text: url, width: 220, height: 220,
    colorDark:'#000000', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M })
  document.getElementById('qr-modal').classList.add('open')
}
function closeQR() { document.getElementById('qr-modal').classList.remove('open') }

function escHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

init()
</script>
</body>
</html>
