<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizjagten – live-scoreboard</title>
<style>
:root{--bg:#0b0d1a;--panel:#151933;--line:#2a3060;--txt:#e9ecff;--mut:#9aa3d6;--acc:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px 10px}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
h1 span{color:var(--mut);font-weight:400}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab small{opacity:.6;margin-right:4px}
button.b,select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:10px;font-size:14px;cursor:pointer}
button.b.on{border-color:#3ddc97;color:#3ddc97}
button.primary{background:#ffd23f;color:#1a1300;border-color:#ffd23f;font-weight:800}
#stageWrap{padding:12px 18px 8px}
#stage{width:100%;aspect-ratio:16/9;max-height:74vh;display:block;border-radius:16px;background:#070914;border:1px solid var(--line)}
#desc{padding:4px 18px 4px;color:var(--txt);font-size:15px;line-height:1.55;max-width:980px}
#desc b{color:#ffd23f}
#tips{padding:4px 18px 22px;color:var(--mut);font-size:13px;line-height:1.5;max-width:980px}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
body.embedded header h1{font-size:16px}body.embedded header h1 span{font-size:12px}
body.embedded #next,body.embedded #auto,body.embedded #nTeams,body.embedded #reset{display:none}
body.embedded #fullscreen,body.embedded #snd{display:none}
body.embedded .tabs{display:none}
body.embedded header{padding:10px 14px 8px}body.embedded .tabs{padding:0 14px}body.embedded #stageWrap{padding:8px 14px}
body.embedded #tips,body.embedded #desc{display:none}body.embedded #stage{height:calc(100vh - 110px);aspect-ratio:auto;max-height:none}
#fullscreen-exit{display:none;position:fixed;z-index:5;top:14px;right:14px;border:1px solid rgba(255,255,255,.4);background:rgba(11,13,26,.82);color:#fff;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)}
html:fullscreen,html:fullscreen body{width:100%;height:100%;overflow:hidden;background:#070914}
html:fullscreen header,html:fullscreen .tabs,html:fullscreen #desc,html:fullscreen #tips{display:none!important}
html:fullscreen #stageWrap{position:fixed;inset:0;padding:0}
html:fullscreen #stage{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border:0;border-radius:0}
html:fullscreen #fullscreen-exit{display:block}
body.graphic-fullscreen{width:100vw;height:100vh;overflow:hidden;background:#070914}
body.graphic-fullscreen header,body.graphic-fullscreen .tabs,body.graphic-fullscreen #desc,body.graphic-fullscreen #tips{display:none!important}
body.graphic-fullscreen #stageWrap{position:fixed;inset:0;padding:0}
body.graphic-fullscreen #stage{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border:0;border-radius:0}
body.graphic-fullscreen #fullscreen-exit{display:block}
@media(max-width:600px){body.embedded header{padding:6px 10px}body.embedded .tabs{gap:4px}body.embedded .tab{padding:6px 8px;font-size:11px}body.embedded #stage{height:calc(100vh - 140px)}}
</style>
</head>
<body>
<header>
  <h1>Live-scoreboard <span>· værtsstyret</span></h1>
  <div class="ctrl">
    <button class="b primary" id="next">Næste spørgsmål ▸</button>
    <button class="b" id="auto">Auto: fra</button>
    <select id="nTeams" aria-label="Antal hold"></select>
    <button class="b on" id="snd">Lyd: til</button>
    <button class="b" id="fullscreen">⛶ Fuld skærm</button>
    <button class="b" id="reset">Nulstil</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="stageWrap"><canvas id="stage"></canvas></div>
<div id="desc"></div>
  <div id="tips"><kbd>Mellemrum</kbd> næste runde · <kbd>1</kbd>–<kbd>5</kbd> skift visning · Opladning, pointanimationer, førerbanner, konfetti, stimebonus og lyd.</div>
<button id="fullscreen-exit" type="button">Luk fuld skærm ✕</button>

<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const EXTERNAL=new URLSearchParams(location.search).has('embed');
if(EXTERNAL)document.body.classList.add('embedded');
let W=800,H=450,CW=800,CH=450,DPR=1;
let viewMode=localStorage.getItem('quizjagten-board-view')||'split',liveQuestion=null,priorRanks=new Map(),nextCountdown=0;
const graphicHeader=()=>liveQuestion&&viewMode==='graphic'?Math.max(104,CH*.16):0;
function resize(){const r=cv.getBoundingClientRect();if(r.width<80||r.height<80)return;const oldW=W,oldH=H;CW=r.width;CH=r.height;DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(80,CW-(liveQuestion&&viewMode==='graphic'?CW*.24:0));H=Math.max(80,CH-graphicHeader());cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(teams.length&&oldW>0&&oldH>0){const sx=W/oldW,sy=H/oldH;teams.forEach(t=>{t.x*=sx;t.y*=sy;t.r*=Math.min(sx,sy);});particles.forEach(p=>{p.x*=sx;p.y*=sy;if(p.px!=null)p.px*=sx;if(p.py!=null)p.py*=sy;});floaters.forEach(f=>{f.x*=sx;f.y*=sy;});}}
new ResizeObserver(resize).observe(cv);window.addEventListener('resize',resize);
function setViewMode(mode){if(!['question','split','graphic'].includes(mode))return;viewMode=mode;localStorage.setItem('quizjagten-board-view',mode);resize();}

const PALETTE=[['#ff4d6d','Ræven'],['#4dabff','Uglen'],['#ffd23f','Bjørnen'],['#3ddc97','Haren'],['#b388ff','Ulven'],['#ff8c42','Lossen'],['#00e5ff','Ørnen'],['#ff6ec7','Grævlingen']];
const GOAL=10000,SUSP=1600,REV=1300;
let teams=[],phase='idle',phaseT=0,round=0,leaderIdx=-1,winner=-1,gameOver=false,concept='bubbles',muted=EXTERNAL&&localStorage.getItem('quizjagten-board-muted')!=='false',auto=false,autoTimer=null;
let particles=[],floaters=[],banner=null,flash=0,shake=0;

const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const fmt=n=>Math.round(n).toLocaleString('da-DK');
function rr(x,y,w,h,r){ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function font(size,weight){ctx.font=`${weight||700} ${Math.round(size)}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;}

/* ---------- lyd ---------- */
let AC=null,master=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.22;master.connect(AC.destination);}catch(e){AC=null}}
function tone(f,dur,type,vol,when,slide){if(!AC||muted)return;const t0=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.2,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,f0,f1){if(!AC||muted)return;const len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=buf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;const t0=AC.currentTime;bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(bp);bp.connect(g);g.connect(master);s.start();}
const sfx={
  suspense(){tone(160,1.6,'sawtooth',.05,0,640);tone(80,1.6,'sine',.18,0,320);for(let i=0;i<8;i++)tone(400+i*60,.05,'square',.03,i*.2);},
  whoosh(){noise(.55,.55,300,3200);tone(220,.4,'triangle',.12,0,880);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.09));},
  tick(i){tone(500+Math.min(i,30)*35,.06,'square',.035);},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.12));}
};

/* ---------- state ---------- */
function makeTeams(n){
  teams=PALETTE.slice(0,n).map(([c,name],i)=>({i,name,color:c,score:0,from:0,disp:0,vis:0,gain:0,streak:0,pulse:0,charge:0,boost:0,hit:0,x:0,y:0,vx:0,vy:0,r:30,rv:0,rot:Math.random()*6,waves:[],waveT:0}));
  round=0;leaderIdx=-1;winner=-1;particles=[];floaters=[];banner=null;phase='idle';phaseT=0;
  C[concept].init();
}
function leader(){let best=-1,bs=-1,tie=false;teams.forEach(t=>{if(t.score>bs){bs=t.score;best=t.i;tie=false}else if(t.score===bs)tie=true});return bs>0&&!tie?best:-1}
function nextRound(){
  if(EXTERNAL||phase!=='idle')return;audioInit();if(AC&&AC.state==='suspended')AC.resume();
  round++;
  teams.forEach(t=>{const ok=Math.random()<.6;t.gain=ok?Math.round(rnd(500,1000)/10)*10:0;if(ok&&t.streak>=2)t.gain+=100*Math.min(t.streak,5);t.from=t.score;});
  phase='suspense';phaseT=0;sfx.suspense();
}
function anchor(t){return C[concept].anchor(t)}
function addFloater(t){const a=anchor(t);floaters.push({x:a.x,y:a.y,text:'+'+fmt(t.gain),color:t.color,life:1,streak:t.streak})}
function confetti(x,y,color,n){const cols=[color,'#ffffff','#ffd23f',color,PALETTE[Math.floor(Math.random()*8)][0]];for(let i=0;i<n;i++)particles.push({type:'conf',x,y,vx:rnd(-420,420),vy:rnd(-700,-180),rot:rnd(0,6),vr:rnd(-12,12),color:cols[i%cols.length],life:1,size:rnd(5,10)})}
function sparks(x,y,color,n,dir,spd){for(let i=0;i<n;i++){const a=dir==null?rnd(0,Math.PI*2):dir+rnd(-.7,.7);const s=rnd(.3,1)*(spd||300);particles.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1})}}
function checkLeader(){
  const l=leader();
  if(l>=0&&l!==leaderIdx){const first=leaderIdx<0;leaderIdx=l;const t=teams[l];banner={text:(first?'Første fører: ':'Ny fører: ')+t.name,color:t.color,t:0};flash=1;const a=anchor(t);confetti(a.x,a.y,t.color,first?50:110);sfx.fanfare();if(C[concept].onLeader)C[concept].onLeader();}
  if(winner<0&&leaderIdx>=0&&(EXTERNAL?gameOver:teams[leaderIdx].score>=GOAL)){winner=leaderIdx;const t=teams[winner];banner={text:t.name+' vinder!',color:t.color,t:-.6,big:true};setTimeout(()=>{for(let k=0;k<5;k++)confetti(W*(k+.5)/5,H*.3,t.color,70);sfx.win();flash=1;},500);setAuto(false);}
}

/* ---------- koncepter ---------- */
const C={};

/* 1. Bobler */
C.bubbles={
  label:'Tyngdekraft-boblerne',
  desc:'<b>Bobler:</b> Hver boble har et areal svarende til holdets <i>andel</i> af de samlede point – så føreren kan aldrig sprænge skærmen, men skubber fysisk de andre ud mod kanten. Kronen hopper over, når føringen skifter. Byggetip: simpel 2D-fysik (tiltrækning mod midten, stærkest for de store + kollisioner) – intet bibliotek nødvendigt.',
  init(){const n=teams.length;teams.forEach((t,i)=>{const a=i/n*Math.PI*2;t.x=W/2+Math.cos(a)*W*.22;t.y=H/2+Math.sin(a)*H*.22;t.vx=t.vy=0;t.r=10;t.rv=0;});this.crown={x:W/2,y:-60,sx:W/2,sy:-60,h:1,a:0};},
  targetR(t){const base=400;let sum=0;teams.forEach(o=>sum+=Math.max(0,o.vis)+base);const share=(Math.max(0,t.vis)+base)/sum;const area=Math.min(.40,.13*teams.length)*clamp(1.9/(W/H),.5,1);return clamp(Math.sqrt(share*W*H*area/Math.PI),18,Math.min(W,H)*.35)},
  update(dt){
    const cx=W/2,cy=H/2;let avg=0;teams.forEach(t=>avg+=t.r);avg/=teams.length;
    teams.forEach(t=>{const rt=this.targetR(t);t.rv+=(150*(rt-t.r)-8*t.rv)*dt;t.r=Math.max(10,t.r+t.rv*dt);
      const g=1.8*(t.r/avg);t.vx+=((cx-t.x)*g+rnd(-30,30))*dt;t.vy+=((cy-t.y)*g*1.5+rnd(-30,30))*dt;const d=Math.pow(.1,dt);t.vx*=d;t.vy*=d;t.x+=t.vx*dt;t.y+=t.vy*dt;});
    for(let k=0;k<3;k++)for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){const a=teams[i],b=teams[j];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.01;const min=a.r+b.r+6;if(d<min){const ov=min-d;dx/=d;dy/=d;const ma=a.r*a.r,mb=b.r*b.r,s=ma+mb;a.x-=dx*ov*mb/s;a.y-=dy*ov*mb/s;b.x+=dx*ov*ma/s;b.y+=dy*ov*ma/s;a.vx-=dx*ov*2*mb/s;a.vy-=dy*ov*2*mb/s;b.vx+=dx*ov*2*ma/s;b.vy+=dy*ov*2*ma/s;}}
    teams.forEach(t=>{if(t.x<t.r){t.x=t.r;t.vx=Math.abs(t.vx)*.5}if(t.x>W-t.r){t.x=W-t.r;t.vx=-Math.abs(t.vx)*.5}if(t.y<t.r){t.y=t.r;t.vy=Math.abs(t.vy)*.5}if(t.y>H-t.r){t.y=H-t.r;t.vy=-Math.abs(t.vy)*.5}});
    const c=this.crown;
    if(leaderIdx>=0){const L=teams[leaderIdx],s=clamp(L.r*.32,16,34),tx=L.x,ty=L.y-L.r-s*.2;c.a=Math.min(1,c.a+dt*3);
      if(c.h<1){c.h=Math.min(1,c.h+dt/.7);const p=easeInOut(c.h);c.x=lerp(c.sx,tx,p);c.y=lerp(c.sy,ty,p)-Math.sin(Math.PI*p)*120;}else{c.x=tx;c.y=ty;}}
  },
  onLeader(){const c=this.crown;c.sx=c.a>0?c.x:W/2;c.sy=c.a>0?c.y:-60;c.h=0;},
  draw(time){
    const g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#1a1f45');g.addColorStop(1,'#070914');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    [...teams].sort((a,b)=>a.r-b.r).forEach(t=>{
      const jit=t.charge*5,x=t.x+rnd(-jit,jit),y=t.y+rnd(-jit,jit)+Math.sin(time*1.3+t.i)*2,r=t.r,lead=t.i===leaderIdx;
      ctx.save();if(lead){ctx.shadowColor=t.color;ctx.shadowBlur=40+12*Math.sin(time*4);}
      const gr=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,hexA(t.color,.98));gr.addColorStop(1,hexA(t.color,.55));
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.lineWidth=lead?4:2;ctx.strokeStyle=lead?'#ffffff':t.color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(x-r*.32,y-r*.45,r*.32,r*.16,-.5,0,Math.PI*2);ctx.fill();
      if(t.charge>0){ctx.save();ctx.setLineDash([8,8]);ctx.lineDashOffset=-time*80;ctx.strokeStyle=hexA('#ffffff',.4+.6*t.charge);ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+8+6*t.charge,0,Math.PI*2);ctx.stroke();ctx.restore();}
      if(t.pulse>0){ctx.strokeStyle=hexA(t.color,t.pulse);ctx.lineWidth=4*t.pulse;ctx.beginPath();ctx.arc(x,y,r*(1+(1-t.pulse)*.7),0,Math.PI*2);ctx.stroke();}
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=6;
      if(r>38){font(clamp(r*.24,11,26),700);ctx.fillText(t.name,x,y-r*.2);font(clamp(r*.34,13,40),900);ctx.fillText(fmt(t.disp),x,y+r*.18);}else{font(clamp(r*.45,11,18),900);ctx.fillText(fmt(t.disp),x,y);}
      ctx.shadowBlur=0;
    });
    const c=this.crown;if(c.a>0&&leaderIdx>=0){ctx.globalAlpha=c.a;drawCrown(c.x,c.y+Math.sin(time*5)*3,clamp(teams[leaderIdx].r*.32,16,34),Math.sin(time*2)*.08);ctx.globalAlpha=1;}
  },
  anchor(t){return{x:t.x,y:t.y-t.r*.55}}
};
function drawCrown(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='#ffd23f';ctx.shadowBlur=18;ctx.fillStyle='#ffd23f';ctx.strokeStyle='#8a6500';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s,s*.45);ctx.lineTo(-s,-s*.35);ctx.lineTo(-s*.5,s*.05);ctx.lineTo(0,-s*.65);ctx.lineTo(s*.5,s*.05);ctx.lineTo(s,-s*.35);ctx.lineTo(s,s*.45);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.stroke();[[-s,-s*.35],[0,-s*.65],[s,-s*.35]].forEach(([a,b])=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a,b,s*.13,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(0,s*.15,s*.15,0,Math.PI*2);ctx.fill();ctx.restore();}

/* 2. Raketter */
C.rockets={
  label:'Rumkapløbet',V:5000,
  desc:'<b>Raketter:</b> Kameraet følger føreren. Når nogen stikker af, ruller stjernerne forbi, og de bagerste forsvinder ud af bunden med en pil, der viser afstanden. Flammen blusser op ved point, og raketter i tæt kamp ryster. Målet er 10.000 point. Byggetip: placér alt i "point-koordinater" og flyt kun kameraet – så skalerer det til ethvert pointniveau.',
  init(){this.cam=0;this.stars=[...Array(170)].map(()=>({x:Math.random(),y:Math.random(),z:rnd(.15,1),s:rnd(.4,2)}));},
  geo(){return{top:90,bot:H-95}},
  yOf(v){const{top,bot}=this.geo();return bot-(v-this.cam)/this.V*(bot-top)},
  laneX(i){return 80+(W-120)*(i+.5)/teams.length},
  size(){return clamp((W-120)/teams.length*.2,13,30)},
  update(dt){const mx=Math.max(...teams.map(t=>t.vis));const tg=Math.max(0,mx-this.V*.7);this.cam+=(tg-this.cam)*Math.min(1,2.2*dt);
    const s=this.size();teams.forEach(t=>{if(t.boost>.2&&Math.random()<.7){const y=this.yOf(t.vis);if(y<H+20)particles.push({type:'smoke',x:this.laneX(t.i)+rnd(-4,4),y:y+s*1.4,vx:rnd(-25,25),vy:rnd(40,110),size:rnd(4,9),life:1});}});},
  draw(time){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05061a');g.addColorStop(.6,'#151040');g.addColorStop(1,'#2a1550');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const{top,bot}=this.geo(),scroll=this.cam/this.V*(bot-top);
    this.stars.forEach(s=>{const y=((s.y*H+scroll*s.z*.7)%H+H)%H;const tw=.5+.5*Math.sin(time*3+s.x*40);ctx.fillStyle=`rgba(255,255,255,${.25+.6*s.z*tw})`;ctx.fillRect(s.x*W,y,s.s,s.s*(1+(this.cam>0?s.z*2:0)));});
    font(12,600);ctx.textAlign='left';ctx.textBaseline='middle';

  init(){const e=[0];this.grads.forEach(g=>e.push(e[e.length-1]+g));const mx=e[e.length-1];this.elev=e.map(v=>v/mx);},

  let orbN=0;
  particles.forEach(p=>{
    if(p.type==='conf'){p.vy+=480*dt;p.vx*=Math.pow(.5,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt*.4;}

}

async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{fullscreenButton.textContent='Fuld skærm understøttes ikke';setTimeout(()=>fullscreenButton.textContent='⛶ Fuld skærm',2200);}}
fullscreenButton.onclick=toggleFullscreen;
document.getElementById('fullscreen-exit').onclick=()=>{
  if(EXTERNAL)parent.postMessage({type:'quizjagten-exit-fullscreen'},location.origin);
  else document.exitFullscreen?.();
};
sel.onchange=()=>{setAuto(false);makeTeams(+sel.value);};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!EXTERNAL){e.preventDefault();nextRound();}const i=+e.key;if(i>=1&&i<=5)setConcept(ORDER[i-1]);});
resize();if(!EXTERNAL)makeTeams(5);const savedConcept=localStorage.getItem('quizjagten-board-concept');setConcept(EXTERNAL&&ORDER.includes(savedConcept)?savedConcept:'bubbles');requestAnimationFrame(frame);
</script>
</body>
